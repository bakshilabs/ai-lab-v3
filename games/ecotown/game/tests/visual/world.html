<!doctype html><html><head><meta charset="utf-8"><title>World test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif}#sky{position:fixed;inset:0}#sky canvas.stars{position:absolute;inset:0;opacity:0}#gl{position:fixed;inset:0;width:100%;height:100%}#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}#fade.on{opacity:1}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.min.js", "three/addons/": "../../vendor/addons/" } }</script></head>
<body><div id="sky"></div><canvas id="gl"></canvas><div id="fade"></div>
<script type="module">
import { createStage } from '../../js/engine/stage.js';
import { createWorld } from '../../js/world/world.js';
import { createRig } from '../../js/camera/rig.js';
import { makeTerrain } from '../../js/world/terrain.js';
import { plan, applyPlacements } from '../../js/sim/planner.js';
import { simulate } from '../../js/sim/sim.js';
const q = new URLSearchParams(location.search);
const stage = createStage(document.getElementById('gl'), document.getElementById('sky'));
stage.setTier(q.get('tier') || 'high');
const terrain = makeTerrain(q.get('island') || 'home'); /* ?island=delta|hills, with ?levels=0 (the plans are for the home island) */ const world = createWorld(stage, terrain); const rig = createRig(stage, document.getElementById('gl'), document.getElementById('fade'));
const upto = +(q.get('levels') ?? 6); const vague = q.get('vague');
const L = [['land',['dry','sunny','keep_meadow']],['move',['safe_walking','cycling','cars_at_edge']],['homes',['warm','low_carbon','natural_materials']],['food',['enough_food','keep_hedges','bees']],['power',['enough_power','winter','night','storage','solar']],['heart',['walk_time','market','nature_links']]];
let cells = new Map();
L.slice(0, upto).forEach(([lv, s], i) => { const p = plan(lv, (vague && i === upto-1) ? [vague] : s, { terrain, cells, numbers:{minutes:10} }); cells = applyPlacements(cells, p.placements); });
// ?place=9,6:timber;10,6:wild puts builds (or marks) on tiles; ?focus=9,6:80:0.6 frames one tile (art checks)
if (q.get('place')) for (const pair of q.get('place').split(';')) { const i = pair.lastIndexOf(':'); const k = pair.slice(0, i), it = pair.slice(i + 1); cells.set(k, it === 'town' || it === 'wild' ? { mark: it, item: null, mods: [] } : { mark: 'town', item: it, mods: [] }); }
for (const [k, c] of cells) world.setCell(k, c);
const sim = simulate(terrain, cells); world.setLights(sim.power.winterOK || !upto ? sim.homes.map(h=>h.k) : []);
stage.setTime(+(q.get('hour') ?? 12.5), +(q.get('winter') ?? 0));
if (q.get('flood')) world.setFlood(+q.get('flood'));
if (q.get('clay')) { world.setClay(true, true); }
if (q.get('street')) { const k = terrain.school; const p = world.tileTop(k); rig.street = { base: { pos: p.clone().add({x:-8,y:2,z:-10}), look: p.clone().add({x:0,y:1.5,z:0}), fov:50 }, yaw:0, pitch:0 }; rig.mode='street'; }
if (q.get('focus')) { const [k, d, p] = q.get('focus').split(':'); const t = world.tileTop(k); Object.assign(rig.sky, { dist: +d || 80, pitch: +p || 0.6 }); rig.sky.target.copy(t); rig.sky.autoPitch = false; }
if (q.get('zoom')) { rig.sky.dist = +q.get('zoom'); rig.sky.target.set(18, 0, 8); }
let last = performance.now(), T0 = last;
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; rig.update(dt); world.update(dt,(now-T0)/1000); stage.render(dt,(now-T0)/1000); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__ready = true; window.__sim = sim;
</script></body></html>
