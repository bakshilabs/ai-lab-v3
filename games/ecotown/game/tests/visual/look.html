<!doctype html><html><head><meta charset="utf-8"><title>Eco Town look test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe6ff}#gl{position:fixed;inset:0;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.min.js", "three/addons/": "../../vendor/addons/" } }</script></head>
<body><canvas id="gl"></canvas>
<script type="module">
// Look test: one compact, dense Eco Town scene in two framings (?v=float or ?v=valley), lit like the
// deltaopslearning.com islands: crisp sun, clear shadows, bold greens, clean sky, no haze.
import * as THREE from 'three';
import { createStage } from '../../js/engine/stage.js';
import { Vox, rand, noise2 } from '../../js/engine/voxel.js';
import { BUILD, tree2, addModFine } from '../../js/world/builders.js';
const q = new URLSearchParams(location.search); const V = q.get('v') || 'float';
const stage = createStage(document.getElementById('gl'));
stage.setTier(q.get('tier') || 'mid'); stage.setTilt(0.5, +(q.get('tilt') ?? 0.6));
const { scene, camera } = stage;
// crisp brochure light: bright sun, clean sky, little haze
stage.setTime(+(q.get('hour') ?? 13.5));
stage.dome.material.uniforms.top.value.set('#2f8cf0'); stage.dome.material.uniforms.bottom.value.set('#d4ecff'); stage.dome.material.uniforms.sunAmt.value = 0.4;
scene.fog.color.set('#cfe8ff'); scene.fog.near = V === 'valley' ? 260 : 600; scene.fog.far = V === 'valley' ? 900 : 2000;
stage.sun.position.set(-70, 110, 60); stage.sun.intensity = 3.0; stage.hemi.intensity = 1.25; stage.sun.color.set('#fff2dc');
const sc = stage.sun.shadow.camera; sc.left = sc.bottom = -60; sc.right = sc.top = 60; sc.updateProjectionMatrix();

// ---------- compact island: 44 × 36 voxels, dense content
const W = 22, D = 18; // half sizes
const GR = ['#5fbf3f', '#6cc848', '#57b23a', '#74cf4f'];
const inside = (x, z) => { const a = Math.atan2(z / D, x / W); const r = Math.hypot(x / W, z / D); return r <= 1 + (noise2(Math.cos(a) * 2 + 5, Math.sin(a) * 2 + 5, 7) - 0.5) * 0.16; };
const height = (x, z) => (x > 6 && z < -2 ? 1 : 0) + (x > 13 && z < -6 ? 1 : 0); // a little terraced hill (NE)
const pond = (x, z) => Math.hypot((x + 9) / 5.5, (z - 4) / 4) < 1;
const stream = (x, z) => Math.abs(x + 9 + Math.sin(z * 0.4) - (z > 4 ? 0 : 0)) < 1.2 && z > 7;
const v = new Vox(); v.jitter = 0.06; const water = new Vox(); water.jitter = 0.03;
for (let x = -W - 2; x <= W + 2; x++) for (let z = -D - 2; z <= D + 2; z++) {
  if (!inside(x, z)) continue; const h = height(x, z); const wet = pond(x, z) || stream(x, z); const top = wet ? -1 : h;
  if (V === 'float') {
    const r = Math.hypot(x / W, z / D); const under = Math.round(14 * (1 - r * r * 0.8) + noise2(x / 3, z / 3, 4) * 4);
    for (let y = top - under; y <= top; y++) v.set(x, y, z, y === top ? (wet ? '#d9c79a' : GR[Math.floor(noise2(x * 0.4, z * 0.4, 2) * 3.6) % 4]) : y >= top - 2 ? (rand(x, y, z) > 0.5 ? '#9a6a42' : '#8a5c38') : (rand(x, y, z) > 0.5 ? '#8b8f93' : '#7b8085'));
  } else {
    for (let y = top - 3; y <= top; y++) v.set(x, y, z, y === top ? (wet ? '#d9c79a' : GR[Math.floor(noise2(x * 0.4, z * 0.4, 2) * 3.6) % 4]) : '#9a6a42');
  }
  if (wet) water.set(x, 0, z, '#4fb3ea');
}
// ---------- valley: hills rising around a lake, the village on a green peninsula
if (V === 'valley') {
  for (let x = -120; x <= 120; x++) for (let z = -110; z <= 70; z++) {
    if (inside(x, z) || inside(x - 1, z) || inside(x, z - 1)) continue;
    const d = Math.hypot(x / 1.3, z) ; const lake = d < 44 && z > -20;
    let h = lake ? -3 : Math.round(Math.max(0, (d - 40) / 9) + noise2(x / 14, z / 14, 3) * 6 * Math.min(1, (d - 40) / 30));
    if (z < -60) h += Math.round((-60 - z) / 4);
    if (lake) { v.set(x, -3, z, '#c9b98a'); water.set(x, -1, z, (x + z) % 3 ? '#4aa8e0' : '#55b3ea'); continue; }
    for (let y = h - 2; y <= h; y++) v.set(x, y, z, y === h ? (h > 9 ? '#6fae4a' : GR[Math.floor(noise2(x * 0.2, z * 0.2, 5) * 3.6) % 4]) : '#9a6a42');
    if (!lake && rand(x, z, 3) > (noise2(x / 18, z / 18, 9) > 0.5 ? 0.55 : 0.93) && x % 3 === 0 && z % 3 === 0 && d > 47) tree2(v, x, h, z, ['pine', 'round', 'pine', 'olive'][Math.floor(rand(x, z) * 4)], x);
  }
}
// ---------- trees: dense clumps in two-tone greens (brochure style)
const T2 = [[-18, -8, 'pine'], [-16, -12, 'round'], [-12, -14, 'pine'], [-20, 2, 'round'], [-19, 10, 'pine'], [-14, 13, 'round'], [16, 10, 'pine'], [19, 4, 'round'], [12, 14, 'round'], [-4, -15, 'pine'], [0, -16, 'round'], [4, -14, 'pine'], [17, -12, 'pine'], [20, -6, 'round'], [9, -15, 'round'], [-2, 13, 'pine']];
for (const [x, z, k] of T2) if (inside(x, z)) tree2(v, x, height(x, z), z, k, x * 3 + z);
for (let i = 0; i < 12; i++) { const x = Math.round(-14 + rand(i, 1) * 10), z = Math.round(-1 + rand(i, 2) * 10); if (!pond(x, z) && pond(x + 1, z) || pond(x, z + 1)) { if (!pond(x, z)) { v.set(x, 1, z, '#6b8f3a'); v.set(x, 2, z, '#7a9a40'); } } }
const ground = v.mesh(); scene.add(ground);
const wm = water.mesh({ castShadow: false }); wm.material = new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: 0.85 }); wm.position.y = -0.35; scene.add(wm);

// ---------- the village: fine houses on 6×6 lots, a lane, an orchard, a turbine
function lot(kind, ox, oz, oy = 0, mods = []) {
  const G = new Vox(), B = new Vox(), F = new Vox(); G.jitter = B.jitter = 0.06; F.jitter = 0.05; const rec = { windows: [], lamps: [], cars: [] };
  BUILD[kind](G, B, rec, { gx: ox, gz: oz }, F); for (const m of mods) addModFine(F, m);
  const g = new THREE.Group();
  if (G.size) { const m = G.mesh({ scale: 0.5, castShadow: false }); m.position.set(ox, oy + 0.62, oz); g.add(m); }
  if (B.size) { const m = B.mesh(); m.position.set(ox, oy + 1, oz); g.add(m); }
  if (F.size) { const m = F.mesh({ scale: 0.5 }); m.position.set(ox, oy + 1, oz); g.add(m); }
  scene.add(g);
}
lot('timber', -2, -8, 0, ['solar']); lot('straw', 4, -8); lot('cohousing', -2, -2); lot('reclaimed', 4, -2, 0, ['greenroof']);
lot('path', 10, -2); lot('market', 10, 4); lot('orchard', 4, 4); lot('allot', -2, 4);
lot('school', 9, -10, 1); lot('wind', 15, -14, 2); lot('battery', 16, 2);
{ const g = new THREE.Group(); const mat = new THREE.MeshLambertMaterial({ color: '#f4f6f8' }); for (let i = 0; i < 3; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 6.5, 0.3), mat); b.geometry.translate(0, 3.25, 0); b.rotation.z = i * 2.09 + 0.4; b.castShadow = true; g.add(b); } g.position.set(15 + 3.5, 2 + 1 + 13.5, -14 + 1.6); scene.add(g); }
// lamp-lit lane between the lots
const lane = new Vox(); for (let x = -3; x <= 16; x++) for (let z = 3; z <= 3; z++) lane.set(x * 2, 0, z * 2, '#e3d3a8'), lane.set(x * 2 + 1, 0, z * 2, '#d9c595');
const lm = lane.mesh({ scale: 0.5, castShadow: false }); lm.position.set(-0.5, 0.62, -1); scene.add(lm);

// ---------- camera: tight framing like the brochure
const look = new THREE.Vector3(1, -1, 0);
if (V === 'float') { camera.position.set(-50, 46, 60); camera.fov = 30; look.set(1, 0, 0); }
else { camera.position.set(-40, 34, 60); camera.fov = 36; look.set(2, -2, -4); }
camera.lookAt(look); camera.updateProjectionMatrix();
stage.render(0, 0); let t0 = performance.now();
(function loop(now) { stage.render(0.016, (now - t0) / 1000); requestAnimationFrame(loop); })(t0);
window.__ready = true;
</script></body></html>
