<style>
/* Layout: one wide figure under a short heading; the diagram scrolls sideways on a phone, the page never does. */
:root{
  --bg:#fbf4ea; --ink:#2b211c; --muted:#6f5f53; --line:#d9c6b0; --chip:#fffaf3;
  --town:#f6e6c3; --town-s:#c08a22; --lab:#d8e5ef; --lab-s:#4f7fa6; --plum:#ecdcea; --plum-s:#8a5a83;
  --terra:#f4dccd; --terra-s:#c4623d; --sage:#dfe8d3; --sage-s:#6f8f5a; --accent:#a84a28;
  --display:Fraunces,Georgia,serif; --body:Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#211813; --ink:#f3e8da; --muted:#b9a696; --line:#5a483c; --chip:#2e231d;
  --town:#3d3219; --town-s:#d9a23a; --lab:#1f3140; --lab-s:#7fa9cc; --plum:#35263a; --plum-s:#b98bb2;
  --terra:#43281d; --terra-s:#e08a66; --sage:#283422; --sage-s:#94b57c; --accent:#f0a07c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#211813; --ink:#f3e8da; --muted:#b9a696; --line:#5a483c; --chip:#2e231d;
  --town:#3d3219; --town-s:#d9a23a; --lab:#1f3140; --lab-s:#7fa9cc; --plum:#35263a; --plum-s:#b98bb2;
  --terra:#43281d; --terra-s:#e08a66; --sage:#283422; --sage-s:#94b57c; --accent:#f0a07c; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.page{max-width:1180px;margin:0 auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0;max-width:65ch;color:var(--muted)}
figure{margin:0;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:900px;height:auto;color:var(--ink);font-family:var(--body)}
figcaption{color:var(--muted);font-size:14px;max-width:75ch}
.b{stroke-width:1.5}
.big{stroke-width:2}
.town{fill:var(--town);stroke:var(--town-s)} .lab{fill:var(--lab);stroke:var(--lab-s)}
.plum{fill:var(--plum);stroke:var(--plum-s)} .terra{fill:var(--terra);stroke:var(--terra-s)}
.sage{fill:var(--sage);stroke:var(--sage-s)} .chip{fill:var(--chip);stroke:var(--line)}
.plain{fill:var(--chip);stroke:var(--terra-s)} .dash{fill:var(--chip);stroke:var(--muted);stroke-dasharray:5 4}
.t{font-size:13px;font-weight:700;fill:var(--ink)} .s{font-size:11.5px;fill:var(--muted)}
.h{font-family:var(--display);font-size:19px;font-weight:700;fill:var(--ink)}
.l{font-size:12px;font-weight:600;fill:var(--accent)}
.e{stroke:currentColor;stroke-width:1.6;fill:none} .thin{stroke-width:1.2}
</style>
</head>

  <h1>How Eco Town is structured</h1>
  <p>The game is a free-building town with an AI Lab inside it. Players move between the two, and everything they earn is added up in the club passport.</p>
