<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco Town Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1f1a; --paper:#fbf4ea; --ink:#2b211c; --muted:#6f5f53; --line:#e6d6c3;
  --terra:#c4623d; --terra-soft:#f4dccd; --sage:#6f8f5a; --sage-soft:#dfe8d3;
  --ochre:#d9a23a; --ochre-soft:#f6e6c3; --sky:#4f7fa6; --sky-soft:#d8e5ef;
  --plum:#8a5a83; --plum-soft:#ecdcea; --wood:#b07a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#deck{position:fixed;inset:0 0 56px 0;display:grid;place-items:center}
.slide{position:absolute;width:1280px;height:720px;background:var(--paper);border-radius:6px;padding:48px 72px 52px;
  display:none;flex-direction:column;transform-origin:center center;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.slide.on{display:flex}
.slide::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,var(--terra) 0 30%,var(--ochre) 30% 55%,var(--sage) 55% 80%,var(--sky) 80%)}
h1{font-family:Fraunces,Georgia,serif;font-size:84px;line-height:1.02}
h2{font-family:Fraunces,Georgia,serif;font-size:40px;line-height:1.1;margin-bottom:18px}
.title{background:linear-gradient(160deg,#fbf4ea 0%,#f6e3cf 100%);justify-content:center}
.title .island{position:absolute;right:80px;top:170px;width:440px}
.wrap{flex:1;min-height:0;display:flex}
svg.d{width:100%;height:100%;font-family:Inter,system-ui,sans-serif}

/* shared diagram parts */
.box{stroke-width:2}
.bt{font-size:19px;font-weight:700;fill:var(--ink)}
.bs{font-size:15px;fill:var(--muted)}
.edge{stroke:var(--ink);stroke-width:2;fill:none}
.edge.soft{stroke:var(--muted);stroke-dasharray:6 5}
.el{font-size:15px;font-weight:600;fill:var(--terra);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}

/* sequence diagrams */
.actor text{font-size:17px;font-weight:700;fill:var(--ink)}
.life{stroke:#cdb8a2;stroke-width:1.5;stroke-dasharray:5 5}
.msg{stroke:var(--ink);stroke-width:1.8;fill:none}
.ret{stroke:var(--muted);stroke-dasharray:6 4}
.lbl{font-size:16px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.lbl.r{fill:var(--muted)}
.num{font-size:11px;font-weight:700;fill:#fff}
.frag{fill:none;stroke:var(--terra);stroke-width:1.4}
.fragtab{fill:var(--terra-soft);stroke:var(--terra);stroke-width:1.4}
.fraglbl{font-size:13px;font-weight:700;fill:#8e3e20}
.fragcond{font-size:14px;font-style:italic;fill:#8e3e20}
.note rect{fill:var(--ochre-soft);stroke:var(--ochre)}
.note text{font-size:15px;fill:#7d5a12;font-weight:600}

#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:6px 10px;font-size:14px;z-index:5}
#bar button{background:transparent;border:0;color:#fff;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer}
#bar button:hover,#bar button:focus-visible{background:rgba(255,255,255,.18);outline:none}
#count{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
@media print{
  @page{size:1280px 720px;margin:0}
  body{background:none;overflow:visible}
  #deck{position:static;display:block}
  #bar{display:none}
  .slide{display:flex!important;position:relative;transform:none!important;box-shadow:none;border-radius:0;break-after:page}
}
</style>
</head>

<script>
// Sequence diagrams. Each step is one of:
//   [from, to, text]            a message      [from, to, text, 'r']  a reply (dashed)
//   [who, who, text]            a self-step    ['note', a, b, text]   a note across a..b
//   ['alt'|'opt', condition]    start a box    ['else', condition]    divider   ['end']
const DIAGRAMS = {
  build: {
    actors: [['P', 'Player', 'terra'], ['B', 'Build bar', 'plum'], ['G', 'Game', 'ochre'], ['M', 'Simulation', 'sky'], ['R', 'Residents', 'sage'], ['F', 'Florence', 'sage']],
    steps: [
      ['P', 'B', 'Pick a build'],
      ['B', 'P', 'Good spots ★', 'r'],
      ['P', 'G', 'Tap a tile'],
      ['G', 'G', 'Construction film'],
      ['G', 'M', 'Simulate'],
      ['M', 'R', 'React'],
      ['M', 'G', 'Goals · score · unlocks', 'r'],
      ['opt', 'something changed'],
      ['G', 'F', 'Advise'],
      ['F', 'P', 'One-line tip'],
      ['end'],
    ],
  },
  mission: {
    actors: [['P', 'Player', 'terra'], ['L', 'AI Lab', 'plum'], ['E', 'Episode', 'ochre'], ['F', 'Florence', 'sage'], ['I', 'Practice island', 'sky'], ['T', 'Your town', 'ochre']],
    steps: [
      ['P', 'L', 'Open 🧪'],
      ['L', 'E', 'Opening film'],
      ['P', 'F', '“Find the best land”'],
      ['F', 'I', 'Plan · 82% sure'],
      ['P', 'I', 'Flood lens'],
      ['I', 'P', 'It floods!', 'r'],
      ['P', 'F', 'Clearer instruction'],
      ['F', 'I', 'Better plan'],
      ['L', 'P', '★★★ + AI habit'],
      ['opt', 'use Florence’s plan'],
      ['L', 'T', 'Add her plan'],
      ['end'],
      ['L', 'E', 'Closing film'],
      ['L', 'T', 'Lens earned'],
    ],
  },
  catch: {
    actors: [['F', 'Florence', 'sage'], ['P', 'Player', 'terra'], ['L', 'Lens', 'plum'], ['M', 'Simulation', 'sky'], ['G', 'Game', 'ochre']],
    steps: [
      ['F', 'P', '“89% sure!”'],
      ['alt', 'check it'],
      ['P', 'L', 'Use a lens'],
      ['L', 'M', 'Test the plan'],
      ['M', 'P', 'Problem shown', 'r'],
      ['P', 'G', '“Wrong”'],
      ['G', 'P', '★1 catch', 'r'],
      ['else', 'trust it'],
      ['P', 'G', 'Use it'],
      ['F', 'P', '“Oops” + why'],
      ['end'],
    ],
  },
  share: {
    actors: [['A', 'Device A', 'terra'], ['C', 'Town code', 'plum'], ['B', 'Device B', 'sage'], ['M', 'Simulation', 'sky']],
    steps: [
      ['A', 'C', 'Encode town'],
      ['C', 'A', 'Code + QR', 'r'],
      ['A', 'B', 'Show the code'],
      ['B', 'C', 'Decode + check'],
      ['B', 'M', 'Re-simulate'],
      ['M', 'B', 'Score + medal', 'r'],
      ['B', 'B', 'Visit (read-only)'],
      ['note', 'A', 'M', 'No server · no accounts · no chat'],
    ],
  },
};

function seq(svg, d) {
  const NS = 'http://www.w3.org/2000/svg';
  const W = 1136, boxH = 44, gap = 38, colW = W / d.actors.length, id = svg.dataset.seq;
  const idx = Object.fromEntries(d.actors.map((a, i) => [a[0], i]));
  const X = (k) => colW * (idx[k] + 0.5);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue('--' + v).trim();
  const out = [];
  const make = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  };
  const el = (tag, attrs, text) => { const n = make(tag, attrs, text); out.push(n); return n; };

  let y = boxH + 34, num = 0;
  const open = [], body = [];
  for (const s of d.steps) {
    if (s[0] === 'alt' || s[0] === 'opt') { open.push({ kind: s[0], y0: y - 6, divs: [], cond: s[1] }); y += 44; continue; }
    if (s[0] === 'else') { open[open.length - 1].divs.push({ y: y - 6, cond: s[1] }); y += 44; continue; }
    if (s[0] === 'end') { const f = open.pop(); f.y1 = y - 10; body.push({ frag: f }); y += 22; continue; }
    if (s[0] === 'note') { body.push({ note: s, y }); y += 44; continue; }
    num++;
    if (s[0] === s[1]) { body.push({ self: s, y, num }); y += gap + 16; continue; }
    body.push({ msg: s, y, num }); y += gap;
  }
  const H = y + 4;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMin meet');

  const defs = el('defs', {});
  defs.innerHTML = `<marker id="ah-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${css('ink')}"/></marker>
  <marker id="ar-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="${css('muted')}" stroke-width="1.6"/></marker>`;

  d.actors.forEach(([k, name, t]) => {
    el('line', { class: 'life', x1: X(k), x2: X(k), y1: boxH, y2: H });
    const w = Math.min(colW - 16, Math.max(120, name.length * 10 + 30));
    const g = el('g', { class: 'actor' });
    g.append(
      make('rect', { x: X(k) - w / 2, y: 0, width: w, height: boxH, rx: 10, fill: css(t + '-soft'), stroke: css(t), 'stroke-width': 1.8 }),
      make('text', { x: X(k), y: boxH / 2 + 6, 'text-anchor': 'middle' }, name));
  });
  const badge = (x, yy, n) => { el('circle', { cx: x, cy: yy, r: 10, fill: css('terra') }); el('text', { class: 'num', x, y: yy + 4, 'text-anchor': 'middle' }, n); };

  for (const b of body) {
    if (b.frag) {
      const f = b.frag, x0 = 6, x1 = W - 6;
      el('rect', { class: 'frag', x: x0, y: f.y0, width: x1 - x0, height: f.y1 - f.y0, rx: 6 });
      el('path', { class: 'fragtab', d: `M${x0} ${f.y0 + 6} q0 -6 6 -6 h44 v14 l-8 8 h-42 z` });
      el('text', { class: 'fraglbl', x: x0 + 9, y: f.y0 + 16 }, f.kind);
      el('text', { class: 'fragcond', x: x0 + 64, y: f.y0 + 17 }, `[${f.cond}]`);
      for (const dv of f.divs) {
        el('line', { class: 'frag', x1: x0, x2: x1, y1: dv.y, y2: dv.y, 'stroke-dasharray': '6 4' });
        el('text', { class: 'fragcond', x: x0 + 10, y: dv.y + 18 }, `[${dv.cond}]`);
      }
    } else if (b.note) {
      const [, a, c, text] = b.note;
      const xa = Math.min(X(a), X(c)) - colW * 0.4, xc = Math.max(X(a), X(c)) + colW * 0.4;
      const g = el('g', { class: 'note' });
      g.append(make('rect', { x: xa, y: b.y - 16, width: xc - xa, height: 32, rx: 7 }),
        make('text', { x: (xa + xc) / 2, y: b.y + 5, 'text-anchor': 'middle' }, text));
    } else if (b.self) {
      const [k, , text] = b.self, x = X(k), yy = b.y - 8;
      el('path', { class: 'msg', d: `M${x} ${yy} h38 v22 h-38`, 'marker-end': `url(#ah-${id})` });
      badge(x + 58, yy + 11, b.num);
      el('text', { class: 'lbl', x: x + 75, y: yy + 17 }, text);
    } else {
      const [a, c, text, r] = b.msg, xa = X(a), xc = X(c), dir = xc > xa ? 1 : -1, x0 = Math.min(xa, xc);
      el('line', { class: 'msg' + (r ? ' ret' : ''), x1: xa + dir * 4, x2: xc - dir * 4, y1: b.y, y2: b.y, 'marker-end': `url(#${r ? 'ar' : 'ah'}-${id})` });
      badge(x0 + 18, b.y - 14, b.num);
      el('text', { class: 'lbl' + (r ? ' r' : ''), x: x0 + 35, y: b.y - 8 }, text);
    }
  }
  svg.replaceChildren(...out);
}
document.querySelectorAll('svg[data-seq]').forEach((s) => seq(s, DIAGRAMS[s.dataset.seq]));
</script>
<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const count = document.getElementById('count');
  let i = 0;
  const fromHash = parseInt((location.hash || '').slice(1), 10);
  if (fromHash >= 1 && fromHash <= slides.length) i = fromHash - 1;
  function fit() {
    const s = Math.min(innerWidth / 1280, (innerHeight - 56) / 720) * 0.96;
    slides.forEach((el) => { el.style.transform = `scale(${s})`; });
  }
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((el, k) => el.classList.toggle('on', k === i));
    count.textContent = `${i + 1} / ${slides.length}`;
    history.replaceState(null, '', '#' + (i + 1));
  }
  document.getElementById('prev').onclick = () => show(i - 1);
  document.getElementById('next').onclick = () => show(i + 1);
  document.getElementById('full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  };
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f') document.getElementById('full').click();
    else if (e.key === 'p') print();
  });
  let x0 = null;
  addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  });
  addEventListener('resize', fit);
  fit(); show(i);
})();
</script>
</body>
</html>
