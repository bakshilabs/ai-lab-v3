<!doctype html><html><head><meta charset="utf-8"><title>Red Team trailer</title>
<link rel="stylesheet" href="../engine/ui.css">
<style>
/* Future Skills work-tool UI: white cards, Inter, ink #13202b, accent teal #16c79a */
:root { --ink:#13202b; --mute:#5b6b78; --teal:#16c79a; --teal-d:#0c8f6c; --teal-bg:#e3f7f0; --red:#e5483b; --red-bg:#fde9e6; --amber:#f2a516; --amber-bg:#fff3d9; --line:#e3e8ec; }
.wc { background:#fff; border-radius:28px; color:var(--ink); font-family:'Inter',sans-serif; box-shadow:0 8px 0 rgba(10,30,40,.06), 0 18px 44px rgba(10,30,40,.18); }

.topbar { display:flex; gap:14px; align-items:center; }
.topbar .app { background:#fff; border-radius:999px; padding:12px 28px 12px 14px; font:800 27px 'Inter'; color:var(--ink); display:flex; align-items:center; gap:14px; box-shadow:0 10px 26px rgba(10,30,40,.16); }
.topbar .app i { width:40px; height:40px; border-radius:12px; background:var(--teal); display:grid; place-items:center; }
.status { border-radius:999px; padding:12px 24px; font:800 23px 'Inter'; letter-spacing:.06em; text-transform:uppercase; background:#fff; color:var(--mute); box-shadow:0 10px 26px rgba(10,30,40,.16); display:flex; align-items:center; gap:10px; }
.status::before { content:''; width:14px; height:14px; border-radius:50%; background:currentColor; }
.status.draft { color:#6b7a86; } .status.run { color:#2b7bd8; } .status.rev { color:#c98a00; } .status.ret { color:var(--red); } .status.ok { color:var(--teal-d); }
/* brief */
.brief { width:900px; padding:34px 42px 30px; }
.brief .row { display:grid; grid-template-columns:200px 1fr; gap:20px; align-items:baseline; padding:16px 0; border-top:2px solid var(--line); }
.brief .row:first-of-type { border-top:0; }
.brief small { font:800 22px 'Inter'; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.brief b { font:750 38px/1.2 'Inter'; }

.tagt { background:var(--teal-bg); color:var(--teal-d); border-radius:999px; padding:6px 16px; font:800 20px 'Inter'; letter-spacing:.1em; }
/* captions on 3D people */
.cap { position:absolute; transform:translate(-50%,-100%); white-space:nowrap; background:#fff; color:var(--ink); border-radius:16px; padding:10px 18px; font:800 24px 'Inter'; box-shadow:0 8px 20px rgba(10,30,40,.2); }

.cap.mentor { background:#13202b; color:#fff; } .cap.mentor small { color:#9fb3c4; } .cap.mentor::after { border-top-color:#13202b; }
/* workflow map */
.map { width:1210px; height:572px; position:relative; }
.map .hd3 { position:absolute; left:30px; top:24px; right:30px; }
.lane { position:absolute; left:20px; width:1170px; height:150px; border-radius:20px; background:#f5f8f9; }
.lane span { position:absolute; left:18px; top:50%; transform:translateY(-50%); font:800 20px 'Inter'; letter-spacing:.1em; color:var(--mute); width:120px; line-height:1.15; }
.lane.ai { background:#eef3fb; } .lane.hu { background:#fff8e9; }
.box { position:absolute; width:160px; height:104px; border-radius:18px; background:#fff; border:3px solid #d5dde3; padding:10px 12px; font:750 21px/1.15 'Inter'; color:var(--ink); display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 4px 10px rgba(10,30,40,.06); }

.box em.on { opacity:1; }

.box.hot { border-color:#2b7bd8; box-shadow:0 0 0 6px rgba(43,123,216,.18); }
.box.bad { border-color:var(--red); box-shadow:0 0 0 6px rgba(229,72,59,.18); }

.ckpt { position:absolute; width:50px; height:50px; border-radius:50%; background:#f2a516; border:4px solid #fff; box-shadow:0 4px 12px rgba(120,80,0,.35); display:grid; place-items:center; transform:translate(-50%,-50%); }

/* permissions */
.perm { width:1210px; padding:26px 30px; }

.sw i { width:54px; height:30px; border-radius:99px; background:#c9d2d9; position:relative; flex:none; }
.sw i::after { content:''; position:absolute; top:4px; left:4px; width:22px; height:22px; border-radius:50%; background:#fff; }
.sw.on i { background:var(--teal); } .sw.on i::after { left:28px; }

.log .r.bad { background:var(--red-bg); } .log .r.bad .st { background:var(--red); color:#fff; }
/* AI colleague */
.aic { width:584px; background:#13202b; color:#fff; border-radius:28px; padding:28px 32px 26px; font-family:'Inter'; box-shadow:0 14px 0 rgba(0,0,0,.14), 0 22px 44px rgba(5,15,25,.3); }

.ck { display:flex; align-items:center; gap:14px; border-radius:16px; padding:12px 16px; font:800 27px 'Inter'; background:#f3f5f7; color:#8b98a3; border:3px dashed #d3dbe1; }

.ck.ok { background:var(--teal-bg); color:var(--teal-d); border:3px solid transparent; } .ck.ok i { background:var(--teal); }
.ck.bad { background:var(--red-bg); color:var(--red); border:3px solid var(--red); } .ck.bad i { background:var(--red); }
.find { margin-top:16px; border-radius:16px; padding:14px 18px; font:650 23px/1.3 'Inter'; background:var(--red-bg); color:#7a1f17; }

.sign small { display:block; font:600 19px 'Inter'; color:var(--mute); }
/* cursor */
.cur { position:absolute; width:40px; height:40px; }
.cur span { position:absolute; left:30px; top:30px; background:#16c79a; color:#13202b; border-radius:8px; padding:3px 10px; font:800 18px 'Inter'; white-space:nowrap; }
.ring { position:absolute; width:70px; height:70px; border-radius:50%; border:5px solid #16c79a; transform:translate(-50%,-50%); }
/* blueprint + portfolio */
.doc { width:720px; padding:34px 40px; }
.doc h4 { font:850 40px 'Inter'; margin:8px 0 4px; }
.doc .sub { font:600 22px 'Inter'; color:var(--mute); }
.doc .thumb { margin:22px 0; height:120px; border-radius:16px; background:#f5f8f9; position:relative; overflow:hidden; }

.folder { width:420px; height:150px; position:relative; }
.folder .tab { position:absolute; left:0; top:0; width:170px; height:40px; border-radius:16px 16px 0 0; background:#0fa883; }
.folder .body { position:absolute; left:0; top:26px; width:420px; height:124px; border-radius:0 22px 22px 22px; background:#16c79a; box-shadow:0 14px 30px rgba(10,60,40,.3); display:flex; align-items:center; gap:18px; padding:0 28px; color:#06281f; }
.folder .body b { font:850 34px 'Inter'; display:block; } .folder .body small { font:700 21px 'Inter'; }
/* pathway */
.path { width:1340px; padding:40px 48px; }
.path .r { display:grid; grid-template-columns:240px 1fr; gap:26px; align-items:center; padding:20px 0; border-top:2px solid var(--line); }
.path .r:first-of-type { border-top:0; }
.path small { font:800 22px 'Inter'; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.path b { font:750 36px/1.22 'Inter'; }
.path .jobs { display:flex; gap:12px; flex-wrap:wrap; }
.path .jobs span { background:var(--teal-bg); color:var(--teal-d); border-radius:999px; padding:8px 20px; font:800 28px 'Inter'; }
.path .arrow { color:var(--teal); font-weight:900; }

/* test log table */
.tl { width:1210px; height:572px; padding:26px 30px; }
.tl table { width:100%; border-collapse:separate; border-spacing:0 8px; margin-top:12px; font-family:'Inter'; }
.tl th { text-align:left; font:800 18px 'Inter'; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); padding:0 12px; }
.tl td { background:#f5f8f9; padding:12px 12px; font:650 22px/1.2 'Inter'; vertical-align:middle; height:72px; }
.tl td:first-child { border-radius:14px 0 0 14px; font-weight:850; color:var(--mute); width:34px; }
.tl td:last-child { border-radius:0 14px 14px 0; }
.tl td.cat { font:800 18px 'Inter'; letter-spacing:.04em; color:#2b62b8; width:140px; }
.tl td.q { width:380px; } .tl td.exp { color:var(--mute); width:230px; }
  .tl tr.now td { background:#e8f1fd; }
.res { display:inline-block; border-radius:999px; padding:5px 14px; font:850 18px 'Inter'; letter-spacing:.06em; white-space:nowrap; }
.res.pass { background:var(--teal-bg); color:var(--teal-d); } .res.fail { background:var(--red); color:#fff; } .res.wait { background:#eef1f3; color:#8b98a3; }
.sev { display:inline-block; border-radius:10px; padding:5px 12px; font:850 18px 'Inter'; white-space:nowrap; }
.sev.hi { background:#5c1a14; color:#fff; } .sev.md { background:var(--amber-bg); color:#9a6400; } .sev.lo { background:#eef1f3; color:#6b7a86; }
/* chat console */
.chat { width:1210px; height:300px; padding:22px 30px; }
.chat .msgs { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:16px; }
.bub { border-radius:22px; padding:16px 22px; font:650 26px/1.25 'Inter'; min-height:120px; }
.bub small { display:block; font:800 17px 'Inter'; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; opacity:.75; }
.bub.me { background:var(--teal); color:#06281f; border-bottom-right-radius:6px; }
.bub.bot { background:#eef2f6; color:var(--ink); border-bottom-left-radius:6px; }
.bub.bot.bad { background:var(--red-bg); box-shadow:inset 0 0 0 3px var(--red); }
.bub.bot.good { background:var(--teal-bg); box-shadow:inset 0 0 0 3px var(--teal); }
/* report */
.rep { width:1210px; height:300px; padding:22px 30px; }
.rep .cols { display:grid; grid-template-columns:1.05fr 1fr; gap:26px; margin-top:12px; }
.rep h5 { font:800 18px 'Inter'; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); margin-bottom:8px; }
.rep .it { display:flex; gap:12px; align-items:center; font:650 22px/1.25 'Inter'; padding:6px 0; }
.rep .dec { margin-top:10px; display:inline-flex; gap:12px; align-items:center; border-radius:14px; padding:8px 16px; font:850 22px 'Inter'; }
.rep .dec.no { background:var(--red-bg); color:var(--red); } .rep .dec.yes { background:var(--teal-bg); color:var(--teal-d); }
.aic s { color:#ff8b7e; text-decoration-thickness:3px; }
.aic ins { text-decoration:none; background:#16c79a; color:#13202b; border-radius:8px; padding:0 8px; }
.aic .cm { margin-top:14px; border-left:5px solid #ffc83d; padding:6px 0 6px 14px; font:650 21px 'Inter'; color:#ffe4a0; }
</style>

<body><div id="app"><div id="bg"></div><div id="ui"></div><div id="fx"></div></div>
<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, tree, house, person, rand, noise2, island } from '../engine/kit.js';
import { el, cue, fader, titleCard, toScreen } from '../engine/ui.js';
import { clouds, birds } from '../engine/extras.js';

const DUR = 42;
const st = createStage({ sky: ['#5db6ff', '#d9efff'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.55; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #58b4ff 0%, #8fd0ff 52%, #dff2ff 100%)';
sun.intensity = 2.8; sun.position.set(-60, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50; sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50; sun.shadow.camera.updateProjectionMatrix();

// ---------- island ----------
const v = new Vox(); v.jitter = 0.06;
island(v, { rx: 31, rz: 22, top: 0, depth: 13, seed: 7, wobble: 4 });
// road behind the workshop and a path in front
for (let x = -34; x <= 34; x++) for (let z = -13; z <= -11; z++) if (v.has(x, 0, z)) v.set(x, 0, z, z === -12 && x % 4 === 0 ? '#e9e4d0' : '#646b72');
for (let x = -6; x <= -3; x++) for (let z = 5; z <= 23; z++) if (v.has(x, 0, z)) v.set(x, 0, z, rand(x, 3, z) > .5 ? '#ded0a8' : '#d4c59b');
// town behind
const houses = [[-24, -20, '#d0573a', '#f1ebe0'], [-13, -20, '#5a6d80', '#efe2c9'], [-2, -20, '#e0a33a', '#f4efe6'], [9, -20, '#d0573a', '#e8eef2'], [20, -19, '#5a6d80', '#f1ebe0']];
for (const [x, z, roof, wall] of houses) house(v, x, 0, z, { w: 7, d: 5, h: 4, roof, wall });
// cafe on the right
house(v, 14, 0, -6, { w: 9, d: 7, h: 4, roof: '#16a37f', wall: '#f6f1e6' });
for (const [x, z] of [[-27, 6], [-27, 15], [8, 10], [14, 14], [22, 6], [25, -4], [-28, -4], [3, 17]]) tree(v, x, 0, z, { kind: rand(x, z) > 0.5 ? 'round' : 'pine' });
scene.add(v.mesh());

// ---------- workshop building (half-scale voxels) ----------
const b = new Vox(); b.jitter = 0.04;
const BX = -15, BZ = -9, BY = 1, S = 0.5;
const W = (i, j, k) => new THREE.Vector3(BX + (i + 0.5) * S, BY + (j + 0.5) * S, BZ + (k + 0.5) * S);
// floor: office carpet left, workshop concrete right
for (let i = 0; i <= 43; i++) for (let k = 0; k <= 27; k++) b.set(i, 0, k, i <= 23 ? ((i + k) % 2 ? '#d6e1e4' : '#cfdbdf') : ((Math.floor(i / 2) + Math.floor(k / 2)) % 2 ? '#efe9dc' : '#d9cfbd'));
const WALL = '#f1e8d6', GLASS = '#a9d8f2', FRAME = '#e1dbcf';
const inR = (x, a, c) => x >= a && x <= c;
for (let i = 0; i <= 43; i++) for (let j = 1; j <= 12; j++) for (let k = 0; k <= 1; k++) {
  const win = j >= 4 && j <= 9 && (inR(i, 2, 9) || inR(i, 25, 31) || inR(i, 34, 40));
  b.set(i, j, k, win ? (k === 0 ? GLASS : null) : (j === 12 ? FRAME : WALL));
}
for (let k = 0; k <= 27; k++) for (let j = 1; j <= 12; j++) for (let i = 42; i <= 43; i++) {
  const win = j >= 4 && j <= 9 && inR(k, 14, 23);
  b.set(i, j, k, win ? (i === 43 ? GLASS : null) : (j === 12 ? FRAME : WALL));
}
for (let i = 0; i <= 43; i++) b.set(i, 1, 27, FRAME);
for (let k = 0; k <= 27; k++) b.set(0, 1, k, FRAME);
b.box(0, 1, 26, 0, 3, 27, WALL);
// wall screen (workflow board) on back wall
b.box(11, 3, 2, 22, 10, 2, '#2a3640');
// desks: [desk i0, k0]
const desks = [[6, 16], [18, 16], [6, 6], [18, 6]];
const DESK = '#e8d3ad', LEG = '#8a95a0', CHAIR = '#3a4752';
for (const [i0, k0] of desks) {
  b.box(i0, 2, k0, i0 + 4, 2, k0 + 5, DESK);
  for (const [a, c] of [[i0, k0], [i0 + 4, k0], [i0, k0 + 5], [i0 + 4, k0 + 5]]) b.set(a, 1, c, LEG);
  b.box(i0 + 3, 3, k0 + 1, i0 + 3, 5, k0 + 4, '#2a3640'); // monitor
  b.set(i0 + 3, 3, k0 + 2, '#2a3640');
  b.box(i0 - 3, 1, k0 + 1, i0 - 1, 1, k0 + 4, CHAIR); b.box(i0 - 4, 2, k0 + 1, i0 - 4, 2, k0 + 4, '#56687a');
  b.set(i0 + 1, 3, k0 + 4, '#ffffff'); // mug
}
// plants
for (const [i, k] of [[1, 1], [23, 2]]) { b.box(i, 1, k, i + 1, 2, k + 1, '#b0643a'); b.box(i - 1, 3, k - 1, i + 2, 5, k + 2, '#4caf50'); b.box(i, 6, k, i + 1, 6, k + 1, '#3f9d4a'); }
// museum gallery: dinosaur skeleton, display cases, columns, kiosk
const BONE = '#f3ecda', BONE2 = '#e2d6bb';
b.box(25, 1, 9, 41, 1, 19, '#8b8f93');
for (let i = 28; i <= 35; i++) for (let j = 6; j <= 9; j++) for (let k = 12; k <= 15; k++) { const edge = j === 9 || j === 6 || k === 12 || k === 15; if (edge && (i % 2 === 0 || j === 9)) b.set(i, j, k, j === 9 ? BONE : BONE2); }
for (let s = 0; s <= 5; s++) b.box(35 + Math.round(s * 0.7), 9 + s, 13, 35 + Math.round(s * 0.7), 9 + s, 14, BONE);
b.box(38, 14, 12, 41, 16, 15, BONE); b.set(41, 15, 12, '#2a3640'); b.set(41, 15, 15, '#2a3640'); b.box(40, 14, 12, 41, 14, 15, BONE2);
for (let s = 0; s <= 7; s++) b.box(27 - s, 8 - Math.round(s * 0.55), 13, 27 - s, 8 - Math.round(s * 0.55), 14, BONE);
for (const [i, k] of [[29, 12], [29, 15], [34, 12], [34, 15]]) b.box(i, 2, k, i, 6, k, BONE);
for (const [i, k] of [[30, 13], [33, 14]]) b.box(i, 2, k, i, 5, k, '#6b7480');
for (const i0 of [26, 33]) { b.box(i0, 1, 22, i0 + 3, 2, 25, '#5a6d80'); b.box(i0, 3, 22, i0 + 3, 5, 25, '#bfe6f5'); }
b.box(27, 3, 23, 28, 3, 24, '#e0a33a'); b.box(34, 3, 23, 35, 4, 24, '#b0643a');
