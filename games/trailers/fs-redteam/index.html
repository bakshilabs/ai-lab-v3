.checks { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
.ck { display:flex; align-items:center; gap:14px; border-radius:16px; padding:11px 16px; font:800 27px 'Inter'; background:#f3f5f7; color:#8b98a3; border:3px dashed #d3dbe1; }

.finds { display:grid; gap:8px; margin-top:12px; }

.sign { margin-top:14px; display:flex; align-items:center; gap:16px; border-top:2px solid var(--line); padding-top:14px; font:800 28px 'Inter'; }

/* blueprint + portfolio */

.doc .thumb { margin:20px 0; height:120px; border-radius:16px; background:#f5f8f9; position:relative; overflow:hidden; }

.folder { width:420px; height:150px; position:relative; }

.folder .body { position:absolute; left:0; top:26px; width:420px; height:124px; border-radius:0 22px 22px 22px; background:#16c79a; box-shadow:0 14px 30px rgba(10,60,40,.3); display:flex; align-items:center; gap:18px; padding:0 28px; color:#06281f; }
.folder .body b { font:850 34px 'Inter'; display:block; } .folder .body small { font:700 21px 'Inter'; }
/* pathway */
.path { width:1000px; padding:34px 42px; }
.path .r { display:grid; grid-template-columns:190px 1fr; gap:24px; align-items:center; padding:17px 0; border-top:2px solid var(--line); }
.path .r:first-of-type { border-top:0; }
.path small { font:800 21px 'Inter'; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.path b { font:750 31px/1.22 'Inter'; }
.path .jobs { display:flex; gap:10px; flex-wrap:wrap; }
.path .jobs span { background:var(--teal-bg); color:var(--teal-d); border-radius:999px; padding:7px 18px; font:800 25px 'Inter'; }
/* bright end title */
.endt { width:1920px; text-align:center; font-family:var(--display); }
.endt .chip2 { display:inline-block; background:#13202b; color:#fff; border-radius:999px; padding:12px 26px; font:800 22px 'Inter'; letter-spacing:.06em; }
.endt h1 { font-weight:800; font-size:124px; line-height:1; letter-spacing:-0.035em; color:#13202b; margin-top:20px; text-shadow:0 4px 0 rgba(255,255,255,.35); }
.endt h1 span { color:#0c8f6c; }
.endt h2 { font-weight:700; font-size:42px; color:#13202b; margin-top:14px; }
.aic .new.amber { background:#ffc83d; color:#13202b; }

<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, tree, person, rand, island, waterMesh } from '../engine/kit.js';
import { el, cue, fader, toScreen } from '../engine/ui.js';
import { clouds, birds } from '../engine/extras.js';

const DUR = 38.4;
const st = createStage({ sky: ['#5db6ff', '#d9efff'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.55; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #58b4ff 0%, #8fd0ff 52%, #dff2ff 100%)';
sun.intensity = 2.8; sun.position.set(-60, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50; sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50; sun.shadow.camera.updateProjectionMatrix();

// ---------- island: Harbour Museum on a little harbour ----------
const v = new Vox(); v.jitter = 0.06;
const isl = island(v, { rx: 30, rz: 21, top: 0, depth: 13, seed: 11, wobble: 4 });
// harbour basin on the right: carve two layers, keep a stone rim at the island edge
const basin = (x, z) => x >= 14 && z >= -4 && isl.inside(x, z);
const water = [];
for (let x = 10; x <= 36; x++) for (let z = -6; z <= 26; z++) {
  if (!basin(x, z)) continue;
  const rimCell = !isl.inside(x + 1, z) || !isl.inside(x, z + 1) || !isl.inside(x - 1, z) || !isl.inside(x, z - 1) || !isl.inside(x + 1, z + 1) || !isl.inside(x - 1, z + 1);
  const edge = !basin(x - 1, z) || !basin(x, z - 1);
  if (rimCell) { v.set(x, 0, z, '#9aa0a5'); continue; }
  if (edge) { v.set(x, 0, z, '#b9b3a6'); continue; }
  v.set(x, 0, z, null); v.set(x, -1, z, null); v.set(x, -2, z, '#2f86b8'); water.push([x, z]);
}
const wm = waterMesh(water, -1, { color: '#4fb6e8', opacity: 0.85 }); scene.add(wm);
// quay paving in front of the museum and along the basin
for (let x = -30; x <= 13; x++) for (let z = 7; z <= 10; z++) if (v.has(x, 0, z) && !basin(x, z)) v.set(x, 0, z, ((x + z) & 1) ? '#e6e0d2' : '#ddd6c6');
for (let z = -6; z <= 10; z++) for (let x = 11; x <= 13; x++) if (v.has(x, 0, z)) v.set(x, 0, z, ((x + z) & 1) ? '#e6e0d2' : '#ddd6c6');
for (const [x, z] of [[12, -2], [12, 3], [12, 8], [16, -5], [22, -5]]) v.set(x, 1, z, '#3a4752');
// lighthouse on the back-right point
for (let y = 1; y <= 12; y++) for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) if (Math.abs(dx) + Math.abs(dz) <= 1 || y < 3) v.set(22 + dx, y, -13 + dz, y >= 11 ? '#ffd66b' : (y >> 1) % 2 ? '#e5483b' : '#f7f2e6');
v.box(21, 13, -14, 23, 13, -12, '#e5483b'); v.set(22, 14, -13, '#e5483b');
// trees, flowerbeds, flagpoles
for (const [x, z] of [[-27, 4], [-26, 12], [-25, -9], [-14, 16], [3, 16], [-4, -17], [8, -16], [28, -10], [-28, -2]]) tree(v, x, 0, z, { kind: rand(x, z) > 0.55 ? 'pine' : 'round' });
for (const [x0, z0] of [[-18, 12], [-6, 12]]) { v.box(x0, 1, z0, x0 + 5, 1, z0 + 1, '#8a5c38'); for (let x = x0; x <= x0 + 5; x++) v.set(x, 2, z0, rand(x, z0) > .5 ? '#ff8a2a' : '#e8573f'); }
for (const x of [-24, 0]) { for (let y = 1; y <= 9; y++) v.set(x, y, 8, '#c9d2d9'); v.box(x + 1, 7, 8, x + 3, 8, 8, x < 0 ? '#16c79a' : '#2b62b8'); }
scene.add(v.mesh());
// a little boat in the harbour
{ const bt = new Vox(); bt.jitter = 0.03; bt.box(0, 0, 0, 6, 1, 2, '#f7f2e6'); bt.box(1, 0, 0, 5, 0, 2, '#e5483b'); bt.box(-1, 1, 1, -1, 1, 1, '#f7f2e6'); bt.box(2, 2, 0, 4, 3, 2, '#2b62b8'); bt.box(3, 4, 1, 3, 8, 1, '#7a5232'); bt.box(3, 5, 1, 5, 7, 1, '#ffffff');
  const m = bt.mesh({ scale: 0.6 }); m.position.set(19, -0.9, 6); scene.add(m); window.__boat = m; }

// ---------- museum: portico + cut-away gallery (half-scale voxels) ----------
const b = new Vox(); b.jitter = 0.04;
const BX = -22, BZ = -10, BY = 1, S = 0.5;
const W = (i, j, k) => new THREE.Vector3(BX + (i + 0.5) * S, BY + (j + 0.5) * S, BZ + (k + 0.5) * S);
const inR = (x, a, c) => x >= a && x <= c;
const STONE = '#efe6d2', COL = '#fbf7ee', FRAME = '#e1d8c4', GLASS = '#a9d8f2';
// portico block (left): stone walls, flat roof, columns, pediment, steps
for (let i = 0; i <= 20; i++) for (let k = 0; k <= 30; k++) for (let j = 1; j <= 16; j++) {
  const edge = i <= 1 || i >= 19 || k <= 1 || k >= 29; if (!edge) continue;
  let c = j === 1 ? '#c9c0ac' : STONE;
  if (k >= 29 && j <= 10 && inR(i, 8, 12)) c = k === 30 ? '#7a4a2c' : null;
  if (i <= 1 && j >= 5 && j <= 12 && (inR(k, 6, 10) || inR(k, 18, 22))) c = i === 0 ? GLASS : null;
  if (c) b.set(i, j, k, c);
}
for (let i = 0; i <= 20; i++) for (let k = 0; k <= 30; k++) b.set(i, 17, k, '#cfd5d9');
for (let k = 31; k <= 35; k++) for (let i = -1; i <= 21; i++) for (let j = 0; j <= Math.max(0, 2 - (k - 33)); j++) if (k <= 33 || j === 0) b.set(i, j, k, '#d8cfbb');
for (const i of [1, 5, 9, 13, 17]) b.box(i, 3, 32, i + 1, 14, 33, COL);
b.box(-1, 15, 30, 21, 17, 34, FRAME);
for (let r = 0; r <= 4; r++) b.box(-1 + r * 2, 18 + r, 33, 21 - r * 2, 18 + r, 34, r === 0 ? FRAME : STONE);
// gallery hall (right): back wall with paintings, right wall with tall windows, open front
for (let i = 21; i <= 62; i++) for (let k = 0; k <= 30; k++) b.set(i, 0, k, ((i >> 1) + (k >> 1)) % 2 ? '#efe9dc' : '#e2d8c4');
for (let i = 21; i <= 62; i++) for (let j = 1; j <= 14; j++) for (let k = 0; k <= 1; k++) b.set(i, j, k, j === 14 ? FRAME : STONE);
for (let k = 0; k <= 30; k++) for (let j = 1; j <= 14; j++) for (let i = 61; i <= 62; i++) { const win = j >= 4 && j <= 11 && (inR(k, 6, 10) || inR(k, 18, 22)); b.set(i, j, k, win ? (i === 62 ? GLASS : null) : (j === 14 ? FRAME : STONE)); }
for (let i = 21; i <= 62; i++) if (!inR(i, 30, 40)) b.set(i, 1, 30, FRAME);
for (const [i0, c] of [[24, '#2b62b8'], [44, '#d0573a'], [52, '#16a37f']]) { b.box(i0 - 1, 6, 2, i0 + 5, 11, 2, '#b08a3a'); b.box(i0, 7, 2, i0 + 4, 10, 2, c); }
// fossil skeleton on a plinth (centre of the hall)
const BONE = '#f3ecda', BONE2 = '#e2d6bb';
b.box(25, 1, 9, 41, 1, 18, '#8b8f93');
for (let i = 28; i <= 35; i++) for (let j = 6; j <= 9; j++) for (let k = 12; k <= 15; k++) { const e = j === 9 || j === 6 || k === 12 || k === 15; if (e && (i % 2 === 0 || j === 9)) b.set(i, j, k, j === 9 ? BONE : BONE2); }
for (let s = 0; s <= 5; s++) b.box(35 + Math.round(s * 0.7), 9 + s, 13, 35 + Math.round(s * 0.7), 9 + s, 14, BONE);
b.box(38, 14, 12, 41, 16, 15, BONE); b.set(41, 15, 12, '#2a3640'); b.set(41, 15, 15, '#2a3640'); b.box(40, 14, 12, 41, 14, 15, BONE2);
for (let s = 0; s <= 7; s++) b.box(27 - s, 8 - Math.round(s * 0.55), 13, 27 - s, 8 - Math.round(s * 0.55), 14, BONE);
for (const [i, k] of [[29, 12], [29, 15], [34, 12], [34, 15]]) b.box(i, 2, k, i, 6, k, BONE);
// ship model on a plinth (right of the hall)
b.box(45, 1, 17, 56, 3, 23, '#3a4752'); b.box(46, 4, 19, 55, 5, 21, '#8a5c38'); b.box(47, 6, 19, 54, 6, 21, '#a7774c'); b.set(56, 5, 20, '#8a5c38');
for (const [i, h] of [[48, 13], [51, 15], [54, 12]]) { b.box(i, 7, 20, i, h, 20, '#5a3e2b'); b.box(i - 1, 9, 20, i + 1, h - 1, 20, '#ffffff'); }
// display cases + Leon's test desk (back right)
for (const i0 of [26, 33]) { b.box(i0, 1, 22, i0 + 3, 2, 25, '#5a6d80'); b.box(i0, 3, 22, i0 + 3, 5, 25, '#bfe6f5'); }
b.box(27, 3, 23, 28, 3, 24, '#e0a33a'); b.box(34, 3, 23, 35, 4, 24, '#b0643a');
b.box(50, 3, 4, 56, 3, 9, '#e8d3ad'); for (const [i, k] of [[50, 4], [56, 4], [50, 9], [56, 9]]) b.box(i, 1, k, i, 2, k, '#8a95a0');
b.box(54, 4, 5, 55, 4, 8, '#2a3640'); b.box(55, 5, 5, 55, 7, 8, '#2a3640'); b.box(47, 1, 6, 48, 2, 7, '#3a4752');
// ticket desk + Ask Archie kiosk near the entrance
b.box(22, 1, 25, 28, 3, 27, '#16a37f'); b.box(22, 4, 25, 28, 4, 27, '#f7f2e6');
