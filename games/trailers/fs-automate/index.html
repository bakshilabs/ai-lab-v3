<!doctype html><html><head><meta charset="utf-8"><title>Automation Designer trailer</title>

<style>
/* Future Skills work-tool UI: white cards, Inter, ink #13202b, accent teal #16c79a */
:root { --ink:#13202b; --mute:#5b6b78; --teal:#16c79a; --teal-d:#0c8f6c; --teal-bg:#e3f7f0; --red:#e5483b; --red-bg:#fde9e6; --amber:#f2a516; --amber-bg:#fff3d9; --line:#e3e8ec; }
.wc { background:#fff; border-radius:28px; color:var(--ink); font-family:'Inter',sans-serif; box-shadow:0 8px 0 rgba(10,30,40,.06), 0 18px 44px rgba(10,30,40,.18); }
.hd3 { font:800 20px 'Inter'; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); display:flex; align-items:center; gap:14px; white-space:nowrap; }
.hd3 .t { color:var(--ink); letter-spacing:.02em; text-transform:none; font-size:30px; }
.topbar { display:flex; gap:14px; align-items:center; }
.topbar .app { background:#fff; border-radius:999px; padding:12px 28px 12px 14px; font:800 27px 'Inter'; color:var(--ink); display:flex; align-items:center; gap:14px; box-shadow:0 10px 26px rgba(10,30,40,.16); }
.topbar .app i { width:40px; height:40px; border-radius:12px; background:var(--teal); display:grid; place-items:center; }
.topbar .prod { background:#13202b; color:#fff; border-radius:999px; padding:14px 24px; font:800 21px 'Inter'; letter-spacing:.04em; box-shadow:0 10px 26px rgba(10,30,40,.16); }
.status { border-radius:999px; padding:12px 24px; font:800 23px 'Inter'; letter-spacing:.06em; text-transform:uppercase; background:#fff; color:var(--mute); box-shadow:0 10px 26px rgba(10,30,40,.16); display:flex; align-items:center; gap:10px; }
.status::before { content:''; width:14px; height:14px; border-radius:50%; background:currentColor; }
.status.draft { color:#6b7a86; } .status.run { color:#2b7bd8; } .status.rev { color:#c98a00; } .status.ret { color:var(--red); } .status.ok { color:var(--teal-d); }
/* brief */
.brief { width:880px; padding:30px 40px 26px; }
.brief .row { display:grid; grid-template-columns:190px 1fr; gap:20px; align-items:baseline; padding:14px 0; border-top:2px solid var(--line); }
.brief .row:first-of-type { border-top:0; }
.brief small { font:800 22px 'Inter'; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }

.tagt { background:var(--teal-bg); color:var(--teal-d); border-radius:999px; padding:6px 16px; font:800 20px 'Inter'; letter-spacing:.1em; }
/* captions on 3D people */
.cap { position:absolute; transform:translate(-50%,-100%); white-space:nowrap; background:#fff; color:var(--ink); border-radius:16px; padding:10px 18px; font:800 24px 'Inter'; box-shadow:0 8px 20px rgba(10,30,40,.2); }
.cap small { display:block; font:600 19px 'Inter'; color:var(--mute); margin-top:2px; }
.cap::after { content:''; position:absolute; left:50%; bottom:-10px; margin-left:-10px; border:10px solid transparent; border-top-color:#fff; border-bottom:0; }
.cap.mentor { background:#13202b; color:#fff; } .cap.mentor small { color:#9fb3c4; } .cap.mentor::after { border-top-color:#13202b; }
/* workflow map */
.map { width:1080px; height:500px; position:relative; }
.map .hd3 { position:absolute; left:28px; top:20px; right:28px; }
.lane { position:absolute; left:16px; width:1048px; height:120px; border-radius:20px; background:#f5f8f9; }
.lane span { position:absolute; left:14px; top:50%; transform:translateY(-50%); font:800 18px 'Inter'; letter-spacing:.03em; color:var(--mute); width:110px; line-height:1.15; }
.lane.ai { background:#eef3fb; } .lane.hu { background:#fff8e9; }
.box { position:absolute; width:158px; height:104px; border-radius:18px; background:#fff; border:3px solid #d5dde3; padding:9px 10px; font:750 21px/1.12 'Inter'; color:var(--ink); display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 4px 10px rgba(10,30,40,.06); }
.box em { font-style:normal; align-self:flex-start; white-space:nowrap; border-radius:999px; padding:3px 9px; font:800 18px 'Inter'; background:#eef1f3; color:#6b7a86; opacity:0; }
.box em.on { opacity:1; }
.box em.ai { background:#e3ecfb; color:#2b62b8; } .box em.hu { background:#fff0cc; color:#9a6400; } .box em.mix { background:var(--teal-bg); color:var(--teal-d); } .box em.bad { background:var(--red); color:#fff; }
.box.hot { border-color:#2b7bd8; box-shadow:0 0 0 6px rgba(43,123,216,.18); }
.box.bad { border-color:var(--red); box-shadow:0 0 0 6px rgba(229,72,59,.18); }
.box.good { border-color:var(--teal); box-shadow:0 0 0 6px rgba(22,199,154,.2); }
.ckpt { position:absolute; width:48px; height:48px; border-radius:50%; background:#f2a516; border:4px solid #fff; box-shadow:0 4px 12px rgba(120,80,0,.35); display:grid; place-items:center; transform:translate(-50%,-50%); }
.ckpt svg { width:26px; height:26px; }
.token { position:absolute; width:26px; height:26px; border-radius:50%; background:#2b7bd8; border:4px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.3); transform:translate(-50%,-50%); }
/* permissions */
.perm { width:1080px; padding:24px 28px; }
.perm .grid { display:flex; flex-wrap:wrap; gap:14px; margin-top:16px; }
.sw { display:flex; align-items:center; gap:14px; background:#f5f8f9; border-radius:16px; padding:12px 18px; font:700 24px 'Inter'; }
.sw i { width:54px; height:30px; border-radius:99px; background:#c9d2d9; position:relative; flex:none; }
.sw i::after { content:''; position:absolute; top:4px; left:4px; width:22px; height:22px; border-radius:50%; background:#fff; }
.sw.on i { background:var(--teal); } .sw.on i::after { left:28px; }
.sw.flash { box-shadow:0 0 0 4px var(--amber); }
.sw b { font-weight:800; color:#2b62b8; }
.sw.rule { background:#eef3fb; }
/* log */
.log { width:1080px; padding:22px 28px; }
.log .r { display:grid; grid-template-columns:86px 1fr auto; gap:18px; align-items:center; padding:9px 12px; border-radius:12px; font:650 25px 'Inter'; }
.log .r tt { font:700 22px 'Inter'; color:var(--mute); }
.log .r .st { border-radius:999px; padding:4px 14px; font:800 19px 'Inter'; background:var(--teal-bg); color:var(--teal-d); }
/* AI colleague */
.aic { width:580px; background:#13202b; color:#fff; border-radius:28px; padding:26px 30px 24px; font-family:'Inter'; box-shadow:0 14px 0 rgba(0,0,0,.14), 0 22px 44px rgba(5,15,25,.3); }
.aic .who { display:flex; align-items:center; gap:14px; font:800 23px 'Inter'; letter-spacing:.04em; color:#c9d6e2; white-space:nowrap; }
.aic .who i { width:44px; height:44px; border-radius:12px; background:#24384a; display:grid; place-items:center; flex:none; }
.aic .who em { font-style:normal; background:#ffc83d; color:#13202b; border-radius:999px; padding:4px 14px; font:800 19px 'Inter'; letter-spacing:.08em; }
.aic .who em.ret { background:#ff6a5a; color:#fff; } .aic .who em.v2 { background:#16c79a; color:#06281f; }
.aic p { font:600 29px/1.25 'Inter'; margin:14px 0 16px; }
.aic s { color:#a9b8c6; text-decoration-color:#ff6a5a; text-decoration-thickness:4px; }
.aic .new { display:block; margin-top:10px; background:#16c79a; color:#06281f; border-radius:12px; padding:8px 14px; font:700 25px/1.25 'Inter'; }
.aic .sure { display:flex; align-items:center; gap:18px; font:800 25px 'Inter'; white-space:nowrap; }
.aic .sure .bar { flex:1; height:14px; border-radius:99px; background:#2c3e50; overflow:hidden; }
.aic .sure .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#ffc83d,#16c79a); }
.aic .sure.off span { color:#ff8b7e; }
.aic .data { margin-top:16px; display:flex; gap:10px; align-items:center; background:#22344a; border-radius:14px; padding:9px 12px; font:600 20px 'Inter'; color:#dce6ef; white-space:nowrap; border:3px solid transparent; }
.aic .data b { flex:none; white-space:nowrap; background:#16c79a; color:#13202b; border-radius:8px; padding:3px 10px; font:800 18px 'Inter'; letter-spacing:.06em; text-transform:uppercase; }
.aic .data.bad { border-color:#ff6a5a; } .aic .data.bad b { background:#ff6a5a; color:#fff; }
/* review */
.review { width:1080px; padding:22px 28px 24px; }
.checks { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
.ck { display:flex; align-items:center; gap:14px; border-radius:16px; padding:11px 16px; font:800 27px 'Inter'; background:#f3f5f7; color:#8b98a3; border:3px dashed #d3dbe1; }
.ck i { width:38px; height:38px; border-radius:50%; background:#dfe5ea; color:#fff; display:grid; place-items:center; font:900 22px 'Inter'; font-style:normal; flex:none; }
.ck.ok { background:var(--teal-bg); color:var(--teal-d); border:3px solid transparent; } .ck.ok i { background:var(--teal); }
.ck.bad { background:var(--red-bg); color:var(--red); border:3px solid var(--red); } .ck.bad i { background:var(--red); }
.finds { display:grid; gap:8px; margin-top:12px; }
.find { border-radius:14px; padding:10px 16px; font:650 23px/1.3 'Inter'; background:var(--red-bg); color:#7a1f17; }
.find.good { background:var(--teal-bg); color:#0b5a45; }
.find b { font-weight:850; }
.sign { margin-top:14px; display:flex; align-items:center; gap:16px; border-top:2px solid var(--line); padding-top:14px; font:800 28px 'Inter'; }
.sign .tick { width:52px; height:52px; border-radius:50%; background:var(--teal); color:#fff; display:grid; place-items:center; font:900 30px 'Inter'; flex:none; }
.sign small { display:block; font:650 21px 'Inter'; color:var(--mute); margin-top:2px; }
.sign .stamp { margin-left:auto; border:4px solid var(--teal); color:var(--teal-d); border-radius:14px; padding:6px 18px; font:900 26px 'Inter'; letter-spacing:.12em; transform:rotate(-4deg); }
/* cursor */
.cur { position:absolute; width:40px; height:40px; }
.cur span { position:absolute; left:30px; top:30px; background:#16c79a; color:#13202b; border-radius:8px; padding:3px 10px; font:800 18px 'Inter'; white-space:nowrap; }
.ring { position:absolute; width:70px; height:70px; border-radius:50%; border:5px solid #16c79a; transform:translate(-50%,-50%); }
/* blueprint + portfolio */
.doc { width:700px; padding:32px 38px; }
.doc h4 { font:850 40px 'Inter'; margin:8px 0 4px; }
.doc .sub { font:600 22px 'Inter'; color:var(--mute); }
.doc .thumb { margin:20px 0; height:120px; border-radius:16px; background:#f5f8f9; position:relative; overflow:hidden; }
.doc ul { list-style:none; display:grid; gap:10px; font:650 25px 'Inter'; }
.doc li { display:flex; gap:12px; align-items:center; }
.doc li::before { content:'✓'; width:30px; height:30px; border-radius:50%; background:var(--teal-bg); color:var(--teal-d); display:grid; place-items:center; font:900 17px 'Inter'; flex:none; }
.folder { width:420px; height:150px; position:relative; }
.folder .tab { position:absolute; left:0; top:0; width:170px; height:40px; border-radius:16px 16px 0 0; background:#0fa883; }
.folder .body { position:absolute; left:0; top:26px; width:420px; height:124px; border-radius:0 22px 22px 22px; background:#16c79a; box-shadow:0 14px 30px rgba(10,60,40,.3); display:flex; align-items:center; gap:18px; padding:0 28px; color:#06281f; }
.folder .body b { font:850 34px 'Inter'; display:block; } .folder .body small { font:700 21px 'Inter'; }
/* pathway */
.path { width:1000px; padding:34px 42px; }
.path .r { display:grid; grid-template-columns:190px 1fr; gap:24px; align-items:center; padding:17px 0; border-top:2px solid var(--line); }
.path .r:first-of-type { border-top:0; }
.path small { font:800 21px 'Inter'; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.path b { font:750 31px/1.22 'Inter'; }
.path .jobs { display:flex; gap:10px; flex-wrap:wrap; }
.path .jobs span { background:var(--teal-bg); color:var(--teal-d); border-radius:999px; padding:7px 18px; font:800 25px 'Inter'; }
/* bright end title */
.endt { width:1920px; text-align:center; font-family:var(--display); }
.endt .chip2 { display:inline-block; background:#13202b; color:#fff; border-radius:999px; padding:12px 26px; font:800 22px 'Inter'; letter-spacing:.06em; }
.endt h1 { font-weight:800; font-size:124px; line-height:1; letter-spacing:-0.035em; color:#13202b; margin-top:20px; text-shadow:0 4px 0 rgba(255,255,255,.35); }
.endt h1 span { color:#0c8f6c; }
.endt h2 { font-weight:700; font-size:42px; color:#13202b; margin-top:14px; }
</style>

<body><div id="app"><div id="bg"></div><div id="ui"></div><div id="fx"></div></div>
<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, tree, house, person, rand, island } from '../engine/kit.js';
import { el, cue, fader, toScreen } from '../engine/ui.js';
import { clouds, birds } from '../engine/extras.js';

const DUR = 38.4;
const st = createStage({ sky: ['#5db6ff', '#d9efff'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.55; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #58b4ff 0%, #8fd0ff 52%, #dff2ff 100%)';
sun.intensity = 2.8; sun.position.set(-60, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50; sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50; sun.shadow.camera.updateProjectionMatrix();

// ---------- island: Pedal Point Community Bike Repair ----------
const v = new Vox(); v.jitter = 0.06;
island(v, { rx: 29, rz: 21, top: 0, depth: 13, seed: 7, wobble: 4 });
// pavement and a blue cycle lane in front of the shop, a cycle path loop round the back
for (let x = -34; x <= 34; x++) for (let z = 7; z <= 13; z++) if (v.has(x, 0, z)) {
  let c = z <= 9 ? (((x + z) & 1) ? '#e6e0d2' : '#ddd6c6') : z === 10 ? '#c9c2b2' : '#4a8fc4';
  if (z === 12 && x % 5 === 0) c = '#f4f4ee';
  v.set(x, 0, z, c);
}
for (let x = -34; x <= 34; x++) for (let z = -15; z <= -13; z++) if (v.has(x, 0, z)) v.set(x, 0, z, z === -14 && x % 4 === 0 ? '#f4f4ee' : '#4a8fc4');
for (let z = -13; z <= 7; z++) for (let x = 19; x <= 21; x++) if (v.has(x, 0, z)) v.set(x, 0, z, '#4a8fc4');
for (let z = -13; z <= 7; z++) for (let x = -21; x <= -19; x++) if (v.has(x, 0, z)) v.set(x, 0, z, '#4a8fc4');
// two small houses and a hedge behind the cycle path
house(v, -12, 0, -21, { w: 7, d: 5, h: 4, roof: '#d0573a', wall: '#f1ebe0' });
house(v, 3, 0, -21, { w: 7, d: 5, h: 4, roof: '#5a6d80', wall: '#efe2c9' });
for (let x = -16; x <= 14; x++) if (v.has(x, 0, -11)) { v.set(x, 1, -11, '#3f9d4a'); if (x % 3) v.set(x, 2, -11, '#4caf50'); }
for (const [x, z] of [[-26, 2], [-25, 10], [-24, -8], [25, -6], [26, 3], [24, 14], [-15, 17], [12, 17], [-4, -18], [16, -18]]) tree(v, x, 0, z, { kind: rand(x, z) > 0.55 ? 'pine' : 'round' });
// community garden beds (left) and a picnic table (right)
for (const [x0, z0] of [[-27, -4], [-27, 0]]) { v.box(x0, 1, z0, x0 + 4, 1, z0 + 2, '#8a5c38'); for (let x = x0 + 1; x <= x0 + 3; x++) v.set(x, 2, z0 + 1, rand(x, z0) > .5 ? '#5bbd5a' : '#e8573f'); }
v.box(23, 1, 9, 26, 1, 9, '#9a6a42'); v.box(23, 1, 12, 26, 1, 12, '#9a6a42'); v.box(23, 2, 10, 26, 2, 11, '#b07a48');
scene.add(v.mesh());

// ---------- shop + workshop (half-scale voxels) ----------
const b = new Vox(); b.jitter = 0.04;
const BX = -14, BZ = -9, BY = 1, S = 0.5;
const W = (i, j, k) => new THREE.Vector3(BX + (i + 0.5) * S, BY + (j + 0.5) * S, BZ + (k + 0.5) * S);
const inR = (x, a, c) => x >= a && x <= c;
const CREAM = '#f6efe2', FRAME = '#e1dbcf', GLASS = '#a9d8f2', TEAL = '#16a37f';
// floor: workshop concrete with a blue rubber mat under the stands
for (let i = 19; i <= 55; i++) for (let k = 0; k <= 30; k++) b.set(i, 0, k, inR(i, 24, 51) && inR(k, 9, 20) ? ((i + k) % 2 ? '#3b6a8c' : '#386484') : (rand(i, 4, k) > .5 ? '#d3cec4' : '#cbc6bb'));
// --- shop front (closed building on the left) ---
for (let i = 0; i <= 18; i++) for (let k = 0; k <= 30; k++) for (let j = 1; j <= 14; j++) {
  const edgeI = i <= 1 || i >= 17, edgeK = k <= 1 || k >= 29;
  if (!edgeI && !edgeK) continue;
  let c = j === 14 ? FRAME : j === 1 ? '#9aa4ad' : CREAM;
  if (k >= 29 && j >= 3 && j <= 9 && (inR(i, 3, 7) || inR(i, 12, 15))) c = k === 30 ? GLASS : null;
  if (k >= 29 && j <= 8 && inR(i, 9, 10)) c = k === 30 ? TEAL : null;
  if (i <= 1 && j >= 4 && j <= 9 && (inR(k, 6, 11) || inR(k, 17, 22))) c = i === 0 ? GLASS : null;
  if (c) b.set(i, j, k, c);
}
for (let i = 0; i <= 18; i++) for (let k = 0; k <= 30; k++) b.set(i, 15, k, (i === 0 || i === 18 || k === 0 || k === 30) ? FRAME : '#d9dee2');
for (let i = 0; i <= 18; i++) { b.set(i, 16, 0, FRAME); b.set(i, 16, 30, FRAME); } for (let k = 0; k <= 30; k++) { b.set(0, 16, k, FRAME); b.set(18, 16, k, FRAME); }
b.box(4, 16, 8, 6, 17, 10, '#aeb6bc'); b.box(11, 16, 16, 13, 16, 22, '#2b3f73');
// window displays: a bike in the left window, a helmet stand in the right
b.box(3, 2, 28, 7, 2, 28, '#e1dbcf'); b.box(12, 2, 28, 15, 2, 28, '#e1dbcf'); b.box(13, 3, 28, 13, 4, 28, '#ffd23f'); b.box(14, 3, 28, 14, 3, 28, '#e8573f');
// striped awning
for (let i = 2; i <= 16; i++) { const c = (i >> 1) % 2 ? '#ffffff' : '#16c79a'; b.set(i, 11, 31, c); b.set(i, 10, 32, c); b.set(i, 10, 33, c); }
// --- open workshop (cut-away) on the right ---
for (let i = 19; i <= 55; i++) for (let j = 1; j <= 12; j++) for (let k = 0; k <= 1; k++) {
  const win = j >= 8 && j <= 10 && inR(i, 40, 48);
  b.set(i, j, k, win ? (k === 0 ? GLASS : null) : (j === 12 ? FRAME : CREAM));
}
for (let k = 0; k <= 30; k++) for (let j = 1; j <= 12; j++) for (let i = 54; i <= 55; i++) {
  const win = j >= 5 && j <= 9 && inR(k, 18, 24);
  b.set(i, j, k, win ? (i === 55 ? GLASS : null) : (j === 12 ? FRAME : CREAM));
}
for (let i = 19; i <= 55; i++) if (!inR(i, 30, 41)) b.set(i, 1, 30, FRAME);
// tool wall: pegboard with spanners, hammers and a pump
b.box(21, 4, 2, 37, 10, 2, '#d8b27a');
for (let n = 0; n < 8; n++) { const i = 22 + n * 2; const c = ['#7b8085', '#d0573a', '#7b8085', '#2b62b8', '#7b8085', '#ffd23f', '#7b8085', '#16a37f'][n]; b.box(i, 6, 3, i, 9 - (n % 3), 3, c); b.set(i, 9 - (n % 3) + 1, 3, '#9aa0a5'); }
b.box(38, 2, 2, 39, 9, 3, '#2b62b8');
// workbench under the tool wall
b.box(21, 3, 2, 37, 3, 5, '#b07a48'); for (const [i, k] of [[21, 5], [37, 5], [21, 2], [37, 2]]) b.box(i, 1, k, i, 2, k, '#7a5232');
b.box(24, 4, 3, 25, 5, 4, '#5a6d80'); b.box(30, 4, 3, 32, 5, 4, '#d0573a'); b.set(34, 4, 4, '#ffd23f');
// quarter-scale detail (bikes, racks, wheels): same origin, quarter-size voxels
const q = new Vox(); q.jitter = 0.03;
const ringI = (ci, cj, k, col) => { for (let di = -3; di <= 3; di++) for (let dj = -3; dj <= 3; dj++) { const r = Math.hypot(di, dj); if (r > 2.2 && r < 3.5) q.set(ci + di, cj + dj, k, col); } };
const ringK = (i, cj, ck, col) => { for (let dk = -3; dk <= 3; dk++) for (let dj = -3; dj <= 3; dj++) { const r = Math.hypot(dk, dj); if (r > 2.2 && r < 3.5) q.set(i, cj + dj, ck + dk, col); } };
const line = (a, c, k, col) => { const n = Math.max(Math.abs(c[0] - a[0]), Math.abs(c[1] - a[1])); for (let s = 0; s <= n; s++) q.set(Math.round(lerp(a[0], c[0], s / n)), Math.round(lerp(a[1], c[1], s / n)), k, col); };
// spare wheels hanging on the right wall
for (const k of [12, 22, 56]) ringK(107, 16, k, '#22282e');
// tyre stack
for (let y = 1; y <= 4; y++) for (let di = -2; di <= 2; di++) for (let dk = -2; dk <= 2; dk++) { const r = Math.hypot(di, dk); if (r > 1 && r < 2.6) b.set(49 + di, y, 26 + dk, '#22282e'); }
