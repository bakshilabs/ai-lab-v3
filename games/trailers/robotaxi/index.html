<script type="module">

// ---------------- world ----------------
const v = new Vox();

const T = 0; // top y
const loop = [[-30, -20], [30, -20], [30, 20], [-30, 20]];
function distSeg(px, pz, a, b) { const dx = b[0] - a[0], dz = b[1] - a[1]; const L = dx * dx + dz * dz; let k = ((px - a[0]) * dx + (pz - a[1]) * dz) / L; k = clamp(k); const x = a[0] + k * dx, z = a[1] + k * dz; return [Math.hypot(px - x, pz - z), k]; }
const roadCells = [];
for (let x = -36; x <= 36; x++) for (let z = -26; z <= 26; z++) {
  let best = 99, along = 0, horiz = true;
  for (let i = 0; i < 4; i++) { const a = loop[i], b = loop[(i + 1) % 4]; const [d, k] = distSeg(x + 0.5, z + 0.5, a, b); if (d < best) { best = d; along = k * Math.hypot(b[0] - a[0], b[1] - a[1]); horiz = a[1] === b[1]; } }
  if (best <= 3.2) {
    let c = PAL.road;
    if (best < 0.6 && Math.floor(along / 2) % 2 === 0) c = PAL.roadLine;
    if (best > 2.6) c = '#9aa0a6';
    v.set(x, T, z, c); roadCells.push([x, z, best]);
  }
}
// zebra crossing on south road around x=-1..2
for (let x = -2; x <= 2; x++) for (let z = 17; z <= 23; z++) if (x % 2 === 0) v.set(x, T, z, '#f4f4ee');
// pavements near crossing
for (let x = -6; x <= 6; x++) { v.set(x, T, 24, PAL.gravel); v.set(x, T, 16, PAL.gravel); }
// pond inside the loop
const pondCells = [];
for (let x = -24; x <= -4; x++) for (let z = -14; z <= 4; z++) { const d = Math.hypot((x + 14) / 9, (z + 5) / 7); if (d < 1) { v.set(x, T, z, null); v.set(x, T - 1, z, '#3f7f9a'); pondCells.push([x, z]); } else if (d < 1.15) v.set(x, T, z, PAL.sand); }
// farm east of the road
for (let x = 35; x <= 46; x++) for (let z = -14; z <= 14; z++) { if (!isl.inside(x, z)) continue; const row = (x - 35) % 3; v.set(x, T, z, row === 0 ? '#8a5c38' : '#9a6a42'); if (row !== 0 && rand(x, 1, z) > 0.2) v.set(x, T + 1, z, rand(x, 2, z) > 0.5 ? '#e3c046' : '#b7d34a'); }
// houses
const wins = [];
house(v, -12, T, 26, { w: 9, d: 6, h: 5, roof: '#d0573a', wall: '#f1ebe0', wins }); // school
house(v, 5, T, 26, { w: 7, d: 6, h: 4, roof: '#e0a33a', wall: '#efe2c9', wins }); // bakery
house(v, 6, T, -14, { w: 7, d: 6, h: 4, roof: PAL.roofSlate, wins, solar: true });
house(v, 14, T, -2, { w: 7, d: 7, h: 4, roof: '#d0573a', wins });
house(v, 4, T, 6, { w: 6, d: 6, h: 4, roof: PAL.roofSlate, wins });
house(v, -40, T, -8, { w: 7, d: 6, h: 4, roof: '#d0573a', wins });
house(v, 14, T, -32, { w: 7, d: 5, h: 4, roof: '#e0a33a', wins });
// garage for Pip
v.box(-42, T + 1, 10, -36, T + 5, 16, '#e9e4da'); v.box(-42, T + 6, 9, -36, T + 6, 17, '#13202b'); v.box(-36, T + 1, 11, -36, T + 4, 15, '#ffd23f');
// trees
const treeSpots = [[-44, 4], [-44, -20], [-36, -28], [-20, -30], [-2, -30], [22, -28], [40, -24], [44, 20], [24, 30], [-26, 30], [-40, 26], [20, 12], [-2, -8], [22, 12], [20, -12], [-34, -14]];
for (const [x, z] of treeSpots) if (isl.inside(x, z)) tree(v, x, T, z, { kind: rand(x, 3, z) > 0.55 ? 'pine' : 'round' });
// scarecrow (separate mesh so it can get a bbox)
const crow = scarecrow({ s: 0.36 }); crow.position.set(35, T + 1, -3); scene.add(crow);
for (let z = 25; z <= 40; z++) for (let x = 14; x <= 16; x++) if (v.has(x, T, z) && !v.has(x, T + 1, z)) { v.set(x, T, z, null); v.set(x, T - 1, z, '#3f7f9a'); pondCells.push([x, z]); }
roots(v, isl.inside, { rx: 50, rz: 38, top: T, count: 70, seed: 7 });
const grassCells = []; for (let x = -50; x <= 50; x++) for (let z = -38; z <= 38; z++) { const c = v.get(x, T, z); if (c && !v.has(x, T + 1, z) && rand(x, 77, z) > 0.62 && PAL.grass.some((g) => c.getHexString() === g.slice(1))) grassCells.push([x + 0.5, z + 0.5]); }
const lampPos = [];
for (let i = 0; i < 4; i++) { const a = loop[i], b = loop[(i + 1) % 4]; for (let k = 0.15; k < 1; k += 0.235) { const x = lerp(a[0], b[0], k), z = lerp(a[1], b[1], k); const nx = a[1] === b[1] ? 0 : 1, nz = a[1] === b[1] ? 1 : 0; for (const sg of [-1, 1]) { const px = Math.round(x + nx * sg * 4.6), pz = Math.round(z + nz * sg * 4.6); if (v.get(px, T, pz) && !v.has(px, T + 1, pz)) { v.box(px, T + 1, pz, px, T + 1, pz, '#9aa3ab'); lampPos.push([px + 0.5, pz + 0.5]); } } } }
const world = v.mesh(); scene.add(world);
const water = (() => { const w = new Vox(); w.jitter = 0.02; for (const [x, z] of pondCells) w.set(x, T - 1, z, '#53b9e6'); const m = w.mesh({ castShadow: false }); m.material.transparent = true; m.material.opacity = 0.85; m.position.y = 0.55; return m; })();

{ let ez = 38; while (v.has(15, T - 1, ez + 1)) ez++; upd.push(waterfall(scene, { x: 15.5, y: T - 0.5, z: ez + 0.5, dir: [0, 1], width: 3, length: 34 })); }

const fw = [[-20, 20, -6, 33.8], [12, 24, 0, 34.4], [28, 18, 8, 35.0], [-6, 26, 10, 35.6], [18, 22, -12, 36.2], [-28, 22, 14, 36.8]].map(([x, y, z, t0], i) => burst(scene, { at: [x, y, z], t0, n: 90, colors: [['#16ffc6', '#59c7fc', '#ffffff'], ['#ffc83d', '#ff6a4a', '#ffffff'], ['#b28cff', '#ff7eb6', '#ffffff']][i % 3], size: 0.9, speed: 14, gravity: 6, up: 3, life: 2.4 }));

const moon = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 6), new THREE.MeshBasicMaterial({ color: 0xfff4c8 })); moon.position.set(-300, 420, -700); moon.lookAt(0, 0, 0); scene.add(moon);

const winMat = new THREE.MeshBasicMaterial({ color: 0xffd66b, transparent: true, opacity: 0 });

lampPos.forEach(([x, z], i) => { glow.setAt(i, x, T + 2.3, z, 0, 0, 0.7); glow.setColor(i, '#ffe2a0'); }); glow.done();

const rings = particles(lampPos.length, { size: 1 }); rings.material = new THREE.MeshBasicMaterial({ color: 0x16ffc6, transparent: true, opacity: 0.0 }); scene.add(rings);
lampPos.forEach(([x, z], i) => { rings.setAt(i, x, T + 1.05, z, 0, 0, 1); }); rings.done(); rings.scale.set(1, 0.08, 1); rings.position.y = 0.95;

// characters

const kids = [person({ shirt: '#ff7a59', pants: '#2c3e66', skin: '#8d5a3b' }), person({ shirt: '#59c7fc', pants: '#3b3b5c', skin: '#e0b08a', hair: '#6b3e1e' }), person({ shirt: '#ffc83d', pants: '#2c3e66', skin: '#c68a5e' })];
kids.forEach((k) => scene.add(k));

const scooterKid = person({ shirt: '#ff6a4a', pants: '#2c3e66', skin: '#a8714b', s: 0.28 });
const scooter = new Vox(); scooter.box(-1, 0, -2, 1, 0, 2, '#59c7fc'); scooter.box(0, 1, -2, 0, 5, -2, '#59c7fc'); scooter.box(-1, 5, -2, 1, 5, -2, '#222'); scooter.set(0, -1, -2, '#222'); scooter.set(0, -1, 2, '#222');
const scooterMesh = scooter.mesh({ scale: 0.28 }); const scooterG = new THREE.Group(); scooterMesh.position.y = 0.3; scooterKid.position.y = 0.55; scooterG.add(scooterMesh, scooterKid); scene.add(scooterG);
const ducks = [0, 1, 2, 3].map((i) => { const d = duck(); scene.add(d); return d; });

// ---------------- timeline ----------------
const night = (t) => (t >= 23.5 ? 1 : 0);
const fogK = (t) => (t < 23.5 ? 0 : t < 30.6 ? 1 : t < 33 ? 1 - prog(t, 30.6, 32.4) * 0.85 : 0);
scene.fog = new THREE.Fog(0x22304f, 10, 4000);
const skyDay = ['#bfe3ff', '#eef8ff'], skyDawn = ['#ffcfa8', '#d7ecff'], skyNight = ['#142650', '#4a6290'];
function mixHex(a, b, k) { return '#' + hex(a).lerp(hex(b), k).getHexString(); }

function drive(t, t0, t1, a, b, e = ease.inOut) { const k = e(clamp((t - t0) / (t1 - t0))); return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; }
function placePip(x, z, ang, brake = 0) { pip.position.set(x, T + 1, z); pip.rotation.set(-brake * 0.08, ang, 0); }

st.onFrame((t) => {
  const n = night(t);
  st.setSky(n ? '#061a52' : '#1f78f0', n ? '#1f5ad0' : '#78c4ff');
  st.dome.material.uniforms.sunAmt.value = n ? 0 : 1;
  sun.intensity = n ? 1.5 : 3.1; sun.color.set(n ? 0xa9c2ff : 0xfff0d8); sun.castShadow = true;
  hemi.intensity = n ? 1.0 : 1.35; hemi.color.set(n ? 0x7c9cff : 0xcfe8ff); hemi.groundColor.set(n ? 0x1a2550 : 0x7a5a3a);
  st.rim.intensity = n ? 1.6 : 0.9; st.rim.color.set(n ? 0x6fb0ff : 0xbfe0ff);
  starsP.visible = moon.visible = !!n;
  st.fx.bloom.strength = n ? 0.6 : 0.3; st.fx.bloom.threshold = n ? 0.72 : 0.92;
  st.fx.grade.uniforms.sat.value = n ? 1.3 : 1.22;
  const wide = t < 3.8 ? false : (t < 8.5 || within(t, 8.5, 13) || t >= 33);
  st.fx.setTilt(0.52, t < 3.8 ? 0 : wide ? 3.2 : 1.4);
  winMat.opacity = n; scene.fog.near = 4000; scene.fog.far = 5000;
  glow.material.color.set(0xffe2a0); glow.material.opacity = n ? 1 : 0;
  const gk = t > 33.2 ? prog(t, 33.4, 36.8, (x) => x) : 0; const ng = Math.floor(lampPos.length * gk); rings.count = ng; rings.material.opacity = ng > 0 ? 0.9 : 0;
  lampPos.forEach((_, i) => glow.setColor(i, i < ng ? '#16ffc6' : '#ffe2a0')); glow.instanceColor.needsUpdate = true;
  headlight.intensity = n ? 16 : 0; headlight.position.copy(pip.position).add(new THREE.Vector3(Math.sin(pip.rotation.y) * 4, 2, Math.cos(pip.rotation.y) * 4));
  fireflies.material.opacity = t > 33 ? prog(t, 33.5, 35) : 0;
  for (let i = 0; i < 70; i++) { const a = rand(i, 1), b = rand(i, 2); fireflies.setAt(i, -40 + a * 80 + Math.sin(t * 0.9 + i) * 1.5, T + 2 + Math.sin(t * 1.7 + i * 3) * 1.2 + b * 4, -28 + b * 56 + Math.cos(t * 0.7 + i) * 1.5); }
  fireflies.done();
  // ducks paddle
  ducks.forEach((d, i) => { const a = t * 0.25 + i * 1.6; d.position.set(-14 + Math.cos(a) * (5 - i * 0.6), T + 0.6, -5 + Math.sin(a) * (3.6 - i * 0.4)); d.rotation.y = -a; });
  // walker in S2 crossing grass
  walker.position.set(-35 + t * 1.6, T + 1, -3); walker.rotation.y = -Math.PI / 2; walker.userData.walk(t * 7);

  // Pip by shot
  pip.visible = t >= 3.8;
  if (t < 8.5) { const [, z] = drive(t, 0, 8.5, [0, 12], [0, -6], (x) => x); placePip(-30.5, z, Math.PI); }
  else if (t < 13) placePip(-31, 4, Math.PI);
  else if (t < 18) { const [x, z] = drive(t, 13, 15.6, [-26, 18.6], [-7.5, 18.6], ease.out); placePip(x, z, Math.PI / 2, t > 15.0 && t < 15.9 ? 1 : 0); if (t > 16.8) { const [x2] = drive(t, 16.8, 18, [-7.5], [2], ease.in); placePip(x2, 18.6, Math.PI / 2); } }
  else if (t < 23.5) { const [x, z] = drive(t, 18, 20.4, [31.4, 18], [31.4, 1.5], ease.out); placePip(x, z, Math.PI, within(t, 20.0, 20.7) ? 2.5 : 0); }
  else if (t < 33) { const [x, z] = drive(t, 23.5, 25.8, [-22, 18.6], [-8, 18.6], ease.out); placePip(x, z, Math.PI / 2, within(t, 25.3, 26) ? 1.5 : 0); if (t > 32.0) { const [x2] = drive(t, 32.0, 33, [-8], [-2], ease.in); placePip(x2, 18.6, Math.PI / 2); } }
  else { const u = (t - 33) * 0.05; const x = -8 + u * 120; placePip(Math.min(x, 26), 18.6, Math.PI / 2); }

});

// ---------------- overlay ----------------

const hud = el(`<div style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)">

  ${[[40,40,'tl'],[1880,40,'tr'],[40,1040,'bl'],[1880,1040,'br']].map(([x,y,c])=>`<div style="position:absolute;left:${x-(c[1]=='r'?70:0)}px;top:${y-(c[0]=='b'?70:0)}px;width:70px;height:70px;border:6px solid rgba(255,255,255,.85);border-${c[0]=='t'?'bottom':'top'}:0;border-${c[1]=='l'?'right':'left'}:0"></div>`).join('')}
  <div style="position:absolute;right:70px;top:56px;color:#fff;font-weight:800;font-size:24px;letter-spacing:.1em">BOOK: 0 PICTURES</div></div>`, { x: 0, y: 0 });

// "?" boxes in S2
function bboxEl(cls = '') { const d = document.createElement('div'); d.className = 'bbox ' + cls; d.innerHTML = '<span></span>'; d.style.opacity = 0; document.getElementById('ui').appendChild(d); return d; }
const box3 = new THREE.Box3();
function placeBox(d, obj, label, vis, pad = 6) {
  if (!vis) { d.style.opacity = 0; return; }
  box3.setFromObject(obj); const c = [];
  for (const x of [box3.min.x, box3.max.x]) for (const y of [box3.min.y, box3.max.y]) for (const z of [box3.min.z, box3.max.z]) c.push(toScreen(new THREE.Vector3(x, y, z), camera));
  const xs = c.map((p) => p.x), ys = c.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  Object.assign(d.style, { left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px', opacity: vis });
  d.firstChild.innerHTML = label;
}
const qTree = new THREE.Object3D(); qTree.position.set(-44, 6, 4); const qTreeHelper = new THREE.Mesh(new THREE.BoxGeometry(6, 9, 6)); qTreeHelper.visible = false; qTreeHelper.position.set(-34, 5.5, -14); scene.add(qTreeHelper);

const bQ = [bboxEl('warn'), bboxEl('warn'), bboxEl('warn')];

add((t) => {
  const qv = within(t, 5.0, 8.4) ? prog(t, 5.0, 5.4) : 0;
  placeBox(bQ[0], walker, '???', within(t, 0.6, 3.8) ? prog(t, 0.6, 0.9) : 0);
