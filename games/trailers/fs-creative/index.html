<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, island, tree, house, person, particles, rand, noise2 } from '../engine/kit.js';
import { el, cue, fader, titleCard } from '../engine/ui.js';
import { Furn, table, chair, seated, standing, plant, screenPlane, monitor, laptop, draw, ICO, ui, briefHTML, briefChipHTML, aiHTML, findHTML, signHTML, folderHTML, pathHTML, endTitleHTML, aiReact, findFix, checkStrip, pin, place, fadeIO, typed, setHTML } from './fs.js';

const DUR = 38.6;
const st = createStage({ sky: ['#5db6ff', '#d9efff'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.5; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #4fb0ff 0%, #8fd0ff 55%, #dff2ff 100%)';
sun.intensity = 2.8; sun.position.set(-50, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;

// ---------- island, studio shell, festival town ----------
const v = new Vox(); v.jitter = 0.06;
const isl = island(v, { rx: 37, rz: 27, top: 0, depth: 14, seed: 8, wobble: 3 });
const F = 1;
const OX0 = -19, OX1 = 6, OZ0 = -9, OZ1 = 8;
for (let x = OX0; x <= OX1; x++) for (let z = OZ0; z <= OZ1; z++) v.set(x, 0, z, (x + z) % 2 ? '#dfe3e6' : '#d3d8dc');
const WALL = '#f6f3ee', TRIM = '#ff8a4a';
for (let x = OX0; x <= OX1; x++) for (let y = 1; y <= 7; y++) { const win = y >= 2 && y <= 5 && ((x - OX0) % 5 !== 0) && x > OX0 && x < OX1 && !(x >= -12 && x <= 0); v.set(x, y, OZ0, win ? null : (y === 7 ? TRIM : WALL)); }
for (let z = OZ0; z <= OZ1; z++) for (let y = 1; y <= 7; y++) { const win = y >= 2 && y <= 5 && ((z - OZ0) % 5 !== 0) && z > OZ0 && z < OZ1 - 1; v.set(OX0, y, z, win ? null : (y === 7 ? TRIM : WALL)); }
for (let z = OZ0; z <= OZ1; z++) if (z < -1 || z > 2) for (let y = 1; y <= 2; y++) v.set(OX1, y, z, y === 2 ? TRIM : WALL);
for (let x = -34; x <= 34; x++) for (let z = -14; z <= -11; z++) if (isl.top(x, z) != null) v.set(x, 0, z, z === -12 && x % 4 === 0 ? '#f2f2ea' : '#5b6168');
const HC = [['#d0573a', '#f1ebe0'], ['#5a6d80', '#efe2c9'], ['#3f8f7a', '#f4efe6'], ['#d0573a', '#efe2c9'], ['#6e5bf2', '#f1ebe0']];
[[-30, -21, 7, 5, 4], [-21, -22, 6, 6, 5], [-12, -23, 8, 6, 6], [-1, -22, 6, 5, 4], [8, -21, 7, 5, 5]].forEach(([x, z, w, d, h], i) => house(v, x, 0, z, { w, d, h, roof: HC[i][0], wall: HC[i][1] }));
// harbour green: paths, pond (harbour pool), stage, stalls, trees
for (let x = 9; x <= 34; x++) for (let z = -9; z <= 22; z++) { if (isl.top(x, z) == null) continue; if (Math.abs(z - 4 - Math.sin(x / 4) * 2) < 1.1 || Math.abs(x - 15) < 1 && z > -9) v.set(x, 0, z, '#d9c9a0'); }
for (let x = 21; x <= 33; x++) for (let z = 9; z <= 17; z++) if (Math.hypot((x - 27) / 5.4, (z - 13) / 3.8) < 1) v.set(x, 0, z, '#4fb6e8');
// small boat on the pool
v.box(25, 1, 12, 28, 1, 13, '#d0573a'); v.set(26, 2, 12, '#7a5232'); v.box(26, 3, 12, 26, 4, 12, '#f4f1ea');
// stage
v.box(19, 1, -8, 30, 2, -2, '#7a5233'); v.box(19, 3, -8, 30, 9, -8, '#f4efe6'); for (let x = 19; x <= 30; x++) v.set(x, 10, -8, x % 2 ? '#ff8a4a' : '#ffd23f');
// stalls with striped awnings
for (const [x, z] of [[11, 10], [11, 15], [17, 17]]) { v.box(x, 1, z, x + 2, 2, z + 2, '#f4efe6'); for (let i = 0; i <= 2; i++) for (let j = 0; j <= 2; j++) v.set(x + i, 4, z + j, (i + j) % 2 ? '#e5484d' : '#ffffff'); v.box(x, 3, z, x, 3, z, '#7a5232'); v.box(x + 2, 3, z + 2, x + 2, 3, z + 2, '#7a5232'); }
for (const [x, z] of [[12, -5], [33, -1], [31, 3], [9, 20], [-22, 16], [-28, 8], [-31, 12], [26, 19], [22, 21]]) if (isl.top(x, z) != null) tree(v, x, 0, z, { kind: 'round' });
for (const [x, z] of [[33, -6], [-34, 2], [-25, -16], [16, -17], [-30, -6]]) if (isl.top(x, z) != null) tree(v, x, 0, z, { kind: 'pine' });
// lantern poles
const LP = [[8, -10], [34, -10], [-34, -10]];
for (const [x, z] of LP) if (isl.top(x, z) != null) for (let y = 1; y <= 9; y++) v.set(x, y, z, '#59636b');
scene.add(v.mesh());
// lantern strings (fine voxels)
const f = new Furn();
const LC = ['#ff5d6c', '#ffd23f', '#ff8a4a', '#16c79a', '#6e5bf2', '#f2a3c0'];
const string = (a, b, n, sag = 2.2) => { for (let i = 0; i <= n; i++) { const k = i / n; const x = lerp(a[0], b[0], k), z = lerp(a[2], b[2], k), y = lerp(a[1], b[1], k) - Math.sin(k * Math.PI) * sag; f.box(x - 0.25, y - 0.5, z - 0.25, x + 0.25, y, z + 0.25, LC[i % LC.length]); } };
string([-34.5, 9.5, -10], [8.5, 9.5, -10], 30, 1.6); string([8.5, 9.5, -10], [34.5, 9.5, -10], 20, 1.6);
// stage banner
screenPlane(scene, 10.6, 5.2, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#2bb3a6'); gr.addColorStop(1, '#13808a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#ffd23f'; g.font = `800 ${h * 0.2}px Inter, sans-serif`; g.textAlign = 'center'; g.fillText('LANTERN', w / 2, h * 0.42); g.fillText('FESTIVAL', w / 2, h * 0.66); g.fillStyle = '#ffffff'; g.font = `700 ${h * 0.1}px Inter, sans-serif`; g.fillText('SAT 14 NOV', w / 2, h * 0.86); }, { pos: [25, 6.6, -7.95], facing: 's', px: 512 });

// ---------- studio interior ----------
table(f, F, -12, -2, -1, 2, { top: '#f4efe6', leg: '#3d4a54' });
const FAR = -2.9;
const seatsFar = [-9.8, -6.5, -3.2];
seatsFar.forEach((x) => chair(f, F, x, FAR, 's', { c: '#ff8a4a' }));
chair(f, F, -13, 0, 'e', { c: '#ff8a4a' }); chair(f, F, 0, 0, 'w', { c: '#ff8a4a' });
laptop(f, scene, F, seatsFar[0], -1.2, 'n', draw.doc('#ff8a4a'));
laptop(f, scene, F, seatsFar[1], -1.2, 'n', draw.dark());
laptop(f, scene, F, seatsFar[2], -1.2, 'n', draw.sheet('#6e5bf2'));
laptop(f, scene, F, -11.4, 0, 'w', draw.chart('#ff8a4a')); laptop(f, scene, F, -1.6, 0, 'e', draw.doc());
// drawing tablet + sketches on the table
f.box(-7.2, F + 1.1, 0.3, -5.6, F + 1.18, 1.3, '#26323c'); f.box(-4.2, F + 1.1, 0.4, -3.2, F + 1.15, 1.6, '#ffffff'); f.box(-10.8, F + 1.1, 0.5, -9.8, F + 1.15, 1.7, '#fff3c4');
// pinboard with mini posters on the back wall (fills the window gap)
f.box(-12, F, OZ0 + 1, 1, F + 6, OZ0 + 1.25, '#f6f3ee');
f.box(-11.5, F + 1.75, OZ0 + 1.25, 0.5, F + 5.5, OZ0 + 1.5, '#c99a5e');
const PC = [['#0f5d63', '#ffd23f'], ['#ff5d6c', '#ffffff'], ['#6e5bf2', '#ffd23f'], ['#ffd23f', '#13202b'], ['#16c79a', '#ffffff'], ['#13202b', '#ff8a4a'], ['#3a8de0', '#ffffff'], ['#ff8a4a', '#13202b']];
PC.forEach(([a, b], i) => { const x = -11 + (i % 4) * 2.9 + (i > 3 ? 0.8 : 0), y = F + (i > 3 ? 2.0 : 3.6); f.box(x, y, OZ0 + 1.5, x + 1.5, y + 1.5 + (i % 2) * 0.25, OZ0 + 1.75, a); f.box(x + 0.25, y + 0.25, OZ0 + 1.75, x + 1.25, y + 0.75, OZ0 + 2, b); });
// easel with a printed proof
f.box(1.5, F, -5, 1.75, F + 4, -4.75, '#7a5232'); f.box(3.25, F, -5, 3.5, F + 4, -4.75, '#7a5232'); f.box(1.25, F + 1.5, -4.75, 3.75, F + 1.75, -4.25, '#7a5232');
f.box(1.5, F + 1.75, -4.75, 3.5, F + 4.5, -4.5, '#0f5d63'); f.box(1.75, F + 3.25, -4.5, 2.75, F + 4.25, -4.25, '#ffd23f'); f.box(2.25, F + 2.25, -4.5, 3.25, F + 3, -4.25, '#ff8a4a');
// big printer
f.box(2, F, 4.5, 4.75, F + 2, 6.5, '#e8edf0'); f.box(2.25, F + 2, 4.75, 4.5, F + 2.25, 6.25, '#9aa6b0'); f.box(2.5, F + 1.25, 6.5, 4.25, F + 1.5, 7.25, '#ffffff');
// sofa
f.box(-17.5, F, 3, -16, F + 1, 7.5, '#ffd23f'); f.box(-18, F, 3, -17.5, F + 2, 7.5, '#f2b81c'); f.box(-17.5, F + 1, 3, -16, F + 1.5, 3.5, '#f2b81c'); f.box(-17.5, F + 1, 7, -16, F + 1.5, 7.5, '#f2b81c');
for (const [x, z] of [[OX0 + 1.5, OZ0 + 1.5], [OX1 - 1.5, OZ0 + 1.5], [OX1 - 1.5, 2.8], [-15, OZ1 - 0.8]]) plant(f, F, x, z);
// paint shelf
f.box(-18, F, -7.5, -17, F + 3, -4.5, '#9a6a3e'); for (let k = 0; k < 3; k++) for (let j = 0; j < 4; j++) f.box(-17.75, F + 0.5 + k, -7.25 + j * 0.75, -17.25, F + 1 + k, -6.75 + j * 0.75, LC[(k * 4 + j) % 6]);
scene.add(f.mesh());

// ---------- people ----------
const S = 0.36;
const P = (shirt, skin, hair, pants = '#2c3e66') => ({ shirt, skin, hair, pants, s: S });
const team = [
  seated(P('#6e5bf2', '#8a5a3a', '#1a120c'), seatsFar[0], FAR, 's', F),
  seated(P('#ffd23f', '#e8b890', '#b5572a', '#34405a'), seatsFar[1], FAR, 's', F), // Leo
  seated(P('#16c79a', '#c68a5e', '#2b1d14'), seatsFar[2], FAR, 's', F),
  seated(P('#e5484d', '#f0c8a0', '#6b3a1e'), -13, 0, 'e', F),
  seated(P('#3a8de0', '#7a4a2c', '#1a120c', '#3a3a3a'), 0, 0, 'w', F),
];
team.forEach((p) => scene.add(p));
const LEO = team[1];
const mentor = standing({ shirt: '#13202b', pants: '#4a5560', skin: '#6b4428', hair: '#1a120c', s: S }, 1.0, -6.4, 's', F);
const lan = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.06), new THREE.MeshLambertMaterial({ color: '#ff8a4a' })); lan.position.set(0, 1.6, -0.4); mentor.add(lan);
scene.add(mentor);
const walkers = [['#e5484d', '#c68a5e'], ['#3a8de0', '#8a5a3a'], ['#ffd23f', '#e0b08a'], ['#16c79a', '#a0683f'], ['#f2a3c0', '#7a4a2c']].map(([shirt, skin]) => { const p = person({ shirt, skin, hair: '#2b1d14', s: 0.34 }); scene.add(p); return p; });
const band = [['#ff8a4a', '#7a4a2c'], ['#6e5bf2', '#e0b08a']].map(([shirt, skin], i) => { const p = standing({ shirt, skin, hair: '#1a120c', s: 0.34 }, 22 + i * 4, -5, 's', 3); scene.add(p); return p; });

// ---------- camera + motion ----------
// 0-2.8 brief | 3.0 poster (sketch) | 5.4 AI draft | 10.6 review: Data ✓ Case ✓ | 12.2 Source red (wrong licence) | 18.0 Authority red (living artist's style) | 24.0 sign-off + before/after | 28.6 portfolio | 32.6 pathway | 35.8 title
const WIDE = (t) => ({ look: [-2, -2, 0], ang: lerp(-0.78, -0.5, t), dist: lerp(128, 104, ease.out(t)), hgt: lerp(84, 70, t), ox: 0, oy: 0 });
const MED = (t) => ({ look: [-7.2, 2.0, -1.2], ang: lerp(-0.36, -0.24, t), dist: lerp(38, 35, t), hgt: lerp(23, 21, t), ox: 420, oy: 30 });
const END = (t) => ({ look: [-2, -3, 0], ang: lerp(-0.66, -0.4, t), dist: 166, hgt: 104, ox: 440, oy: -10 });
const mix = (a, b, k, ko = k) => { const c = {}; for (const key of ['ang', 'dist', 'hgt']) c[key] = lerp(a[key], b[key], k); for (const key of ['ox', 'oy']) c[key] = lerp(a[key], b[key], ko); c.look = a.look.map((q, i) => lerp(q, b.look[i], k)); return c; };
const T_MED = 4.0, T_OUT = 28.6, T_END = 31.6;
st.onFrame((t) => {
  let c;
  if (t < 1.4) c = WIDE(prog(t, 0, 1.4, (k) => k) * 0.4);
  else if (t < T_MED) c = mix(WIDE(0.4), MED(0), prog(t, 1.4, T_MED), prog(t, 2.2, T_MED + 0.2));
  else if (t < T_OUT) c = MED(prog(t, T_MED, T_OUT, (k) => k));
  else if (t < T_END) c = mix(MED(1), END(0), prog(t, T_OUT, T_END));
  else c = END(prog(t, T_END, DUR, (k) => k));
  camera.fov = 30;
  if (c.ox || c.oy) camera.setViewOffset(1920, 1080, c.ox, c.oy, 1920, 1080); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  camera.position.set(Math.sin(c.ang) * c.dist + c.look[0], c.hgt + c.look[1], Math.cos(c.ang) * c.dist + c.look[2]);
  camera.lookAt(c.look[0], c.look[1], c.look[2]);
  team.forEach((p, i) => { const b = p.userData.base; p.position.y = b.y + Math.max(0, Math.sin(t * 1.3 + i * 1.7)) * 0.05; p.rotation.x = 0; });
  LEO.rotation.x = -0.18 * prog(t, 11.0, 11.8) * (1 - prog(t, 24.0, 24.8));
  // mentor stays by the easel (clear of Leo)
  mentor.position.set(1.0, F, -6.4); mentor.rotation.y = Math.PI; mentor.userData.walk(0);
  walkers.forEach((p, i) => { const u = t * 0.032 + i * 0.2; const a = u * Math.PI * 2; const x = 20 + Math.cos(a) * 9, z = 6 + Math.sin(a) * 6.5; p.position.set(x, F, z); p.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)) + Math.PI; p.userData.walk(t * 8 + i); });
  band.forEach((p, i) => { p.position.y = 3 + Math.max(0, Math.sin(t * 6 + i * 2)) * 0.35; });
});

// ---------- posters (SVG) ----------
const lanternK = (x, y, c) => `<line x1="${x}" y1="186" x2="${x}" y2="${y - 50}" stroke="#0d0d0d" stroke-width="4"/><rect x="${x - 22}" y="${y - 54}" width="44" height="12" rx="3" fill="#0d0d0d"/><rect x="${x - 38}" y="${y - 44}" width="76" height="92" rx="32" fill="${c}" stroke="#0d0d0d" stroke-width="7"/><path d="M${x - 14} ${y - 40}v84M${x + 14} ${y - 40}v84" stroke="#0d0d0d" stroke-width="5"/><rect x="${x - 22}" y="${y + 46}" width="44" height="12" rx="3" fill="#0d0d0d"/><path d="M${x - 28} ${y - 26}q-6 20 0 40" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>`;
const lanternL = (x, y, r, c, c2) => `<path d="M${x} 186 Q${x + 6} ${y - r - 20} ${x} ${y - r}" stroke="#f4efe6" stroke-width="2" fill="none"/><circle cx="${x + 6}" cy="${y + 6}" r="${r}" fill="#00000033"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><ellipse cx="${x}" cy="${y}" rx="${r * 0.55}" ry="${r}" fill="${c2}"/><ellipse cx="${x}" cy="${y}" rx="${r * 0.18}" ry="${r}" fill="${c}"/><rect x="${x - 8}" y="${y + r - 2}" width="16" height="8" fill="#f4efe6"/><path d="M${x} ${y + r + 6}v14" stroke="#f4efe6" stroke-width="3"/>`;
const sketchL = (x, y, r) => `<path d="M${x} 186 L${x} ${y - r}" stroke="#9aa6b0" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#7f8b95" stroke-width="2.5" stroke-dasharray="7 4"/><ellipse cx="${x}" cy="${y}" rx="${r * 0.55}" ry="${r}" fill="none" stroke="#9aa6b0" stroke-width="2"/>`;
const LANT = [[100, 290, 44], [200, 252, 36], [290, 312, 48]];
const TXT = (c, c2) => `<text x="30" y="56" font-family="Inter" font-weight="800" font-size="19" letter-spacing="5" fill="${c2}">HARBOURSIDE</text><text x="28" y="112" font-family="Inter" font-weight="800" font-size="60" fill="${c}">Lantern</text><text x="28" y="170" font-family="Inter" font-weight="800" font-size="60" fill="${c}">Festival</text><text x="30" y="508" font-family="Inter" font-weight="800" font-size="19" letter-spacing="1.5" fill="${c2}">SAT 14 NOV · HARBOUR GREEN</text>`;
const SVG = (inner) => `<svg viewBox="0 0 380 537" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
