const bg = document.getElementById('bg');
const SKY0 = ['#2f8fff', '#6cbcff', '#bfe6ff'], SKY1 = ['#1440c0', '#3b80ee', '#8cc8ff'];
const _c1 = new THREE.Color(), _c2 = new THREE.Color();

const space = document.getElementById('space');
space.style.background = 'linear-gradient(180deg, #0e0a3a 0%, #22168a 55%, #3d2ab8 100%)';
const starCv = document.createElement('canvas'); starCv.width = 1920; starCv.height = 2160; starCv.style.cssText = 'position:absolute;left:0;top:0';
{ const g = starCv.getContext('2d'); for (let i = 0; i < 520; i++) { const x = rand(i, 1) * 1920, y = rand(i, 2) * 2160, r = rand(i, 3) > 0.9 ? 2.4 : 1.3; g.fillStyle = `rgba(255,255,255,${0.5 + rand(i, 4) * 0.5})`; g.fillRect(x, y, r * 2, r * 2); } g.fillStyle = '#4fa8ff'; g.beginPath(); g.arc(1600, 250, 10, 0, 7); g.fill(); space.appendChild(starCv); }

const O1 = new THREE.Vector3(0, 0, 0), O2 = new THREE.Vector3(300, 0, 0), O3 = new THREE.Vector3(0, 0, 300), O4 = new THREE.Vector3(-300, 0, 0);

G2.position.copy(O2); G3.position.copy(O3); G4.position.copy(O4); scene.add(G1, G2, G3, G4);

// ---------- voxel cloud ----------
function cloud(seed, s = 1) { const v = new Vox(); v.jitter = 0.02; const w = 5 + Math.floor(rand(seed, 1) * 4), d = 3; for (let x = -w; x <= w; x++) for (let z = -d; z <= d; z++) for (let y = 0; y <= 3; y++) { const r = Math.hypot(x / w, z / d, (y - 1) / 2.6) + (noise2(x * 0.5 + seed, z * 0.5 + y, 3) - 0.5) * 0.5; if (r < 1) v.set(x, y, z, y === 0 ? '#e4eef8' : '#ffffff'); } const m = v.mesh({ scale: s, castShadow: false, receiveShadow: false }); m.material.emissive = new THREE.Color('#ffffff'); m.material.emissiveIntensity = 0.3; return m; }

// ---------- booster (about 3.2 units tall, origin at the feet) ----------
const LEGM = new THREE.MeshLambertMaterial({ color: '#3a4250' });

  for (const [x, z] of [[3, 0], [-3, 0], [0, 3], [0, -3]]) { v.set(x, 11, z, '#5c6472'); v.set(x, 12, z, '#5c6472'); }
  v.set(0, 5, -3 + 0, null); v.box(-1, 5, -3, -1, 6, -3, '#59c7fc');
  v.box(-1, -1, -1, 1, -1, 1, '#4a4f5a'); v.set(0, -2, 0, '#3a3f4a'); v.set(1, -2, 0, '#3a3f4a'); v.set(-1, -2, 0, '#3a3f4a'); v.set(0, -2, 1, '#3a3f4a'); v.set(0, -2, -1, '#3a3f4a');
  const m = v.mesh({ scale: 0.2, offset: [-0.1, 0.55, -0.1] }); g.add(m);

    const legGeo = new THREE.BoxGeometry(0.14, 1.05, 0.14); legGeo.translate(0, 0.525, 0); const leg = new THREE.Mesh(legGeo, LEGM); leg.castShadow = true;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.28), LEGM); foot.position.y = 1.05; leg.add(foot);
    piv.add(leg); g.add(piv); legs.push(leg);
  }
  g.userData.setLegs = (k) => legs.forEach((l) => (l.rotation.z = -lerp(0.05, 2.44, k)));
  g.userData.setLegs(1);
  if (ghost) g.traverse((o) => { if (o.isMesh) { o.material = new THREE.MeshBasicMaterial({ color: '#00e1ff', transparent: true, opacity: 0.8, depthWrite: false }); o.castShadow = false; } });
  return g;
}

// ---------- launch rocket: booster stage + upper stage (voxel 0.3, about 10 units tall) ----------
const rocketL = new THREE.Group(), lBoost = new THREE.Group(), lUpper = new THREE.Group();
{
  const b = new Vox(); b.jitter = 0.03;
  for (let x = -2; x <= 2; x++) for (let z = -2; z <= 2; z++) { if (Math.abs(x) === 2 && Math.abs(z) === 2) continue; for (let y = 0; y <= 17; y++) { let c = '#f4f5f8'; if (y <= 1) c = '#2a2f3a'; if (y === 9 || y === 10) c = '#5b4ce0'; if (y >= 16) c = '#2a2f3a'; if ((x === 2 || x === -2) && y > 2 && y < 15 && y % 3 === 0) c = '#dfe3ea'; b.set(x, y, z, c); } }
  for (const [x, z] of [[3, 0], [-3, 0], [0, 3], [0, -3]]) b.box(x, 15, z, x, 16, z, '#5c6472');
  for (const [x, z] of [[2, 2], [-2, 2], [2, -2], [-2, -2]]) b.box(x, 1, z, x, 4, z, '#3a4250');
  b.box(-1, -1, -1, 1, -1, 1, '#4a4f5a');
  const bm = b.mesh({ scale: 0.3, offset: [-0.15, 0.3, -0.15] }); lBoost.add(bm);
  const u = new Vox(); u.jitter = 0.03;
  for (let y = 0; y <= 13; y++) { const r = y < 8 ? 2 : y < 10 ? 2 : y < 12 ? 1 : 0; for (let x = -r; x <= r; x++) for (let z = -r; z <= r; z++) { if (r === 2 && Math.abs(x) === 2 && Math.abs(z) === 2) continue; let c = y < 2 ? '#c9cdd6' : y < 8 ? '#ffffff' : '#f4f5f8'; if (y === 4) c = '#ff8a2a'; if (y >= 12) c = '#e8573f'; u.set(x, y, z, c); } }
  u.set(0, 14, 0, '#e8573f'); u.box(-1, -1, -1, 1, -1, 1, '#4a4f5a');
  const um = u.mesh({ scale: 0.3, offset: [-0.15, 0, -0.15] }); lUpper.add(um); lUpper.position.y = 18 * 0.3 + 0.3;
  rocketL.add(lBoost, lUpper); G1.add(rocketL);
}

// ---------- flame + smoke (shared, follow the active engine) ----------
const flame = particles(60, { size: 0.32, emissive: '#ff6a10' }); flame.material.emissiveIntensity = 0.9; for (let i = 0; i < 60; i++) flame.setColor(i, i % 3 === 0 ? '#fff4c0' : i % 3 === 1 ? '#ffc23a' : '#ff8a2a'); scene.add(flame);
const smoke = particles(90, { size: 0.6 }); smoke.material = new THREE.MeshLambertMaterial({ color: '#ffffff', transparent: true, opacity: 0.88 }); for (let i = 0; i < 90; i++) smoke.setColor(i, i % 3 ? '#f2f4f7' : '#d8dde4'); scene.add(smoke);
// launch plume (big voxel flame) and the smoke column left behind
const plume = particles(110, { size: 0.55, emissive: '#ff6a10' }); plume.material.emissiveIntensity = 1; for (let i = 0; i < 110; i++) plume.setColor(i, i % 4 === 0 ? '#ffffff' : i % 4 === 1 ? '#fff1a8' : i % 4 === 2 ? '#ffc23a' : '#ff8a2a'); scene.add(plume);

const _v = new THREE.Vector3();
function drawFlame(emitters, power, t, len = 1.6) {
  const per = Math.floor(60 / emitters.length);
  for (let i = 0; i < 60; i++) { const e = emitters[Math.min(Math.floor(i / per), emitters.length - 1)]; const ph = (t * 4.2 + rand(i, 7)) % 1; const a = rand(i, 8) * 6.28, sp = rand(i, 9) * 0.22 * (0.4 + ph);

}
function drawSmoke(p, amount, t, { spread = 4.5, col = null } = {}) {
  for (let i = 0; i < 90; i++) { const ph = (t * 0.9 + rand(i, 11)) % 1; const a = rand(i, 12) * 6.28; const r = 0.5 + ph * spread * (0.6 + rand(i, 13) * 0.6);
    smoke.setAt(i, p.x + Math.cos(a) * r, p.y + 0.2 + ph * 1.3 * (spread / 4.5) + rand(i, 14) * 0.4, p.z + Math.sin(a) * r, t + i, t * 0.5, amount > 0.02 ? amount * (0.5 + ph * 1.3) * (1 - ph * ph) : 0); }

  for (let i = 0; i < 110; i++) { const ph = (t * 5.5 + rand(i, 21)) % 1; const core = i % 4 < 2; const a = rand(i, 22) * 6.28; const r = (core ? 0.12 : 0.3) * w + ph * (core ? 0.35 : 1.1) * w * rand(i, 23);
    plume.setAt(i, base.x + Math.cos(a) * r, base.y - ph * len * (core ? 0.7 : 1), base.z + Math.sin(a) * r, t * 3 + i, t * 2, power > 0.02 ? power * w * (1.25 - ph) * (core ? 1.1 : 1.3) : 0); }

// ================= ISLAND 1: desert test range =================
const T1 = new Map(); const K = (x, z) => x + ',' + z;
{
  const v = new Vox(); v.jitter = 0.05;
  const RX = 21, RZ = 15;
  const inside = (x, z) => { const a = Math.atan2(z / RZ, x / RX); const w = 1 + (noise2(Math.cos(a) * 2.5 + 4, Math.sin(a) * 2.5 + 4, 7) - 0.5) * 0.2; return Math.hypot(x / RX, z / RZ) < w; };
  const SAND = ['#f2d08c', '#ecc77e', '#f6d898', '#e8c074'], STR = ['#d9a066', '#c48a52', '#e3b47a', '#b07a48', '#cf9a62'];
  for (let x = -RX - 4; x <= RX + 4; x++) for (let z = -RZ - 4; z <= RZ + 4; z++) {
    if (!inside(x, z)) continue;
    const pr = Math.hypot(x, z); const pad = pr < 4.6;
    let h = 0; if (!pad && pr > 7 && noise2(x / 5, z / 5, 3) > 0.66) h = 1;
    const r = Math.hypot(x / RX, z / RZ); const under = Math.round(11 * (1 - r * r * 0.8) + noise2(x / 3, z / 3, 4) * 3);
    for (let y = h - under; y <= h; y++) { let c; if (y === h) { const rim = r > 0.9; c = rim ? (rand(x, 1, z) > .5 ? '#86d65d' : '#6cc04b') : SAND[Math.floor(rand(x, 2, z) * 4)]; } else { const b = Math.floor((y + noise2(x / 5, z / 5, 2) * 2) / 2); c = STR[((b % 5) + 5) % 5]; } v.set(x, y, z, c); }

  }
  for (let y = 1; y <= 11; y++) for (const [x, z] of [[-9, -5], [-7, -5], [-9, -3], [-7, -3]]) v.set(x, y, z, Math.floor((y - 1) / 2) % 2 ? '#f4f1ea' : '#e8573f');
  for (let y = 3; y <= 11; y += 4) v.box(-9, y, -5, -7, y, -3, '#c9ced3');
  v.box(-6, 9, -4, -5, 9, -4, '#9aa0a6');
  v.box(8, 1, -9, 13, 4, -6, '#f1ede4'); v.box(8, 5, -9, 13, 5, -6, '#d9d3c6'); v.box(8, 3, -6, 13, 3, -6, '#5b4ce0'); v.box(10, 1, -6, 10, 2, -6, '#3a2aa8'); v.box(12, 3, -6, 12, 3, -6, '#8fd8ff');
