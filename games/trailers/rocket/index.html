<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, person, particles, rand, noise2 } from '../engine/kit.js';
import { el, cue, fader, titleCard, toScreen } from '../engine/ui.js';
import { burst, birds } from '../engine/extras.js';

const DUR = 37.6;
// ---------- timeline ----------
//  0.0– 3.6 LAUNCH hook: countdown, lift-off, climb through the clouds (real-time clock)
//  3.6–16.8 L4 DRONE SHIP in a storm: card A → NAV 89% “average wind, land now” → dry run lands, a gust tips it over → card B
// 16.8–21.6 MISSION CONTROL: NAV 72% “worst gust 45 km/h, hold”, Flight Director calls HOLD
// 21.6–27.6 20 minutes later: calm sea, booster lands upright, three stars
// 27.6–37.6 hero orbit of the booster on the ship: careers line, then the title, on a soft scrim
const LT = 1.5, SEA = 3.6, ROOM = 16.8, BACK = 21.6, HERO = 27.6;
const TG = 8.0, TD = TG + 1.7, TT = 10.3, TF = 11.0, TFE = 11.5;   // dry run: start, touchdown, gust, fall, on the deck
const TL = 22.0, TLD = TL + 2.2;                                    // real landing: start, touchdown
const HOLD_T = 18.7;
const SEG = (t) => t < SEA ? 'launch' : t < ROOM ? 'sea' : t < BACK ? 'room' : 'sea';

const st = createStage({ sky: ['#2f8fff', '#bfe6ff'], post: true, shadowSize: 4096 });
const { scene, camera, sun, hemi, rim, fx } = st;
sun.shadow.radius = 2; sun.shadow.bias = -0.0004;

const O1 = new THREE.Vector3(0, 0, 0), O2 = new THREE.Vector3(300, 0, 0), O3 = new THREE.Vector3(0, 0, 300);
const G1 = new THREE.Group(), G2 = new THREE.Group(), G3 = new THREE.Group();
G2.position.copy(O2); G3.position.copy(O3); scene.add(G1, G2, G3);
const K = (x, z) => x + ',' + z;

// ---------- voxel cloud ----------
function cloud(seed, s = 1) { const v = new Vox(); v.jitter = 0.02; const w = 5 + Math.floor(rand(seed, 1) * 4), d = 3; for (let x = -w; x <= w; x++) for (let z = -d; z <= d; z++) for (let y = 0; y <= 3; y++) { const r = Math.hypot(x / w, z / d, (y - 1) / 2.6) + (noise2(x * 0.5 + seed, z * 0.5 + y, 3) - 0.5) * 0.5; if (r < 1) v.set(x, y, z, y === 0 ? '#e4eef8' : '#ffffff'); } const m = v.mesh({ scale: s, castShadow: false, receiveShadow: false }); m.material.emissive = new THREE.Color('#ffffff'); m.material.emissiveIntensity = 0.25; return m; }

// ---------- booster (about 3.2 units tall, origin at the feet) ----------
const LEGM = new THREE.MeshLambertMaterial({ color: '#3a4250' });
function makeBooster() {
  const g = new THREE.Group(); const v = new Vox(); v.jitter = 0.03;
  for (let x = -2; x <= 2; x++) for (let z = -2; z <= 2; z++) { if (Math.abs(x) === 2 && Math.abs(z) === 2) continue; for (let y = 0; y <= 12; y++) { let c = '#f4f5f8'; if (y <= 1) c = '#9aa0aa'; if (y === 2 && rand(x, y, z) > 0.5) c = '#c9cdd6'; if (y === 3 && rand(x, y, z) > 0.7) c = '#dcdfe6'; if (y === 8 || y === 9) c = '#5b4ce0'; if (y >= 11) c = '#2a2f3a'; v.set(x, y, z, c); } }
  for (const [x, z] of [[3, 0], [-3, 0], [0, 3], [0, -3]]) { v.set(x, 11, z, '#5c6472'); v.set(x, 12, z, '#5c6472'); }
  v.box(-1, 5, -3, -1, 6, -3, '#59c7fc'); v.box(1, 5, 3, 1, 6, 3, '#ffd23f');
  v.box(-1, -1, -1, 1, -1, 1, '#4a4f5a'); for (const [x, z] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) v.set(x, -2, z, '#3a3f4a');
  const m = v.mesh({ scale: 0.2, offset: [-0.1, 0.55, -0.1] }); g.add(m);
  const legs = [];
  for (let k = 0; k < 4; k++) {
    const b = Math.PI / 4 + k * Math.PI / 2; const piv = new THREE.Group(); piv.position.set(Math.cos(b) * 0.5, 0.75, Math.sin(b) * 0.5); piv.rotation.y = -b;
    const legGeo = new THREE.BoxGeometry(0.14, 1.05, 0.14); legGeo.translate(0, 0.525, 0); const leg = new THREE.Mesh(legGeo, LEGM); leg.castShadow = true;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.28), LEGM); foot.position.y = 1.05; leg.add(foot);
    piv.add(leg); g.add(piv); legs.push(leg);
  }
  g.userData.setLegs = (k) => legs.forEach((l) => (l.rotation.z = -lerp(0.05, 2.44, k)));
  g.userData.setLegs(1);
  return g;
}

// ---------- launch rocket: booster stage + upper stage (voxel 0.3) ----------
const rocketL = new THREE.Group();
{
  const b = new Vox(); b.jitter = 0.03;
  for (let x = -2; x <= 2; x++) for (let z = -2; z <= 2; z++) { if (Math.abs(x) === 2 && Math.abs(z) === 2) continue; for (let y = 0; y <= 17; y++) { let c = '#f4f5f8'; if (y <= 1) c = '#2a2f3a'; if (y === 9 || y === 10) c = '#5b4ce0'; if (y >= 16) c = '#2a2f3a'; if ((x === 2 || x === -2) && y > 2 && y < 15 && y % 3 === 0) c = '#dfe3ea'; b.set(x, y, z, c); } }
  for (const [x, z] of [[3, 0], [-3, 0], [0, 3], [0, -3]]) b.box(x, 15, z, x, 16, z, '#5c6472');
  for (const [x, z] of [[2, 2], [-2, 2], [2, -2], [-2, -2]]) b.box(x, 1, z, x, 4, z, '#3a4250');
  b.box(-1, -1, -1, 1, -1, 1, '#4a4f5a');
  const u = new Vox(); u.jitter = 0.03;
  for (let y = 0; y <= 13; y++) { const r = y < 10 ? 2 : y < 12 ? 1 : 0; for (let x = -r; x <= r; x++) for (let z = -r; z <= r; z++) { if (r === 2 && Math.abs(x) === 2 && Math.abs(z) === 2) continue; let c = y < 2 ? '#c9cdd6' : '#ffffff'; if (y === 4) c = '#ff8a2a'; if (y >= 12) c = '#e8573f'; u.set(x, y, z, c); } }
  u.set(0, 14, 0, '#e8573f'); u.box(-1, -1, -1, 1, -1, 1, '#4a4f5a');
  const bm = b.mesh({ scale: 0.3, offset: [-0.15, 0.3, -0.15] }); const um = u.mesh({ scale: 0.3, offset: [-0.15, 18 * 0.3 + 0.3, -0.15] });
  rocketL.add(bm, um); G1.add(rocketL);
}

// ---------- flame + smoke ----------
const flame = particles(60, { size: 0.32, emissive: '#ff6a10' }); flame.material.emissiveIntensity = 0.9; for (let i = 0; i < 60; i++) flame.setColor(i, i % 3 === 0 ? '#fff4c0' : i % 3 === 1 ? '#ffc23a' : '#ff8a2a'); scene.add(flame);
const smoke = particles(90, { size: 0.6 }); smoke.material = new THREE.MeshLambertMaterial({ color: '#ffffff', transparent: true, opacity: 0.9 }); for (let i = 0; i < 90; i++) smoke.setColor(i, i % 3 ? '#f2f4f7' : '#d8dde4'); scene.add(smoke);
const plume = particles(110, { size: 0.55, emissive: '#ff6a10' }); plume.material.emissiveIntensity = 1; for (let i = 0; i < 110; i++) plume.setColor(i, i % 4 === 0 ? '#ffffff' : i % 4 === 1 ? '#fff1a8' : i % 4 === 2 ? '#ffc23a' : '#ff8a2a'); scene.add(plume);
const trail = particles(120, { size: 1 }); trail.material = new THREE.MeshLambertMaterial({ color: '#ffffff', transparent: true, opacity: 0.94 }); for (let i = 0; i < 120; i++) trail.setColor(i, i % 3 ? '#f4f6f9' : '#dde2ea'); scene.add(trail);
const _v = new THREE.Vector3();
function drawFlame(emitters, power, t, len = 1.6) {
  const per = Math.floor(60 / emitters.length);
  for (let i = 0; i < 60; i++) { const e = emitters[Math.min(Math.floor(i / per), emitters.length - 1)]; const ph = (t * 4.2 + rand(i, 7)) % 1; const a = rand(i, 8) * 6.28, sp = rand(i, 9) * 0.22 * (0.4 + ph);
    flame.setAt(i, e.x + Math.cos(a) * sp, e.y - ph * len * (0.7 + 0.3 * power), e.z + Math.sin(a) * sp, t * 3 + i, t * 2, power > 0.02 ? (1 - ph) * (0.6 + 0.6 * power) : 0); }
  flame.done();
}
function drawSmoke(p, amount, t, spread = 4.5) {
  for (let i = 0; i < 90; i++) { const ph = (t * 0.9 + rand(i, 11)) % 1; const a = rand(i, 12) * 6.28; const r = 0.5 + ph * spread * (0.6 + rand(i, 13) * 0.6);
    smoke.setAt(i, p.x + Math.cos(a) * r, p.y + 0.2 + ph * 1.3 * (spread / 4.5) + rand(i, 14) * 0.4, p.z + Math.sin(a) * r, t + i, t * 0.5, amount > 0.02 ? amount * (0.5 + ph * 1.3) * (1 - ph * ph) : 0); }
  smoke.done();
}
function drawPlume(base, power, t, len, w = 1) {
  for (let i = 0; i < 110; i++) { const ph = (t * 5.5 + rand(i, 21)) % 1; const core = i % 4 < 2; const a = rand(i, 22) * 6.28; const r = (core ? 0.12 : 0.3) * w + ph * (core ? 0.35 : 1.1) * w * rand(i, 23);
    plume.setAt(i, base.x + Math.cos(a) * r, base.y - ph * len * (core ? 0.7 : 1), base.z + Math.sin(a) * r, t * 3 + i, t * 2, power > 0.02 ? power * w * (1.25 - ph) * (core ? 1.1 : 1.3) : 0); }
  plume.done();
}

// ================= LAUNCH SITE: a busy coastal pad on a floating island =================
{
  const v = new Vox(); v.jitter = 0.05; const RX = 26, RZ = 19;
  const inside = (x, z) => { const a = Math.atan2(z / RZ, x / RX); const w = 1 + (noise2(Math.cos(a) * 2.5 + 4, Math.sin(a) * 2.5 + 4, 7) - 0.5) * 0.2; return Math.hypot(x / RX, z / RZ) < w; };
  const GR = ['#7ccf55', '#6cc04b', '#86d65d', '#5fb446'], STR = ['#9a6a42', '#8a5c38', '#a7774c', '#7b8085', '#8b8f93'];
  const T = new Map();
  for (let x = -RX - 4; x <= RX + 4; x++) for (let z = -RZ - 4; z <= RZ + 4; z++) {
    if (!inside(x, z)) continue;
    const r = Math.hypot(x / RX, z / RZ); const apron = Math.abs(x) <= 8 && Math.abs(z) <= 7; const pr = Math.hypot(x, z);
    const road = (z >= 8 && z <= 9 && x >= -4 && x <= 18) || (x >= 14 && x <= 15 && z >= -8 && z <= 9);
    const trench = x >= 8 && x <= 16 && Math.abs(z) <= 1;
    const beach = r > 0.9;
    let h = 1; if (!apron && !road && !beach && !trench && noise2(x / 6, z / 6, 3) > 0.62) h = 2;
    if (beach) h = 0;
    const under = Math.round(11 * (1 - r * r * 0.8) + noise2(x / 3, z / 3, 4) * 3);
    for (let y = h - under; y <= h; y++) { let c; if (y === h) { c = beach ? (rand(x, 1, z) > .5 ? '#f2d89a' : '#ecd08c') : GR[Math.floor(rand(x, 2, z) * 4)]; if (apron) c = (x + z) & 1 ? '#c9cdd3' : '#bec3ca'; if (road) c = (x + z) & 1 ? '#5b6168' : '#545a61'; if (trench) c = '#3a3f4a'; } else c = y >= h - 2 ? STR[Math.floor(rand(x, y, z) * 3)] : STR[3 + Math.floor(rand(x, y, z) * 2)]; v.set(x, y, z, c); }
    if (road && z === 8 && x % 3 === 0) v.set(x, 1, z, '#f2f2ea');
    if (pr < 4.6) { const ring = pr > 3.4 && pr < 4.2; const cross = (x === 0 && Math.abs(z) <= 2) || (z === 0 && Math.abs(x) <= 2); v.set(x, 1, z, ring || cross ? '#ffd23f' : ((x + z) & 1 ? '#9aa0a8' : '#8f959e')); }
    if (apron && (Math.abs(x) === 8 || Math.abs(z) === 7) && (x + z) % 2 === 0 && !road) v.set(x, 1, z, '#ffd23f');
    T.set(K(x, z), h);
  }
  const top = (x, z) => T.get(K(x, z)) ?? 1;
  // flame deflector at the trench mouth
  v.box(5, 2, -2, 6, 3, 2, '#7b8085'); v.box(5, 4, -2, 5, 4, 2, '#5b6168');
  // launch tower: red and white lattice, two service arms
  for (let y = 2; y <= 17; y++) for (const [x, z] of [[-7, -2], [-4, -2], [-7, 1], [-4, 1]]) v.set(x, y, z, Math.floor((y - 2) / 2) % 2 ? '#f4f1ea' : '#e8573f');
  for (let y = 4; y <= 17; y += 3) { v.box(-7, y, -2, -4, y, -2, '#c9ced3'); v.box(-7, y, 1, -4, y, 1, '#c9ced3'); v.box(-7, y, -2, -7, y, 1, '#c9ced3'); v.box(-4, y, -2, -4, y, 1, '#c9ced3'); }
  v.box(-3, 10, -1, -2, 10, 0, '#9aa0a6'); v.box(-3, 14, -1, -2, 14, 0, '#9aa0a6'); v.box(-7, 18, -2, -4, 18, 1, '#5b4ce0'); v.set(-6, 19, -1, '#ffd23f');
  // lightning masts
  for (const [x, z] of [[-10, -9], [9, -9], [-10, 8], [10, 6]]) { v.box(x, 2, z, x, 21, z, '#c9ced3'); v.set(x, 22, z, '#e8573f'); }
  // fuel spheres
  for (const [cx, cz] of [[6, -13], [11, -12]]) { for (let x = -2; x <= 2; x++) for (let y = -2; y <= 2; y++) for (let z = -2; z <= 2; z++) if (Math.hypot(x, y, z) < 2.6) v.set(cx + x, 5 + y, cz + z, y === 2 ? '#e2e6ea' : '#f6f7f9'); v.box(cx - 1, 2, cz - 1, cx - 1, 3, cz - 1, '#9aa0a6'); v.box(cx + 1, 2, cz + 1, cx + 1, 3, cz + 1, '#9aa0a6'); }
  v.box(5, 2, -10, 12, 2, -10, '#9aa0a6');
  // assembly hangar with the club stripe
  v.box(-20, 2, -15, -9, 9, -8, '#f1ede4'); v.box(-20, 10, -15, -9, 10, -8, '#d9d3c6'); v.box(-19, 11, -14, -10, 11, -9, '#e4ded2'); v.box(-20, 7, -8, -9, 7, -8, '#5b4ce0'); v.box(-17, 2, -8, -12, 6, -8, '#3a4a6a'); v.box(-16, 2, -8, -16, 6, -8, '#2f3c58'); v.box(-13, 2, -8, -13, 6, -8, '#2f3c58');
  for (let x = -19; x <= -10; x += 3) v.box(x, 9, -8, x + 1, 9, -8, '#8fd8ff');
  // control bunker and water tower
  v.box(13, 2, -6, 18, 4, -2, '#e8e4da'); v.box(13, 5, -6, 18, 5, -2, '#c9c2b4'); v.box(14, 3, -2, 17, 3, -2, '#8fd8ff'); v.box(17, 6, -5, 17, 8, -5, '#9aa0a6'); v.box(16, 9, -6, 18, 9, -4, '#c9ced3');
  for (const [x, z] of [[-15, 5], [-13, 5], [-15, 7], [-13, 7]]) v.box(x, 2, z, x, 8, z, '#9aa0a6');
  v.box(-16, 9, 4, -12, 12, 8, '#ff8a2a'); v.box(-15, 13, 5, -13, 13, 7, '#e8573f');
  // trees, bushes, flowers
