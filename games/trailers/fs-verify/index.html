<!doctype html><html><head><meta charset="utf-8"><title>Verification Desk trailer</title>
<link rel="stylesheet" href="../engine/ui.css">
<style>
:root { --ink:#13202b; --teal:#16c79a; --tealD:#0c9a74; --red:#e5484d; --mut:#5b6b78; --line:#e4e9ee; --soft:#f4f7f9; }
#ui, #ui * { font-family: 'Inter', sans-serif; }
.wcard { background:#fff; border-radius:28px; color:var(--ink); box-shadow:0 22px 60px rgba(8,28,44,.25), 0 2px 0 rgba(0,0,0,.04); }
/* top bar */
.labchip { display:flex; align-items:center; gap:18px; background:#fff; border-radius:999px; padding:14px 30px 14px 16px; box-shadow:0 12px 30px rgba(8,28,44,.18); color:var(--ink); white-space:nowrap; }
.labchip .ic { width:52px; height:52px; border-radius:50%; background:var(--teal); display:grid; place-items:center; }
.labchip .ic svg { width:30px; height:30px; }
.labchip b { font:800 32px 'Inter'; letter-spacing:-.01em; }
.labchip span.r { font:600 24px 'Inter'; color:var(--mut); }
.labchip span.bar { width:2px; height:34px; background:var(--line); }
.status { display:flex; gap:8px; background:#fff; border-radius:999px; padding:10px; box-shadow:0 12px 30px rgba(8,28,44,.18); }
.status span { font:700 23px 'Inter'; color:#8a98a4; padding:12px 22px; border-radius:999px; white-space:nowrap; }
.status span.on { background:var(--ink); color:#fff; }
.status span.on.ret { background:var(--red); }
.status span.on.ok { background:var(--teal); color:#062a20; }
/* brief */
.brief { width:1560px; padding:30px 40px 34px; }
.brief .bh { display:flex; align-items:center; gap:18px; font:700 26px 'Inter'; color:var(--mut); }
.tag { font:800 20px 'Inter'; letter-spacing:.14em; background:var(--ink); color:#fff; border-radius:10px; padding:8px 14px; }
.brief .bg { display:grid; grid-template-columns: 1fr 1.45fr .7fr; gap:30px; margin-top:22px; }
.brief .bg div { border-left:5px solid var(--teal); padding-left:20px; }
.brief small { display:block; font:700 21px 'Inter'; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); }
.brief b { display:block; font:800 36px/1.18 'Inter'; margin-top:8px; }
/* name tags in 3D */
.ntag { background:#fff; border-radius:16px; padding:10px 18px 11px; box-shadow:0 10px 24px rgba(8,28,44,.25); white-space:nowrap; text-align:center; }
.ntag b { display:block; font:800 26px 'Inter'; color:var(--ink); }
.ntag small { display:block; font:600 19px 'Inter'; color:var(--mut); margin-top:2px; }
.ntag.m { border:4px solid #f6b53c; }
.ntag::after { content:''; position:absolute; left:50%; bottom:-12px; margin-left:-12px; border:12px solid transparent; border-top-color:#fff; border-bottom:0; }
.say { background:var(--ink); color:#fff; border-radius:20px; padding:16px 24px; font:700 28px 'Inter'; white-space:nowrap; box-shadow:0 12px 26px rgba(8,28,44,.3); }
/* document */
.doc { width:1110px; height:800px; overflow:hidden; display:grid; grid-template-rows:84px 82px 1fr 92px; }
.doc .tb { display:flex; align-items:center; gap:16px; padding:0 30px; border-bottom:2px solid var(--line); font:600 23px 'Inter'; color:var(--mut); }
.doc .tb .fi { width:34px; height:40px; border-radius:6px; background:#3d7be0; position:relative; }
.doc .tb .fi::after { content:''; position:absolute; left:8px; right:8px; top:12px; height:3px; background:#fff; box-shadow:0 7px 0 #fff, 0 14px 0 #fff; }
.doc .tb b { color:var(--ink); font-weight:800; }
.doc .tb .who { margin-left:auto; font:700 21px 'Inter'; background:#eef2f5; border-radius:999px; padding:8px 16px; color:var(--mut); }
.doc .rv { display:flex; align-items:center; gap:12px; padding:0 30px; border-bottom:2px solid var(--line); background:#fbfcfd; }
.doc .rv .lab { font:800 20px 'Inter'; letter-spacing:.12em; color:var(--mut); margin-right:6px; }
.btn { font:800 24px 'Inter'; background:var(--ink); color:#fff; border-radius:999px; padding:12px 26px; white-space:nowrap; }
.btn.t { background:var(--teal); color:#062a20; }
.chk { display:flex; align-items:center; gap:10px; font:800 24px 'Inter'; padding:9px 20px 9px 10px; border-radius:999px; background:#eef2f5; color:#7d8b97; border:3px solid transparent; white-space:nowrap; }
.chk i { width:32px; height:32px; border-radius:50%; background:#d5dde3; display:grid; place-items:center; }
.chk i svg { width:20px; height:20px; }
.chk.run { border-color:var(--teal); color:var(--ink); background:#fff; }
.chk.ok { background:#dcf6ec; color:#08694f; } .chk.ok i { background:var(--teal); }
.chk.bad { background:#fde3e3; color:#b4232a; border-color:var(--red); } .chk.bad i { background:var(--red); }
.doc .bd { display:grid; grid-template-columns: 1fr 330px; min-height:0; }
.doc .mn { padding:30px 40px 0; overflow:hidden; }
.doc h3 { font:800 44px/1.14 'Inter'; letter-spacing:-.015em; margin:0; }
.doc .by { font:600 22px 'Inter'; color:var(--mut); margin:12px 0 18px; }
.doc p.tx { font:500 29px/1.48 'Inter'; margin:0; }
.doc .src { margin-top:14px; border-top:2px solid var(--line); padding-top:10px; }
.doc .src small { font:800 19px 'Inter'; letter-spacing:.14em; color:var(--mut); }
.doc .src p { font:500 25px/1.38 'Inter'; margin:6px 0 0; }
.del { color:#b4232a; text-decoration:line-through; text-decoration-thickness:3px; background:#fde3e3; border-radius:4px; }
.ins { color:#08694f; background:#d6f5e9; border-radius:4px; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:5px; }
.flag { background:#fde3e3; box-shadow:0 0 0 3px var(--red); border-radius:6px; }
.caret { display:inline-block; width:3px; height:1.05em; background:var(--ink); vertical-align:-3px; margin-left:2px; }
.doc .rail { background:var(--soft); border-left:2px solid var(--line); padding:26px 22px; display:flex; flex-direction:column; gap:18px; }
.doc .rail .hd { font:800 19px 'Inter'; letter-spacing:.14em; color:var(--mut); }
.cmt { background:#fff; border-radius:20px; padding:18px 20px; box-shadow:0 6px 16px rgba(8,28,44,.1); border-left:7px solid var(--red); }
.cmt.g { border-left-color:var(--teal); }
.cmt b { display:block; font:800 22px 'Inter'; }
.cmt p { font:500 22px/1.35 'Inter'; margin:6px 0 0; color:#33414d; }
.doc .ft { display:flex; align-items:center; gap:18px; padding:0 30px; border-top:2px solid var(--line); background:#fbfcfd; font:700 26px 'Inter'; color:#8a98a4; }
.doc .ft .tick { width:50px; height:50px; border-radius:50%; background:var(--teal); display:grid; place-items:center; }
.doc .ft .tick svg { width:30px; height:30px; }
.doc .ft .sg { color:var(--ink); }
.doc .ft .sg em { font-style:normal; color:var(--mut); font-weight:600; font-size:22px; margin-left:10px; }
.doc .ft .pass { margin-left:auto; font:800 23px 'Inter'; background:#eef2f5; border-radius:999px; padding:10px 20px; color:var(--mut); }
.doc .ft .pass.ok { background:#dcf6ec; color:#08694f; }
/* AI colleague */
.ai { width:682px; background:#13202b; color:#fff; border-radius:28px; padding:30px 34px 32px; box-shadow:0 22px 60px rgba(8,28,44,.35); }
.ai .hd { display:flex; align-items:center; gap:16px; }
.ai .hd .ic { width:54px; height:54px; border-radius:16px; background:#2b3a48; display:grid; place-items:center; }
.ai .hd .ic svg { width:32px; height:32px; }
.ai .hd b { font:800 28px 'Inter'; }
.ai .hd .dr { font:800 18px 'Inter'; letter-spacing:.12em; background:#f6c343; color:#13202b; border-radius:8px; padding:5px 10px; }
.ai .hd .nm { margin-left:auto; font:600 21px 'Inter'; color:#9fb0c0; }
.ai p { font:600 31px/1.32 'Inter'; margin:22px 0 0; }
.ai .sure { display:flex; align-items:center; gap:18px; margin-top:22px; }
.ai .sure b { font:800 40px 'Inter'; color:#fff; white-space:nowrap; }
.ai .sure .bar { flex:1; height:16px; border-radius:99px; background:#2c3a48; overflow:hidden; }
.ai .sure .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#f6c343,#16c79a); }
.ai .chips { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
.ai .chips span { font:700 22px 'Inter'; background:#24323f; color:#d6e1ea; border:2px solid #3a4b5b; border-radius:999px; padding:9px 18px; white-space:nowrap; }
.ai .chips span em { font-style:normal; color:#8ea2b4; margin-right:8px; }
/* browser */
.brw { width:682px; height:440px; overflow:hidden; display:grid; grid-template-rows:62px 58px 1fr 78px; }
.brw .tabs { display:flex; align-items:flex-end; gap:6px; background:#e3e9ee; padding:0 12px; border-radius:28px 28px 0 0; }
.brw .tab { font:700 20px 'Inter'; color:var(--mut); background:#d3dbe2; border-radius:14px 14px 0 0; padding:12px 16px; white-space:nowrap; display:none; }
.brw .tab.on { background:#fff; color:var(--ink); }
.brw .plus { font:800 30px/1 'Inter'; color:var(--ink); width:44px; height:44px; border-radius:50%; display:grid; place-items:center; margin:0 0 8px 6px; }
.brw .plus.hit { background:#c4ced6; }
.brw .url { margin:10px 18px 4px; background:var(--soft); border-radius:999px; padding:0 22px; display:flex; align-items:center; font:600 21px 'Inter'; color:#33414d; white-space:nowrap; overflow:hidden; }
.brw .pg { padding:12px 28px 0; position:relative; }
.brw .pg > div { position:absolute; left:28px; right:28px; top:12px; display:none; }
.brw .pg h4 { font:800 30px/1.2 'Inter'; margin:0; display:flex; align-items:center; gap:14px; }
.brw .pg h4 i { flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--red); }
.brw .pg h4 i.g { background:var(--teal); }
.brw .pg h4 i svg { width:26px; height:26px; }
.brw .pg p { font:500 24px/1.4 'Inter'; color:#33414d; margin:10px 0 0; }
.brw .pg .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 18px; margin-top:12px; font:600 23px 'Inter'; }
.brw .pg .kv span:nth-child(odd) { color:var(--mut); } .brw .pg .kv span:nth-child(even) { color:#b4232a; font-weight:800; }
.brw .pg .kv.g span:nth-child(even) { color:#08694f; }
.brw .trail { display:flex; align-items:center; gap:4px; padding:0 14px; border-top:2px solid var(--line); background:#fbfcfd; }
.brw .trail .lb { font:800 15px 'Inter'; letter-spacing:.08em; color:var(--mut); margin-right:4px; }
.brw .trail span.s { font:800 17px 'Inter'; border-radius:999px; padding:6px 9px; white-space:nowrap; opacity:0; }
.brw .trail span.s.x { background:#fde3e3; color:#b4232a; } .brw .trail span.s.o { background:#dcf6ec; color:#08694f; } .brw .trail span.s.n { background:#eef2f5; color:var(--ink); }
.brw .trail span.ar { color:#9aa8b4; font:800 18px 'Inter'; opacity:0; }
/* step strip */
.steps { display:flex; align-items:center; gap:16px; background:rgba(19,32,43,.88); color:#fff; border-radius:999px; padding:12px 30px 12px 14px; white-space:nowrap; }
.steps .n { font:800 22px 'Inter'; background:var(--teal); color:#062a20; border-radius:999px; padding:7px 16px; }
.steps .d { font:700 27px 'Inter'; }
/* portfolio */
.folder { width:620px; }
.folder .tabf { display:inline-block; background:var(--teal); color:#062a20; font:800 24px 'Inter'; letter-spacing:.06em; border-radius:20px 20px 0 0; padding:12px 30px 10px; margin-left:26px; }
.folder .body { background:#fff; border-radius:28px; border-top:10px solid var(--teal); padding:22px 26px; box-shadow:0 22px 60px rgba(8,28,44,.28); }
.folder .it { display:flex; align-items:center; gap:16px; padding:14px 8px; border-bottom:2px solid var(--line); font:700 25px 'Inter'; color:var(--ink); }
.folder .it:last-child { border-bottom:0; }
.folder .it i { flex:none; width:44px; height:52px; border-radius:8px; background:#e8eef2; }
.folder .it small { display:block; font:600 20px 'Inter'; color:var(--mut); margin-top:3px; }
.folder .it.nw { background:#ecfaf4; border-radius:16px; border-bottom:0; }
.folder .it.nw i { background:var(--teal); }
.folder .it .new { margin-left:auto; font:800 18px 'Inter'; letter-spacing:.1em; background:var(--ink); color:#fff; border-radius:8px; padding:6px 10px; }
/* end */
.endt { text-align:center; color:#fff; width:1920px; }
.endt .chip2 { display:inline-flex; align-items:center; gap:12px; background:#fff; color:var(--ink); border-radius:999px; padding:12px 26px; font:800 24px 'Inter'; letter-spacing:.08em; }
.endt .chip2::before { content:''; width:14px; height:14px; border-radius:50%; background:var(--teal); }
.endt h1 { font:800 132px/1 'Inter'; letter-spacing:-.04em; margin:30px 0 0; text-shadow:0 8px 40px rgba(0,20,40,.35); }
.endt h2 { font:700 44px 'Inter'; margin:22px 0 0; text-shadow:0 4px 20px rgba(0,20,40,.4); }
.path { width:1640px; padding:30px 40px 34px; }
.path .ph { display:flex; align-items:center; gap:16px; font:800 24px 'Inter'; letter-spacing:.12em; color:var(--mut); }
.path .pg2 { display:grid; grid-template-columns: 1fr 1fr 1.25fr 64px 1.3fr; gap:24px; margin-top:20px; align-items:stretch; }
.path .pg2 > div { background:var(--soft); border-radius:22px; padding:20px 24px; }
.path .pg2 > div.arr { background:none; padding:0; display:grid; place-items:center; font:800 54px 'Inter'; color:var(--teal); }
.path small { display:block; font:800 20px 'Inter'; letter-spacing:.12em; text-transform:uppercase; color:var(--tealD); }
.path b { display:block; font:800 31px/1.2 'Inter'; margin-top:8px; }
.path em { display:block; font-style:normal; font:600 21px 'Inter'; color:var(--mut); margin-top:6px; }
.cur { width:46px; height:56px; }
.ring { width:70px; height:70px; border-radius:50%; border:5px solid var(--teal); }
</style>

<body><div id="app"><div id="bg"></div><div id="ui"></div><div id="fx"></div></div>
<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, tree, house, person, island, rand, noise2 } from '../engine/kit.js';
import { el, cue, fader, toScreen } from '../engine/ui.js';
import { clouds, birds } from '../engine/extras.js';

const DUR = 42;
const st = createStage({ post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.55; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #4fb0ff 0%, #8fd0ff 52%, #dff2ff 100%)';
sun.intensity = 2.8; sun.position.set(-60, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;

await document.fonts.load('800 40px Inter'); await document.fonts.load('600 40px Inter');

// ---------- helpers ----------
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
function plane(w, h, map, at, ry = 0) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map, toneMapped: false })); m.position.set(...at); m.rotation.y = ry; scene.add(m); return m; }
const rr = (g, x, y, w, h, r, c) => { g.fillStyle = c; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
const screenTex = (kind) => tex(256, 150, (g, w, h) => {
  g.fillStyle = '#f7fafc'; g.fillRect(0, 0, w, h); rr(g, 0, 0, w, 20, 0, '#13202b'); g.fillStyle = '#16c79a'; g.fillRect(8, 7, 26, 6);
  if (kind === 'doc') { g.fillStyle = '#13202b'; g.fillRect(18, 34, 150, 12); g.fillStyle = '#b8c4ce'; for (let i = 0; i < 6; i++) g.fillRect(18, 58 + i * 13, i === 5 ? 90 : 160, 6); rr(g, 190, 34, 50, 100, 6, '#e4edf2'); g.fillStyle = '#e5484d'; g.fillRect(18, 58 + 2 * 13, 70, 6); }
  else if (kind === 'chart') { for (let i = 0; i < 7; i++) rr(g, 22 + i * 32, 130 - (25 + ((i * 37) % 70)), 20, 25 + ((i * 37) % 70), 3, i === 4 ? '#16c79a' : '#9fb3c4'); }
  else { for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) rr(g, 14 + c * 60, 30 + r * 19, 54, 14, 2, r === 0 ? '#c9d6df' : (r + c) % 3 ? '#e9eff3' : '#d6f5e9'); }
});

// ---------- island + newsroom ----------
const v = new Vox(); v.jitter = 0.05;
const isl = island(v, { rx: 40, rz: 30, top: 0, depth: 15, seed: 7, wobble: 4 });
const OX0 = -17, OX1 = 17, OZ0 = -13, OZ1 = 9;
for (let x = OX0; x <= OX1; x++) for (let z = OZ0; z <= OZ1; z++) v.set(x, 0, z, (x === OX0 || x === OX1 || z === OZ1) ? '#b9a07a' : ((Math.floor(x / 2) + Math.floor(z / 2)) % 2 ? '#d6dee4' : '#cdd6dd'));
// back wall (z = OZ0) with window bays; left wall (x = OX0)
for (let x = OX0; x <= OX1; x++) for (let y = 1; y <= 10; y++) { const win = y >= 3 && y <= 7 && x > OX0 + 1 && x < OX1 - 1 && ((x - OX0) % 6) !== 0; if (!win) v.set(x, y, OZ0, y === 1 ? '#b9b3a8' : y === 10 ? '#dcd6cb' : '#f3f0ea'); }
for (let z = OZ0; z <= OZ1; z++) for (let y = 1; y <= 10; y++) { const win = y >= 3 && y <= 7 && z > OZ0 + 1 && z < OZ1 - 1 && ((z - OZ0) % 6) !== 0; if (!win) v.set(OX0, y, z, y === 1 ? '#b9b3a8' : y === 10 ? '#dcd6cb' : '#f3f0ea'); }
// road and town behind
for (let x = -30; x <= 30; x++) for (let z = -18; z <= -15; z++) if (isl.top(x, z) != null) v.set(x, 0, z, z === -16 && x % 4 === 0 ? '#f2f2ea' : '#5b6168');
const roofs = ['#d0573a', '#5a6d80', '#e0a23a', '#3f8f7a'];
[[-24, -26], [-14, -27], [-3, -26], [8, -27], [18, -26]].forEach(([x, z], i) => { if (isl.top(x, z) != null && isl.top(x + 7, z + 5) != null) house(v, x, 0, z + 2, { w: 7, d: 5, h: 4 + (i % 2), roof: roofs[i % 4], wall: i % 2 ? '#efe2c9' : '#f1ebe0' }); });
for (const [x, z] of [[24, -10], [29, -2], [26, 8], [-26, 4], [-28, -6], [-22, 16], [20, 18], [30, 12], [-12, 20], [12, 22], [-33, -1], [34, 2]]) if (isl.top(x, z) != null) tree(v, x, 0, z, { kind: rand(x, z) > .5 ? 'round' : 'pine', s: 2 });
// front path
for (let z = OZ1 + 1; z <= 28; z++) for (let x = -2; x <= 2; x++) if (isl.top(x, z) != null) v.set(x, 0, z, '#d9c9a0');
// flower beds
for (let x = -14; x <= -5; x++) for (let z = 12; z <= 14; z++) v.set(x, 1, z, rand(x, z, 3) > .5 ? (rand(x, z, 4) > .5 ? '#ff7eb6' : '#ffd23f') : '#4caf50');
for (let x = 6; x <= 14; x++) for (let z = 12; z <= 14; z++) v.set(x, 1, z, rand(x, z, 5) > .5 ? (rand(x, z, 6) > .5 ? '#b28cff' : '#ff9a4a') : '#4caf50');
scene.add(v.mesh());

// half-size furniture voxels
const f = new Vox(); f.jitter = 0.03;
const fb = (x0, y0, z0, x1, y1, z1, c) => { for (let i = Math.round(x0 * 2); i < Math.round(x1 * 2); i++) for (let j = Math.round(y0 * 2); j < Math.round(y1 * 2); j++) for (let k = Math.round(z0 * 2); k < Math.round(z1 * 2); k++) f.set(i, j, k, c); };
const FL = 1; // floor surface
const seats = [];
const kinds = ['doc', 'chart', 'sheet'];
function desk(cx, cz, n = 2) {
  fb(cx - 3, FL + 1.25, cz - 1.25, cx + 3, FL + 1.5, cz + 1.25, '#f6f3ec');
  for (const [a, b] of [[-3, -1.25], [2.5, -1.25], [-3, 0.75], [2.5, 0.75]]) fb(cx + a, FL, cz + b, cx + a + 0.5, FL + 1.25, cz + b + 0.5, '#9aa6b0');
  fb(cx - 2.5, FL + 0.5, cz - 1.25, cx + 2.5, FL + 1.25, cz - 0.75, '#cfd8de');
  for (const sx of [cx - 1.5, cx + 1.5]) {
    fb(sx - 0.25, FL + 1.5, cz - 0.75, sx + 0.25, FL + 2, cz - 0.25, '#3a4752');
    fb(sx - 1, FL + 2, cz - 1, sx + 1, FL + 3.25, cz - 0.5, '#22303c');
    plane(1.8, 1.05, screenTex(kinds[Math.floor(rand(sx * 3, cz) * 3)]), [sx, FL + 2.625, cz - 0.49]);
    fb(sx - 0.5, FL + 0.5, cz + 1.75, sx + 0.5, FL + 1, cz + 2.75, '#3c6ea8');
    fb(sx - 0.5, FL + 1, cz + 2.75, sx + 0.5, FL + 2.5, cz + 3.25, '#3c6ea8');
    fb(sx - 0.25, FL, cz + 2, sx + 0.25, FL + 0.5, cz + 2.5, '#2b333a');
    seats.push([sx, cz + 2.25]);
  }
}
