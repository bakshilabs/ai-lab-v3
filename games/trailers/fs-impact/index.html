<!doctype html><html><head><meta charset="utf-8"><title>Impact Panel trailer</title>
<link rel="stylesheet" href="../engine/ui.css"><link rel="stylesheet" href="fs.css">
<style>
.ip-form { width: 874px; padding: 24px 32px 18px; }
.ip-form .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 12px; border-bottom: 3px solid var(--fs-line); }
.ip-form h3 { font: 800 36px/1.1 'Inter'; margin-top: 4px; }
.ip-sec { padding: 12px 0 4px; }
.ip-stk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.ip-s { display: flex; align-items: center; gap: 10px; background: #f4f7f9; border-radius: 16px; padding: 8px 12px; font: 700 22px/1.12 'Inter'; min-height: 60px; }
.ip-s i { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 7px; }
.ip-s i svg { width: 100%; height: 100%; }
.ip-s.new { background: var(--fs-mint); box-shadow: 0 0 0 4px var(--fs-teal) inset; }

.ip-r .k { font: 800 19px/1.9 'Inter'; letter-spacing: .12em; text-transform: uppercase; color: var(--fs-muted); }
.ip-r .muted { color: #a3afb8; }
.ip-en { display: flex; align-items: center; gap: 16px; }

.ip-en .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #16c79a, #f5a524); }

<script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/three-addons/"}}</script></head>
<body><div id="app"><div id="bg"></div><div id="ui"></div><div id="fx"></div></div>
<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, island, tree, house, person, particles, rand, noise2 } from '../engine/kit.js';
import { el, cue, fader, titleCard } from '../engine/ui.js';
import { Furn, table, chair, seated, standing, plant, screenPlane, monitor, laptop, draw, ICO, ui, briefHTML, briefChipHTML, aiHTML, findHTML, signHTML, folderHTML, pathHTML, endTitleHTML, aiSet, findFix, checkStrip, pin, place, showIO, fadeIO, typed, setHTML } from './fs.js';

const DUR = 38.0;
const st = createStage({ sky: ['#5db6ff', '#d9efff'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.5; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #4fb0ff 0%, #8fd0ff 55%, #dff2ff 100%)';
sun.intensity = 2.8; sun.position.set(-50, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;

// ---------- island + town ----------
const v = new Vox(); v.jitter = 0.06;
const isl = island(v, { rx: 37, rz: 27, top: 0, depth: 14, seed: 5, wobble: 3 });
const F = 1; // ground / floor top
// office floor and walls (cutaway: no roof, no front wall)
const OX0 = -19, OX1 = 6, OZ0 = -9, OZ1 = 8;
for (let x = OX0; x <= OX1; x++) for (let z = OZ0; z <= OZ1; z++) v.set(x, 0, z, (x + z) % 2 ? '#e2c79d' : '#d8bb8e');
const WALL = '#f4f1ea', TRIM = '#16c79a', GLASS = null;
for (let x = OX0; x <= OX1; x++) for (let y = 1; y <= 7; y++) {
  const win = y >= 2 && y <= 5 && ((x - OX0) % 5 !== 0) && x > OX0 && x < OX1;
  v.set(x, y, OZ0, win ? GLASS : (y === 7 ? TRIM : WALL));
}
for (let z = OZ0; z <= OZ1; z++) for (let y = 1; y <= 7; y++) {
  const win = y >= 2 && y <= 5 && ((z - OZ0) % 5 !== 0) && z > OZ0 && z < OZ1 - 1;
  v.set(OX0, y, z, win ? GLASS : (y === 7 ? TRIM : WALL));
}
// low half wall on the right with an entrance gap
for (let z = OZ0; z <= OZ1; z++) if (z < -1 || z > 2) for (let y = 1; y <= 2; y++) v.set(OX1, y, z, y === 2 ? TRIM : WALL);
// street behind
for (let x = -34; x <= 34; x++) for (let z = -14; z <= -11; z++) if (isl.top(x, z) != null) v.set(x, 0, z, z === -12 && x % 4 === 0 ? '#f2f2ea' : '#5b6168');
// houses behind the street
const HC = [['#d0573a', '#f1ebe0'], ['#5a6d80', '#efe2c9'], ['#3f8f7a', '#f4efe6'], ['#d0573a', '#efe2c9'], ['#6e5bf2', '#f1ebe0']];
[[-30, -21, 7, 5, 4], [-21, -22, 6, 6, 5], [-12, -23, 8, 6, 6], [-1, -22, 6, 5, 4], [8, -21, 7, 5, 5]].forEach(([x, z, w, d, h], i) => house(v, x, 0, z, { w, d, h, roof: HC[i][0], wall: HC[i][1] }));
// council tower (civic building) left
for (let x = -32; x <= -26; x++) for (let z = -8; z <= -2; z++) for (let y = 1; y <= 12; y++) { const e = x === -32 || x === -26 || z === -8 || z === -2; if (!e) continue; v.set(x, y, z, y % 3 === 0 && (x + z) % 2 ? '#2c4a63' : '#e9e2d3'); }
for (let x = -33; x <= -25; x++) for (let z = -9; z <= -1; z++) v.set(x, 13, z, '#5a6d80');
v.box(-30, 14, -6, -28, 16, -4, '#e9e2d3'); v.set(-29, 15, -3, '#ffd23f');
// park on the right: paths, pond, trees, skate ramp, camera poles
for (let x = 9; x <= 34; x++) for (let z = -9; z <= 22; z++) { if (isl.top(x, z) == null) continue; if (Math.abs(z - 4 - Math.sin(x / 4) * 2) < 1.1 || Math.abs(x - 19) < 1 && z > -9) v.set(x, 0, z, '#d9c9a0'); }
for (let x = 23; x <= 31; x++) for (let z = 9; z <= 15; z++) if (Math.hypot((x - 27) / 4.2, (z - 12) / 3.2) < 1) v.set(x, 0, z, '#4fb6e8');
for (const [x, z] of [[12, -5], [27, -4], [31, 3], [13, 13], [21, 18], [9, 20], [-22, 16], [-28, 8], [-31, 12], [26, 19]]) if (isl.top(x, z) != null) tree(v, x, 0, z, { kind: 'round' });
for (const [x, z] of [[33, -6], [-34, 2], [-25, -16], [16, -17]]) if (isl.top(x, z) != null) tree(v, x, 0, z, { kind: 'pine' });
// skate ramp
for (let x = 22; x <= 30; x++) for (let z = -5; z <= -1; z++) { const k = Math.abs(x - 26); const hh = k >= 3 ? Math.min(3, k - 1) : 0; for (let y = 1; y <= hh; y++) v.set(x, y, z, '#b8c0c8'); if (hh === 0) v.set(x, 0, z, '#9aa3ab'); }
// camera poles
const POLES = [[14, 1], [24, 7], [18, 15], [29, -7]];
for (const [x, z] of POLES) { for (let y = 1; y <= 7; y++) v.set(x, y, z, '#59636b'); v.set(x, 8, z, '#26323c'); v.set(x - 1, 8, z, '#26323c'); }
// benches
for (const [x, z] of [[16, 8], [21, 1]]) { v.box(x, 1, z, x + 2, 1, z, '#9a6a3e'); }
scene.add(v.mesh());

// ---------- furniture (fine voxels) ----------
const f = new Furn();
table(f, F, -12, -2, -1, 2, { top: '#e9dcc4', leg: '#6b5a48' });
const FAR = -2.9;
const seatsFar = [-10.3, -7.8, -5.3, -2.8];
seatsFar.forEach((x) => chair(f, F, x, FAR, 's', { c: '#2f4858' }));
chair(f, F, -13, 0, 'e', { c: '#2f4858' }); chair(f, F, 0, 0, 'w', { c: '#2f4858' });
const lapDraw = [draw.doc(), draw.sheet(), draw.doc('#f5a524'), draw.chart()];
seatsFar.forEach((x, i) => laptop(f, scene, F, x, -1.2, 'n', lapDraw[i]));
laptop(f, scene, F, -11.4, 0, 'w', draw.sheet()); laptop(f, scene, F, -1.6, 0, 'e', draw.doc());
// wall screen with park map
const map = (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.fillStyle = '#13202b'; g.fillRect(0, 0, w, h * 0.16);
  g.fillStyle = '#ffffff'; g.font = `800 ${h * 0.09}px Inter, sans-serif`; g.fillText('HARBOUR PARK · AI CAMERAS', w * 0.04, h * 0.11);
  g.fillStyle = '#bfe6a8'; g.fillRect(w * 0.04, h * 0.22, w * 0.92, h * 0.72);
  g.fillStyle = '#7fc8f0'; g.beginPath(); g.ellipse(w * 0.72, h * 0.66, w * 0.12, h * 0.12, 0, 0, 7); g.fill();
  g.strokeStyle = '#e9dcb4'; g.lineWidth = h * 0.04; g.beginPath(); g.moveTo(w * 0.04, h * 0.5); g.bezierCurveTo(w * 0.3, h * 0.3, w * 0.5, h * 0.75, w * 0.96, h * 0.5); g.stroke();
  [[0.22, 0.42], [0.48, 0.62], [0.62, 0.34], [0.84, 0.8]].forEach(([a, b]) => { g.fillStyle = 'rgba(245,165,36,.35)'; g.beginPath(); g.arc(w * a, h * b, h * 0.12, 0, 7); g.fill(); g.fillStyle = '#e5484d'; g.beginPath(); g.arc(w * a, h * b, h * 0.035, 0, 7); g.fill(); });
};
f.box(-10.5, F + 2.0, OZ0 + 1, -1.5, F + 6.5, OZ0 + 1.25, '#26323c');
screenPlane(scene, 8.6, 4.2, map, { pos: [-6, F + 4.25, OZ0 + 1.27], facing: 's', px: 640 });
// side desks along the left wall
for (const z of [3.5, 6.5]) { table(f, F, OX0 + 1, z - 1, OX0 + 2.6, z + 1, { top: '#f4efe6' }); monitor(f, scene, F, OX0 + 1.5, z, 'e', z > 5 ? draw.chart('#6e5bf2') : draw.sheet('#3a8de0'), { w: 1.4, h: 0.95 }); chair(f, F, OX0 + 3.6, z, 'w', { c: '#3a4a56' }); }
for (const [x, z] of [[OX0 + 1.5, OZ0 + 1.5], [OX1 - 1.5, OZ0 + 1.5], [OX1 - 1.5, 6.5], [OX0 + 1.5, OZ1 - 1]]) plant(f, F, x, z);
// water cooler + shelf
f.box(OX1 - 3.5, F, OZ0 + 1, OX1 - 2.5, F + 1.75, OZ0 + 2, '#e8edf0'); f.box(OX1 - 3.25, F + 1.75, OZ0 + 1.25, OX1 - 2.75, F + 2.5, OZ0 + 1.75, '#8fd0f0');
f.box(-18, F, -7.5, -17, F + 3, -4.5, '#9a6a3e'); for (let k = 0; k < 3; k++) f.box(-17.75, F + 0.5 + k, -7.25, -17, F + 1.25 + k, -4.75, ['#e5484d', '#16c79a', '#3a8de0'][k]);
// park camera domes (fine)
for (const [x, z] of POLES) f.box(x - 0.75, 8.5, z + 0.75, x + 0.25, 9, z + 1.25, '#26323c');
scene.add(f.mesh());

// ---------- people ----------
const S = 0.36;
const P = (shirt, skin, hair, pants = '#2c3e66') => ({ shirt, skin, hair, pants, s: S });
const panel = [
  seated(P('#3a8de0', '#e0b08a', '#3b2a1a'), seatsFar[0], FAR, 's', F),
  seated(P('#16c79a', '#8a5a3a', '#1a120c', '#34405a'), seatsFar[1], FAR, 's', F), // Zainab
  seated(P('#ff8a2a', '#c68a5e', '#d8a040'), seatsFar[2], FAR, 's', F),
  seated(P('#6e5bf2', '#f0c8a0', '#6b3a1e'), seatsFar[3], FAR, 's', F),
  seated(P('#e5484d', '#a0683f', '#2b1d14'), -13, 0, 'e', F),
  seated(P('#ffd23f', '#e8b890', '#9a5a2a', '#3a3a3a'), 0, 0, 'w', F),
  seated(P('#7fb0d0', '#d9a77c', '#2b1d14'), OX0 + 3.6, 3.5, 'w', F),
  seated(P('#f2a3c0', '#7a4a2c', '#1a120c'), OX0 + 3.6, 6.5, 'w', F),
];
panel.forEach((p) => scene.add(p));
const MAYA = panel[1];
const mentor = standing({ shirt: '#13202b', pants: '#4a5560', skin: '#a8714a', hair: '#1a120c', s: S }, -0.5, -6.5, 's', F);
// lanyard
const lan = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.06), new THREE.MeshLambertMaterial({ color: '#16c79a' })); lan.position.set(0, 1.6, -0.4); mentor.add(lan);
scene.add(mentor);
// park visitors and skaters
const walkers = [['#e5484d', '#c68a5e'], ['#3a8de0', '#8a5a3a'], ['#ffd23f', '#e0b08a'], ['#16c79a', '#a0683f']].map(([shirt, skin], i) => { const p = person({ shirt, skin, hair: '#2b1d14', s: 0.34 }); scene.add(p); return p; });
const skaters = [['#ff8a2a', '#7a4a2c'], ['#6e5bf2', '#e0b08a']].map(([shirt, skin]) => { const p = person({ shirt, skin, hair: '#1a120c', s: 0.34 }); scene.add(p); return p; });

// ---------- motion + camera ----------
// 0-2.6 brief | 3.0 form | 6.6 AI draft | 8.8 review: Data ✕ 9.65 (adults-only survey) → fixed 12.2 | Case ✓ 14.35 (energy small) | Source ✕ 16.75 (invented Act) → fixed 20.0 | Authority ✓ 21.85 (council decides) | 23.6 AI V2 | 24.8 sign-off | 28.0 portfolio | 31.6 pathway | 35.0 title
// key: [t, ang, dist, hgt, lookX, lookZ, ox, oy]  (ox/oy = where the look point sits, in px from screen centre)
const T_OUT = 28.0, PATH_IN = 31.6, TITLE_IN = 35.0;
const CK = [
  [0, -0.74, 132, 84, -2, 0, 0, 40],
  [1.6, -0.64, 126, 80, -2, 0, 0, 40],
  [3.6, -0.46, 160, 76, -2, 0, 470, 240],
  [T_OUT, -0.26, 156, 74, -2, 0, 470, 240],
  [T_OUT + 1.0, -0.22, 156, 74, -2, 0, 470, 190],
  [TITLE_IN - 0.4, -0.08, 156, 74, -2, 0, 470, 190],
  [TITLE_IN + 0.5, 0.0, 126, 76, -2, 0, 0, 230],
  [DUR, 0.12, 122, 74, -2, 0, 0, 230],
];
const camAt = (t) => {
  let i = 0; while (i < CK.length - 2 && t > CK[i + 1][0]) i++;
  const a = CK[i], c = CK[i + 1]; const long = c[0] - a[0] > 3;
  const k = long ? clamp((t - a[0]) / (c[0] - a[0])) : ease.inOut(clamp((t - a[0]) / (c[0] - a[0])));
  return a.map((x, n) => lerp(x, c[n], k));
};
st.onFrame((t) => {
  const [, ang, dist, hgt, lx, lz, ox, oy] = camAt(t);
  camera.fov = 30; camera.setViewOffset(1920, 1080, -ox, -oy, 1920, 1080); camera.updateProjectionMatrix();
  camera.position.set(Math.sin(ang) * dist + lx, hgt, Math.cos(ang) * dist + lz);
  camera.lookAt(lx, 0, lz);
  // seated idle + Zainab leaning in to review
  panel.forEach((p, i) => { const b = p.userData.base; p.position.y = b.y + Math.max(0, Math.sin(t * 1.3 + i * 1.7)) * 0.05; p.rotation.x = 0; });
  MAYA.rotation.x = -0.18 * prog(t, 9.2, 10.0) * (1 - prog(t, 24.4, 25.2));
  // mentor stays by the wall screen (clear of Zainab)
  mentor.position.set(-0.5, F, -6.5); mentor.rotation.y = Math.PI; mentor.userData.walk(0);
  // park visitors on loops
  walkers.forEach((p, i) => { const u = t * 0.035 + i * 0.25; const a = u * Math.PI * 2; const x = 21 + Math.cos(a) * 9, z = 5 + Math.sin(a) * 7; p.position.set(x, F, z); p.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)) + Math.PI; p.userData.walk(t * 8 + i); });
  skaters.forEach((p, i) => { const ph = t * 1.4 + i * Math.PI; const x = 26 + Math.cos(ph) * 3.2; p.position.set(x, F + Math.max(0, Math.abs(Math.cos(ph)) * 2.3 - 0.5), -3 + i * 1.6); p.rotation.y = Math.sin(ph) > 0 ? -Math.PI / 2 : Math.PI / 2; });
});

// ---------- UI ----------
// layout: cards in a column on the left (x 46–920), AI colleague top right over the sky, island bottom right
const A = []; const on = (f) => A.push(f);
const fade = fader(); on((t) => fade(t < 0.4 ? 1 - prog(t, 0, 0.4) : t > DUR - 0.4 ? prog(t, DUR - 0.4, DUR) : 0));

// brief
const brief = ui(briefHTML({ from: 'Harbourside Council', task: 'Impact assessment: AI cameras in Harbour Park', due: 'Friday' }), 46, 40);
on(cue(brief, 0.3, 2.6, { from: 'down' }));
const bchip = ui(briefChipHTML('Harbourside Council · Due <em>Friday</em>'), 46, 30);
on(cue(bchip, 3.0, T_OUT - 0.2, { from: 'left' }));

// name tags (snap on fully opaque; no fades over the busy scene)
const tagMaya = pin('<b>Zainab, age 15</b><small>Impact Panel · lead</small>');
const tagMentor = pin('<b>Priya Shah</b><small>Mentor · data protection officer</small>', 'fs-tag mentor');
const say = pin('“Start with who it affects.”', 'fs-say');
on((t) => {
  place(tagMaya, camera, [MAYA.position.x, MAYA.position.y + 4.2, MAYA.position.z], showIO(t, 3.6, 4.9) + showIO(t, 7.4, T_OUT - 0.2), 0);
  const mp = mentor.position; place(tagMentor, camera, [mp.x, mp.y + 4.3, mp.z], showIO(t, 4.9, 5.9), 0);
  place(say, camera, [mp.x, mp.y + 4.3, mp.z], showIO(t, 5.9, 7.4), 0);
});

// impact form (left column)
const stk = [['Residents', '#3a8de0'], ['Park manager', '#ff8a2a'], ['Data protection officer', '#13202b'], ['Environment officer', '#16c79a'], ['Finance officer', '#6e5bf2']];
const FXL = 46, FYT = 112;
const form = ui(`<div class="fs-card ip-form"><div class="hd"><div><span class="fs-lbl">Impact assessment</span><h3>AI cameras in Harbour Park</h3></div><span class="fs-status" data-st>Draft</span></div>
  <div class="ip-sec"><span class="fs-lbl">Who is affected</span><div class="ip-stk">${stk.map(([n, c], i) => `<div class="ip-s" data-s="${i}"><i style="background:${c}22">${ICO.person(c)}</i>${n}</div>`).join('')}<div class="ip-s new" data-s="5"><i style="background:#16c79a33">${ICO.person('#0c8f6d')}</i>Young people (under 18)</div></div></div>
  <div class="ip-rows">
   <div class="ip-r"><span class="k">Privacy</span><span data-priv></span></div>
   <div class="ip-r"><span class="k">Energy</span><span class="ip-en"><span class="bar"><i data-en></i></span><span><b data-kwh>≈ 1,100 kWh a year</b><small data-ens>4 cameras + cloud processing</small></span></span></div>
   <div class="ip-r"><span class="k">Advice</span><span data-dec></span></div>
  </div></div>`, FXL, FYT);
const fS = [...form.querySelectorAll('[data-s]')];
const fPriv = form.querySelector('[data-priv]'), fDec = form.querySelector('[data-dec]'), fEn = form.querySelector('[data-en]'), fEnS = form.querySelector('[data-ens]'), fSt = form.querySelector('[data-st]'), fKwh = form.querySelector('[data-kwh]');
const PRIV_AI = 'Allowed under the 2024 Park Privacy Act.';
const PRIV_FIX = 'UK GDPR and ICO video guidance apply.';
const DEC_AI = 'Approve. All groups covered.';
const DEC_FIX = 'Recommend to councillors: count people, never identify them. Delete footage after 24 h.';
const FORM_IN = 3.0, AI_IN = 6.6, DATA_FAIL = 9.65, DATA_FIX = 12.2, CASE_OK = 14.35, SRC_FAIL = 16.75, PRIV_T = 18.4, SRC_FIX = 20.0, AUTH_OK = 21.85, DEC_T = 22.2, V2 = 23.6, SIGN = 24.8;
const FOLD_X = 60, FOLD_Y = 860; // portfolio folder (bottom left, island stays on the right)
on((t) => {
  // entrance; at the end the form (fully opaque) shrinks into the portfolio folder and is hidden behind its front
  const a = prog(t, FORM_IN, FORM_IN + 0.5, ease.out);
  const d = prog(t, T_OUT + 0.9, T_OUT + 1.8, ease.inOut);
  const vis = t > FORM_IN && t < T_OUT + 1.75;
  form.style.opacity = vis ? a : 0; form.style.visibility = vis ? 'visible' : 'hidden';
  form.style.transformOrigin = '0 0'; form.style.zIndex = 5;
  form.style.transform = `translate(${-(1 - a) * 120 + d * (FOLD_X + 60 - FXL)}px, ${d * (FOLD_Y + 10 - FYT)}px) scale(${1 - d * 0.82})`;
  fS.forEach((c, i) => { const ti = i < 5 ? FORM_IN + 0.5 + i * 0.22 : DATA_FIX; const k = prog(t, ti, ti + 0.35, ease.back); c.style.opacity = clamp(k); c.style.transform = `scale(${0.7 + 0.3 * k})`; });
  // energy estimate (Zainab's own working): the number is shown whole, the bar grows
  const ek = prog(t, 4.6, 5.4, ease.out); fEn.style.width = ek * 40 + '%'; fKwh.style.opacity = prog(t, 4.6, 4.9); fEnS.style.opacity = prog(t, 5.0, 5.3);
  fKwh.parentNode.parentNode.classList.toggle('hl', t > CASE_OK - 0.45 && t < CASE_OK + 1.6);
  let ph;
  if (t < AI_IN + 0.6) ph = '<span class="muted">Waiting for draft…</span>';
  else if (t < SRC_FAIL) ph = `<span class="fs-aitxt"><span class="fs-aitag">AI</span>${PRIV_AI}</span>`;
  else { const ty = typed(PRIV_FIX, t, PRIV_T, 40); ph = `<span class="fs-del">2024 Park Privacy Act</span>${t > PRIV_T ? ` <span class="fs-new">${ty}${ty.length < PRIV_FIX.length ? '<i class="fs-caret"></i>' : ''}</span>` : ''}`; }
  setHTML(fPriv, ph);
  let dh;
  if (t < AI_IN + 0.9) dh = '<span class="muted">—</span>';
  else if (t < DATA_FAIL) dh = `<span class="fs-aitxt"><span class="fs-aitag">AI</span>${DEC_AI}</span>`;
  else if (t < DEC_T) dh = `<span class="fs-aitxt"><span class="fs-aitag">AI</span>Approve. <span class="fs-del">All groups covered.</span></span>`;
  else { const ty = typed(DEC_FIX, t, DEC_T, 64); dh = `<span class="fs-new">${ty}${ty.length < DEC_FIX.length ? '<i class="fs-caret"></i>' : ''}</span>`; }
  setHTML(fDec, dh);
  const sst = t < AI_IN + 0.6 ? ['', 'Draft'] : t < 8.8 ? ['ai', 'AI draft'] : t < SIGN ? ['rev', 'In review'] : ['ok', 'Signed off'];
  const cls = 'fs-status' + (sst[0] ? ' ' + sst[0] : ''); if (fSt.className !== cls) fSt.className = cls; if (fSt.textContent !== sst[1]) fSt.textContent = sst[1];
});

// AI colleague (top right, over the sky): each claim is struck only when its own check fails; returns as V2
const ai = ui(aiHTML({ text: 'Draft ready. Cameras are <q>allowed under the 2024 Park Privacy Act</q>. <q>All groups covered.</q> Recommend: approve.', sure: 94, data: 'Council survey · adults 18+' }), 1874, 112, 'tr');
on(cue(ai, AI_IN, T_OUT - 0.2, { from: 'right' }));
on((t) => {
  if (t < DATA_FAIL) aiSet(ai, { state: 'DRAFT', sure: 94 });
  else if (t < SRC_FAIL) aiSet(ai, { state: 'RETURNED', mode: 'ret', sure: 0, label: 'Not trusted', strike: [1], dataX: true });
  else if (t < V2) aiSet(ai, { state: 'RETURNED', mode: 'ret', sure: 0, label: 'Not trusted', strike: [0, 1], dataX: true });
  else aiSet(ai, { state: 'V2 · RE-CHECKED', mode: 'v2', sure: 91, label: '91% sure · re-checked by Zainab', strike: [0, 1], data: 'Survey + under-18s', note: 'Under-18s asked · real law · council decides' });
});

// review: Data ✕ → re-checked ✓, Case ✓ (reason), Source ✕ → re-checked ✓, Authority ✓ (reason)
const chk = checkStrip(1874, 20, 'tr');
on(cue(chk, 8.8, T_OUT - 0.2, { from: 'down' }));
const PLAN = [{ run: DATA_FAIL - 0.45, res: 'fail', fix: DATA_FIX }, { run: CASE_OK - 0.45, res: 'pass' }, { run: SRC_FAIL - 0.45, res: 'fail', fix: SRC_FIX }, { run: AUTH_OK - 0.45, res: 'pass' }];
on((t) => chk.drive(t, PLAN));
const LOW = 744; // lower slot in the left column, under the form
const findData = ui(findHTML('DATA CHECK · UNDER-18s MISSING', [['Data used', 'Council survey · adults 18+'], ['Missing', 'Under-18s: the park’s main users'], ['Action', { t: 'Ask young people. Add them.', cls: 'bad' }]]), FXL, LOW);
on(cue(findData, DATA_FAIL + 0.1, CASE_OK - 0.5, { from: 'left' }));
on(findFix(findData, DATA_FIX + 0.45, 'DATA CHECK · UNDER-18s MISSING', 'DATA CHECK · RE-CHECKED', 'Young people asked and added.'));
const whyCase = ui(findHTML('CASE CHECK · HOLDS', [['Why', 'Energy use is small (≈1,100 kWh a year). Holds for this park.']], true), FXL, LOW);
on(cue(whyCase, CASE_OK - 0.1, SRC_FAIL - 0.3, { from: 'left' }));
const findSrc = ui(findHTML('SOURCE CHECK · LAW NOT FOUND', [['Claim', '“2024 Park Privacy Act”'], ['Searched', 'UK legislation: 0 results'], ['Asked', 'Priya (DPO): “No such Act.”'], ['Action', { t: 'Invented law. Remove it.', cls: 'bad' }]]), FXL, LOW);
on(cue(findSrc, SRC_FAIL + 0.1, AUTH_OK - 0.5, { from: 'left' }));
on(findFix(findSrc, SRC_FIX + 0.45, 'SOURCE CHECK · LAW NOT FOUND', 'SOURCE CHECK · RE-CHECKED', 'Replaced with UK GDPR + ICO guidance.'));
const whyAuth = ui(findHTML('AUTHORITY CHECK · CLEAR', [['Who decides', 'Panel recommends; councillors decide.']], true), FXL, LOW);
on(cue(whyAuth, AUTH_OK - 0.1, SIGN - 0.3, { from: 'left' }));
const sign = ui(signHTML('Zainab', 15, 'Recommendation reviewed by'), FXL, LOW + 40);
on(cue(sign, SIGN, T_OUT - 0.2, { from: 'pop' }));

// portfolio: Zainab's own piece from this trailer only
const folder = ui(folderHTML('Zainab', 'Saving…'), FOLD_X, FOLD_Y);
folder.style.zIndex = 6;
on(cue(folder, T_OUT + 0.3, PATH_IN - 0.3, { from: 'up' }));
on((t) => { const s = t > T_OUT + 1.75 ? 'Impact assessment (NEW)' : 'Saving…'; const n = folder.querySelector('[data-items]'); if (n.textContent !== s) n.textContent = s; folder.firstChild.classList.toggle('glow', t > T_OUT + 1.75 && t < T_OUT + 2.3); });

// pathway (left, island on the right), then a bright stacked title above the whole island
const path = ui(pathHTML({ next: 'Experience AI ethics lessons <em>(free, 11–14)</em> · Elements of AI <em>(free, 16+)</em>', award: 'DofE Bronze Skills section <em>(debating or public speaking)</em>', route: 'Citizenship GCSE, then A-level Law or Politics, or an EPQ', jobs: ['Policy adviser', 'Data protection officer', 'AI governance specialist'] }), 46, 170);
on(cue(path, PATH_IN, TITLE_IN - 0.35, { from: 'left' }));
const title = ui(endTitleHTML('Impact <span class="hl">Panel</span>', 'Check the AI’s draft before the council says yes.'), 960, 70);
title.dataset.anchor = '';
on((t) => {
  const a = prog(t, TITLE_IN, TITLE_IN + 0.6, ease.back);
  title.style.opacity = clamp(prog(t, TITLE_IN, TITLE_IN + 0.3)); title.style.visibility = t > TITLE_IN ? 'visible' : 'hidden';
  title.style.transform = `translate(-50%, 0) scale(${(0.8 + 0.2 * a) * (1 + 0.025 * prog(t, TITLE_IN + 0.6, DUR, (k) => k))})`; title.style.transformOrigin = '50% 0';
});

st.onFrame((t) => A.forEach((f) => f(t)));
window.__duration = DUR;
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>
