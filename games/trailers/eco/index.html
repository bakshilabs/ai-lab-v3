<!doctype html><html><head><meta charset="utf-8"><title>Eco AI Explorer trailer</title>
<link rel="stylesheet" href="../engine/ui.css"><link rel="stylesheet" href="../engine/brochure.css">
<script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/three-addons/"}}</script></head>
<body><div id="app"><div id="bg"></div><div id="ui"></div><div id="fx"></div></div>
<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, island, tree, house, person, duck, frog, particles, PAL, rand, hex } from '../engine/kit.js';
import { el, cue, fader, toScreen, titleCard } from '../engine/ui.js';

const DUR = 38;
const st = createStage({ sky: ['#5db6ff', '#d9efff'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.5; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0); document.getElementById('bg').style.background = 'linear-gradient(180deg, #5db6ff 0%, #9fd2ff 45%, #e3f3ff 100%)'; sun.intensity = 2.6; sun.position.set(-50, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;
const T = 0;
// ---------- island (brochure look) ----------
const v = new Vox(); v.jitter = 0.07;
const isl = island(v, { rx: 30, rz: 26, depth: 16, seed: 41, flat: false });
const top = (x, z) => isl.top(x, z) ?? 0;
const inPond = (x, z) => Math.hypot((x - 1) / 8.5, (z + 1) / 6.5) < 1;
const pondCells = [], rimCells = [], meadowCells = [];
for (let x = -32; x <= 32; x++) for (let z = -28; z <= 28; z++) {
  const h = isl.top(x, z); if (h == null) continue;
  if (inPond(x + .5, z + .5)) { for (let y = h; y > -2; y--) v.set(x, y, z, null); v.set(x, -2, z, '#3a7fa0'); v.set(x, -3, z, '#3a7fa0'); pondCells.push([x, z]); continue; }
  // flatten around the pond so the rim is level
  if (Math.hypot((x - 1) / 10.8, (z + 1) / 8.6) < 1) { for (let y = h; y > 0; y--) v.set(x, y, z, null); v.set(x, 0, z, Math.hypot((x - 1) / 9.6, (z + 1) / 7.6) < 1 ? '#d8c890' : (rand(x, 3, z) > .5 ? '#8fd16a' : '#7cc85a')); rimCells.push([x, z]); continue; }
  // brochure grass: patches of light and dark green
  const patch = Math.sin(x * 0.35) + Math.cos(z * 0.3) + rand(x, 7, z) * 0.8;
  v.set(x, h, z, patch > 1.2 ? '#8fd96a' : patch > 0 ? '#6cc04b' : patch > -1 ? '#5fb446' : '#4fa63c');
  if (rand(x, 9, z) > 0.55) meadowCells.push([x, z]);
}
// soil stripes on the sides
for (const [key, vv] of v.m) { const [x, y, z] = vv; if (y < -1 && y > -5 && (x + z) % 3 === 0) v.set(x, y, z, '#7a4f2e'); }
// cabin at the back (log walls, green roof)
house(v, -14, top(-14, -16) ?? 0, -19, { w: 9, d: 7, h: 5, roof: '#3f7a4a', wall: '#8a5a34' });
// rocks
v.box(-16, 1, 4, -13, 2, 6, '#8a8f95'); v.box(-15, 3, 5, -14, 3, 5, '#9aa0a6'); v.box(14, 1, -9, 17, 1, -7, '#5f646a'); v.box(15, 2, -8, 16, 2, -8, '#6c7177');
// trees: round (light) on the left, pines (dark) on the right, as in the brochure
const trees = [[-22, -6, 'r'], [-24, 8, 'p'], [-18, 16, 'r'], [-6, 20, 'r'], [8, 20, 'r'], [20, 14, 'p'], [24, 2, 'p'], [22, -12, 'p'], [12, -20, 'r'], [-2, -22, 'p'], [26, -4, 'r'], [-26, -14, 'r'], [16, 22, 'r']];
for (const [x, z, k] of trees) tree(v, x, top(x, z), z, { kind: k === 'p' ? 'pine' : 'round', s: 2 });
const world = v.mesh(); scene.add(world);
const water = (() => { const w = new Vox(); w.jitter = 0.03; for (const [x, z] of pondCells) w.set(x, -1, z, '#4fb0e6'); const m = w.mesh({ castShadow: false }); m.material.transparent = true; m.material.opacity = 0.78; m.position.y = 0.4; return m; })(); scene.add(water);
const lilies = particles(10, { size: 1 }); lilies.geometry = new THREE.BoxGeometry(1.2, 0.12, 1.2); lilies.material.color.set('#3faa4a'); scene.add(lilies);
for (let i = 0; i < 10; i++) { const [x, z] = pondCells[Math.floor(rand(i, 4) * pondCells.length)]; lilies.setAt(i, x + 0.5, 0.0, z + 0.5, 0, rand(i, 2) * 3, 1); } lilies.done();

// reeds around the pond (instanced so they can be cut)
const reedSpots = rimCells.filter(([x, z]) => Math.hypot((x - 1) / 9.6, (z + 1) / 7.6) < 1.12 && rand(x, 13, z) > 0.25);
const RN = reedSpots.length * 2;
const stalks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.22, 1, 0.22), new THREE.MeshLambertMaterial({ color: '#4f9a3a' }), RN);
const heads = new THREE.InstancedMesh(new THREE.BoxGeometry(0.34, 0.7, 0.34), new THREE.MeshLambertMaterial({ color: '#7a4a2a' }), RN);
stalks.frustumCulled = heads.frustumCulled = false; scene.add(stalks, heads);
const reed = []; reedSpots.forEach(([x, z], i) => { for (let k = 0; k < 2; k++) reed.push([x + 0.3 + rand(i, k) * 0.5, z + 0.3 + rand(i, k + 5) * 0.5, 2.4 + rand(i, k + 9) * 1.8]); });
const d3 = new THREE.Object3D();
// gravel path + deck (AI's "neat" version), boardwalk (clear version)
const path = particles(400, { size: 1 }); path.geometry = new THREE.BoxGeometry(1, 0.2, 1); path.material.color.set('#e6dcc2'); scene.add(path);
const pathCells = rimCells.filter(([x, z]) => { const r = Math.hypot((x - 1) / 10.4, (z + 1) / 8.3); return r > 0.88; });
const deck = particles(60, { size: 1 }); deck.geometry = new THREE.BoxGeometry(1, 0.3, 1); deck.material.color.set('#c99a63'); scene.add(deck);
const deckCells = []; for (let x = 3; x <= 7; x++) for (let z = -6; z <= -2; z++) deckCells.push([x, z]);
const board = particles(60, { size: 1 }); board.geometry = new THREE.BoxGeometry(0.95, 0.35, 1); board.material.color.set('#c9945c'); scene.add(board);
const boardCells = []; for (let x = -8; x <= 9; x++) { boardCells.push([x, 6.4]); boardCells.push([x, 7.4]); }
const flowers = particles(260, { size: 0.42 }); scene.add(flowers);
const FC = ['#ff7eb6', '#ffd23f', '#ffffff', '#b28cff', '#ff8a4a'];
const fl = meadowCells.slice(0, 260).map(([x, z], i) => { flowers.setColor(i, FC[i % 5]); return [x + 0.5, z + 0.5]; });
// creatures
const ducks = [0, 1, 2].map(() => { const d = duck({ s: 0.3 }); scene.add(d); return d; });
const frogs = [0, 1].map(() => { const f = frog({ s: 0.24 }); scene.add(f); return f; });
const dragon = new THREE.Group(); { const b = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.9), new THREE.MeshLambertMaterial({ color: '#2f8fd6' })); const w = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 0.3), new THREE.MeshLambertMaterial({ color: '#cfeaff', transparent: true, opacity: 0.8 })); dragon.add(b, w); scene.add(dragon); }
const heron = (() => { const h = new Vox(); h.box(0, 4, 0, 1, 6, 1, '#9aa7b4'); h.box(0, 0, 0, 0, 3, 0, '#e0a050'); h.box(1, 0, 0, 1, 3, 0, '#e0a050'); h.box(1, 7, 0, 1, 9, 0, '#9aa7b4'); h.box(1, 9, 0, 3, 9, 0, '#e0c060'); return h.mesh({ scale: 0.32 }); })(); scene.add(heron);
const kids = [person({ shirt: '#6e5bf2', skin: '#a8714b' }), person({ shirt: '#ffc83d', skin: '#6b4a33' }), person({ shirt: '#ff6a4a', skin: '#e0b08a' })];
kids.forEach((k) => scene.add(k));
const stars = particles(3, { size: 2.4 }); stars.material = new THREE.MeshBasicMaterial({ color: '#ffd23f' }); scene.add(stars);

// ---------- timeline ----------
// 0-4 hook orbit | 4-8.4 cards, tap A | 8.4-13 AI cuts reeds, path + deck | 13-17.4 ducks leave, meters | 17.4-21 facilitator + tap B | 21-28 boardwalk, reeds regrow, wildlife returns | 28-32 wide | 32-38 title
st.onFrame((t) => {
  const cutK = prog(t, 9.2, 11.6);
  const neat = t >= 9.2 && t < 21.2, fixK = prog(t, 21.4, 24.5);
  reed.forEach(([x, z, h], i) => { const ang = Math.atan2(z + 1, x - 1); const order = (ang + Math.PI) / (Math.PI * 2); let sc = 1; if (neat) sc = order < cutK ? 0.08 : 1; if (t >= 21.2) sc = lerp(0.08, 1, clamp(fixK * 1.5 - order * 0.5)); const sway = Math.sin(t * 1.8 + x * 0.5) * 0.08; d3.position.set(x, h * sc / 2 + 0.5, z); d3.scale.set(1, h * sc, 1); d3.rotation.set(sway, 0, sway * 0.6); d3.updateMatrix(); stalks.setMatrixAt(i, d3.matrix); d3.position.set(x + sway * h * sc * 0.5, h * sc + 0.7, z); d3.scale.set(1, sc > 0.2 ? 1 : 0.001, 1); d3.updateMatrix(); heads.setMatrixAt(i, d3.matrix); });
  stalks.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true;
  pathCells.forEach(([x, z], i) => { const ang = Math.atan2(z + 1, x - 1); const order = (ang + Math.PI) / (Math.PI * 2); const on = neat && order < prog(t, 10, 12.4) ? 1 : t >= 21.2 ? 1 - fixK : 0; path.setAt(i, x + 0.5, 0.6, z + 0.5, 0, 0, on); }); path.done();
  deckCells.forEach(([x, z], i) => { const on = neat ? prog(t, 11.6 + i * 0.02, 12 + i * 0.02) : t >= 21.2 ? 1 - fixK : 0; deck.setAt(i, x + 0.5, 0.75, z + 0.5, 0, 0, on); }); deck.done();
  boardCells.forEach(([x, z], i) => { const on = t >= 21.4 ? prog(t, 21.6 + i * 0.07, 22 + i * 0.07, ease.back) : 0; board.setAt(i, x + 0.5, 1.05, z, 0, 0, on); }); board.done();
  fl.forEach(([x, z], i) => { const bloom = t < 21.2 ? 1 : 1 + 0.3 * Math.sin(t * 3 + i); flowers.setAt(i, x, (top(Math.floor(x), Math.floor(z)) || 0) + 1.25, z, 0, 0, bloom * (i % 3 === 0 && t >= 23 ? 1.3 : 1)); }); flowers.done();
  // ducks: paddle; fly away at 13.2; return at 24
  ducks.forEach((dk, i) => { const a = t * 0.35 + i * 2.1; let x = 1 + Math.cos(a) * (5 - i), z = -1 + Math.sin(a) * (3.6 - i * 0.5), y = 0.55; if (t > 13.2 && t < 24) { const k = prog(t, 13.2 + i * 0.2, 15.5 + i * 0.2); x += k * 40; y += k * 26; z -= k * 20; } if (t >= 24) { const k = 1 - prog(t, 24 + i * 0.3, 26 + i * 0.3); x += k * 40; y += k * 26; z -= k * 20; } dk.position.set(x, y, z); dk.rotation.y = t > 13.2 && t < 24 ? -0.5 : -a; dk.visible = !(t > 15.8 && t < 24); });
  frogs.forEach((f, i) => { const on = t < 9.6 || t > 24.6; f.visible = on; f.position.set(-5 + i * 9, 0.4 + Math.abs(Math.sin(t * 3 + i)) * (t > 24.6 ? 0.4 : 0), -1 + i * 3); f.rotation.y = i; });
  dragon.visible = t > 25.4; { const a = t * 1.4; dragon.position.set(Math.cos(a) * 6 + 1, 3 + Math.sin(t * 4) * 0.4, Math.sin(a) * 4 - 1); dragon.rotation.y = -a; dragon.children[1].scale.x = 1 + Math.sin(t * 40) * 0.3; }
  heron.visible = t > 26; heron.position.set(-7, 0.6, -6); heron.rotation.y = 0.6;
  kids.forEach((k, i) => { const u = t * 0.06 + i * 0.33; const a = u * Math.PI * 2; const r = t >= 21.2 ? 0 : 1; k.position.set(1 + Math.cos(a) * 10.8, 0.6, -1 + Math.sin(a) * 8.6); if (t >= 22) k.position.set(-6 + i * 4 + Math.sin(t + i), 1.1, 6.6); k.rotation.y = -a; k.userData.walk(t * 7 + i); });
  for (let i = 0; i < 3; i++) { const k = prog(t, 26.6 + i * 0.15, 27.2 + i * 0.15, ease.back); stars.setAt(i, -3 + i * 4, 10 + (i === 1 ? 1.5 : 0), -1, 0, t, t > 26.6 && t < 31 ? k : 0); } stars.done();
  // camera (brochure angle, slow orbit; closer shots on the pond)
  let ang, dist, hgt, fov = 30, look = [0, 0, 0];
  if (t < 4) { const k = prog(t, 0, 4); ang = lerp(0.9, 0.55, ease.inOut(k)); dist = lerp(100, 72, ease.out(k)); hgt = lerp(76, 58, k); }
  else if (t < 8.4) { ang = 0.5; dist = 72; hgt = 58; }
  else if (t < 17.4) { const k = prog(t, 8.4, 17.4); ang = lerp(0.42, 0.28, k); dist = lerp(54, 46, k); hgt = lerp(44, 37, k); look = [1, 0, -1]; }
  else if (t < 21) { ang = 0.25; dist = 46; hgt = 37; look = [1, 0, -1]; }
  else if (t < 28) { const k = prog(t, 21, 28); ang = lerp(0.22, -0.1, k); dist = lerp(46, 54, k); hgt = lerp(37, 42, k); look = [1, 0, 0]; }
  else { const k = prog(t, 28, 38); ang = lerp(-0.12, -0.6, k); dist = lerp(80, 120, k); hgt = lerp(60, 84, k); }
  camera.fov = fov; camera.updateProjectionMatrix(); camera.position.set(Math.sin(ang) * dist + look[0], hgt, Math.cos(ang) * dist + look[2]); camera.lookAt(look[0], look[1] - (t >= 8.4 && t < 28 ? lerp(4, 0.5, prog(t, 8.4, 10)) : 4), look[2]);
});

// ---------- UI (brochure game UI) ----------
const ui = []; const A = (f) => ui.push(f);
const fade = fader(); A((t) => fade(t < 0.5 ? 1 - prog(t, 0, 0.5) : t > DUR - 0.7 ? prog(t, DUR - 0.7, DUR) : 0));
const leaf = '<svg viewBox="0 0 24 24"><path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z" fill="#1f9d55"/><path d="M6 18L15 9" stroke="#fff" stroke-width="1.6"/></svg>';
const badge = el(`<div class="b-badge"><span class="ic">${leaf}</span><span><b>Eco AI Explorer</b><small>NATURE CENTRE</small></span></div>`, { x: 46, y: 40 }); A(cue(badge, 1.0, 31.6, { from: 'left' }));
const taskP = el('<div class="b-task"><span class="lv">L2</span>Design a pond that wildlife and visitors can share</div>', { x: 46, y: 176 }); A(cue(taskP, 1.4, 31.6, { from: 'left' }));
const pills = el('<div class="b-pills"><span><svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 16.9l-5.6 2.9 1.1-6.2-4.6-4.4 6.3-.9z" fill="#ffc83d"/></svg><b data-s>4</b></span><span><em class="xp">XP</em><b data-x>1240</b></span></div>', { x: 1874, y: 40, anchor: 'tr' }); A(cue(pills, 1.2, 31.6, { from: 'right' }));
A((t) => { pills.querySelector('[data-s]').textContent = t > 26.8 ? 7 : 4; pills.querySelector('[data-x]').textContent = t > 26.8 ? Math.round(lerp(1240, 1360, prog(t, 26.8, 27.8))) : 1240; });
const hand = '<svg width="90" height="110" viewBox="0 0 90 110"><path d="M34 8c6 0 9 4 9 9v30l4-1c5-1 9 2 9 6l1-1c5-1 9 2 9 6l1 0c5-1 9 2 9 7v16c0 14-10 26-26 26H44c-9 0-15-4-20-11L8 72c-3-5-1-10 4-11 4-1 7 1 9 4l4 5V17c0-5 3-9 9-9z" fill="#fff" stroke="#13202b" stroke-width="5" stroke-linejoin="round"/></svg>';
function cardsSet(tIn, tOut, head, pickAt, pick) {
  const n = el(`<div><div class="b-head">${head}</div><div class="b-cards">${[['A', 'Make it nice for visitors'], ['B', 'Add a boardwalk and keep the reeds wild'], ['C', 'Plant native flowers on one bank']].map(([k, s], i) => `<div class="b-card" data-i="${i}"><span class="k">${k}</span>${s}</div>`).join('')}</div></div>`, { x: 46, y: 840 });
  A(cue(n, tIn, tOut, { from: 'up' }));
  const h = el(hand, { x: 0, y: 0 }); A((t) => { const v = within(t, pickAt - 0.8, tOut); h.style.opacity = v ? 1 : 0; const card = n.querySelectorAll('.b-card')[pick]; card.classList.toggle('pick', t > pickAt); const tx = 46 + pick * 580 + 60, ty = 990; const k = prog(t, pickAt - 0.8, pickAt - 0.1, ease.out); h.style.left = lerp(tx + 260, tx, k) + 'px'; h.style.top = lerp(ty + 140, ty, k) + 'px'; h.style.transform = `scale(${t > pickAt && t < pickAt + 0.15 ? 0.88 : 1})`; });
}
cardsSet(4.2, 8.6, 'TELL THE AI HELPER WHAT TO DO', 6.4, 0);
cardsSet(18.6, 21.6, 'TRY A CLEARER CARD', 20.4, 1);
const helper = el(`<div class="b-helper"><div class="bot"><i></i><i></i></div><div class="who">AI helper <em>GUESS</em></div><p>“Nice” sounds like neat. Cutting the reeds, adding a gravel path and a deck.</p><div class="sure"><div class="bar"><i style="width:64%"></i></div><span>64% sure</span></div></div>`, { x: 1874, y: 176, anchor: 'tr' }); A(cue(helper, 8.6, 17.2, { from: 'right' }));
const alert = el('<div class="b-alert"><span class="x">✕</span>The ducks have left</div>', { x: 960, y: 620, anchor: 'c' }); A(cue(alert, 14.4, 17.2));
function meters(tIn, tOut, vis, wild, arrows) { const n = el(`<div class="b-meters"><div class="b-meter"><span style="color:#1f9d55">●●</span><span>Visitors</span><div class="mb"><i style="width:${vis}%;background:linear-gradient(90deg,#16c79a,#7ae0a0)"></i></div><b>${vis}</b><span style="color:${arrows[0] > 0 ? '#16a37f' : '#e5533d'}">${arrows[0] > 0 ? '↑' : '↓'}</span></div><div class="b-meter"><span style="color:#1f9d55">❧</span><span>Wildlife</span><div class="mb"><i style="width:${wild}%;background:${wild < 50 ? 'linear-gradient(90deg,#ff6a4a,#ff9a6a)' : 'linear-gradient(90deg,#16c79a,#7ae0a0)'}"></i></div><b>${wild}</b><span style="color:${arrows[1] > 0 ? '#16a37f' : '#e5533d'}">${arrows[1] > 0 ? '↑' : '↓'}</span></div></div>`, { x: 46, y: 860 }); A(cue(n, tIn, tOut, { from: 'up' })); }
meters(13.6, 18.4, 88, 41, [1, -1]); meters(25.2, 31.6, 82, 90, [-1, 1]);
function species(tIn, tOut, on) { const S = [['Mallard', '#1f8a4a'], ['Frog', '#3fbf3f'], ['Dragonfly', '#2f8fd6'], ['Heron', '#8a96a3'], ['Butterfly', '#ff9a1a'], ['Damselfly', '#16c7a6'], ['Pond skater', '#7a5a3a'], ['Newt', '#e5533d']]; const n = el(`<div class="b-species"><small>SPECIES SEEN <b>${on}/8</b></small><div class="b-chips">${S.map(([s, c], i) => `<span class="${i < on ? '' : 'off'}"><i style="background:${c}"></i>${s}</span>`).join('')}</div></div>`, { x: 680, y: 860 }); A(cue(n, tIn, tOut, { from: 'up' })); }
species(13.8, 18.4, 2); species(25.4, 31.6, 7);
const facil = el('<div class="b-facil"><small>FACILITATOR</small><p>You asked for “nice”. What did the AI think you meant?</p></div>', { x: 1874, y: 520, anchor: 'tr' }); A(cue(facil, 17.6, 21.2, { from: 'right' }));
const saved = el('<div class="b-saved">Habitat plan saved</div>', { x: 960, y: 470, anchor: 'c' }); A(cue(saved, 27.0, 31.4));
const dimEnd = el('<div style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at center, rgba(10,40,80,.25), rgba(10,40,80,.6))"></div>'); A(cue(dimEnd, 31.8, null, { from: 'fade', dur: 0.8 }));
const title = titleCard('Eco AI <span class="hl">Explorer</span>', 'Design a pond for wildlife and visitors. Check the AI’s guess.', { chip: 'A DeltaOps Learning AI lab · Nature centres' }); A(cue(title, 32.0, null, { from: 'pop', dur: 0.8 }));
st.onFrame((t) => ui.forEach((f) => f(t)));
window.__duration = DUR;
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>
