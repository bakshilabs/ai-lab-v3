<!doctype html><html><head><meta charset="utf-8"><title>Block Quest trailer</title>
<style>
@font-face { font-family: 'P2P'; src: url('../node_modules/@fontsource/press-start-2p/files/press-start-2p-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Silk'; src: url('../node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2') format('woff2'); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
canvas { width: 1920px; height: 1080px; image-rendering: pixelated; display: block; }
</style></head>
<body><canvas id="c" width="320" height="180"></canvas>
<script>
const W = 320, H = 180, DUR = 36, T = 12;
const cv = document.getElementById('c'), g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = (k) => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function hash(x, y = 0, z = 0) { let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
function txt(s, x, y, c = '#fff', size = 8, f = 'P2P', al = 'center') { g.font = `${size}px ${f}`; g.textAlign = al; g.fillStyle = '#000'; g.fillText(s, x + 1, y + 1); g.fillStyle = c; g.fillText(s, x, y); }

// ---------- level (3 rooms of 13x13) ----------
const ROOMS = [[
'.............',
'.............',
'.............',
'.............',
'.............',
'.....YYY.....',
'.............',
'....GGGGG....',
'.............',
'.........YY..',
'..W.....GGG..',
'GGGGG.....GGG',
'GGGGGBBBBBGGG'], [
'.............',
'.............',
'.............',
'..YYY........',
'.............',
'.GGGG....K...',
'........GGG..',
'.............',
'.............',
'......Y......',
'.....GGG..P..',
'GGG.......GGG',
'GGGRRRRRRRGGG'], [
'.............',
'.............',
'.............',
'.............',
'......YYY....',
'.............',
'.....GGGGG...',
'.............',
'.............',
'..O........E.',
'GGGG..P...GGG',
'GGGG.....GGGG',
'GGGGBBBBBGGGG']];
const COLS = 39;
function cell(c, r, hard) {
  const room = ROOMS[Math.floor(c / 13)]; if (!room) return '.';
  let ch = room[r][c % 13];
  if (hard && ch === '.' && r >= 8 && r <= 10 && hash(c, r, 5) > 0.35) ch = 'R';
  if (hard && ch === 'Y') ch = 'R';
  return ch;
}
// ---------- tile art (12x12) ----------
const COL = { G: ['#3fbf3f', '#2e9a2e', '#6be36b', '#1f7a2a'], R: ['#e83b3b', '#a51f1f', '#ff8a8a'], Y: ['#ffd23f', '#e0a21a', '#fff2a0'], P: ['#9b4ff0', '#6a24c0', '#e6d0ff'], B: ['#2e8ef0', '#1a5fc0', '#9fd4ff'], W: ['#f4f4f4', '#c9c9c9', '#888'], K: ['#ff6fb5', '#c03a80', '#ffd0e8'], O: ['#ff8a2a', '#c05a10', '#ffd0a0'], E: ['#f4f4f4', '#c9c9c9', '#3a2a1a'] };
function drawTile(ch, x, y, t, c = 0, r = 0) {
  if (ch === '.') return;
  const k = COL[ch];
  if (ch === 'G') { px(x, y, T, T, k[1]); for (let i = 0; i < 6; i++) px(x + Math.floor(hash(c, r, i) * 10), y + 3 + Math.floor(hash(c, r, i + 9) * 8), 2, 1, k[3]); if (cell(c, r - 1) !== 'G') { px(x, y, T, 3, k[0]); px(x, y, T, 1, k[2]); for (let i = 0; i < T; i += 3) px(x + i, y + 3, 1, 1, k[0]); } px(x, y + T - 1, T, 1, k[3]); return; }
  if (ch === 'R') { px(x, y + 6, T, 6, k[1]); for (let i = 0; i < 3; i++) { for (let j = 0; j < 6; j++) px(x + i * 4 + (j >> 1), y + 6 - j, 4 - (j >> 1) * 2 > 0 ? 4 - 2 * (j >> 1) : 1, 1, k[0]); px(x + i * 4 + 1, y + 2, 1, 1, k[2]); } return; }
  if (ch === 'Y') { const w = Math.max(1, Math.round(Math.abs(Math.cos(t * 4 + c)) * 8)); px(x + 6 - w / 2, y + 2, w, 8, k[1]); px(x + 6 - w / 2 + (w > 3 ? 1 : 0), y + 3, Math.max(1, w - 2), 6, k[0]); if (w > 4) px(x + 5, y + 4, 1, 3, k[2]); return; }
  if (ch === 'B') { px(x, y, T, T, k[0]); for (let i = 0; i < T; i += 4) px(x + ((i + Math.floor(t * 6)) % T), y + 1 + (i % 3), 3, 1, k[2]); px(x, y + 6, T, 6, k[1]); return; }
  if (ch === 'W') { px(x + 1, y + 1, 10, 10, k[0]); px(x + 1, y + 10, 10, 1, k[1]); px(x + 5, y + 3, 2, 4, '#3a6fd0'); px(x + 5, y + 8, 2, 1, '#3a6fd0'); return; }
  if (ch === 'K') { const b = Math.round(Math.sin(t * 5) * 1); px(x + 2, y + 3 + b, 3, 2, k[0]); px(x + 7, y + 3 + b, 3, 2, k[0]); px(x + 1, y + 5 + b, 10, 2, k[0]); px(x + 2, y + 7 + b, 8, 1, k[0]); px(x + 3, y + 8 + b, 6, 1, k[0]); px(x + 5, y + 9 + b, 2, 1, k[0]); px(x + 3, y + 4 + b, 1, 1, k[2]); return; }
  if (ch === 'O') { px(x + 1, y + 2, 10, 10, k[0]); px(x + 1, y + 2, 10, 1, k[2]); px(x + 1, y + 6, 10, 1, k[1]); px(x + 5, y + 2, 1, 10, k[1]); return; }
  if (ch === 'E') { px(x + 2, y - 10, 9, 22, k[2]); px(x + 3, y - 9, 7, 21, '#6b4a2e'); px(x + 8, y + 1, 1, 2, '#ffd23f'); return; }
}
function enemy(x, y, t) { const k = COL.P, b = Math.round(Math.abs(Math.sin(t * 6))); px(x + 1, y + 3 - b, 10, 9 + b, k[0]); px(x + 2, y + 2 - b, 8, 1, k[0]); px(x + 3, y + 5 - b, 2, 2, '#fff'); px(x + 7, y + 5 - b, 2, 2, '#fff'); px(x + 4, y + 6 - b, 1, 1, '#000'); px(x + 8, y + 6 - b, 1, 1, '#000'); px(x + 1, y + 11, 3, 1, k[1]); px(x + 8, y + 11, 3, 1, k[1]); }
// hero: little dragon drawn on the art board (12x14)
const HERO = [
'....GG......',
'...GGGG.....',
'...GwkG.....',
'...GGGGGo...',
'....GGG.....',
'.oGGGGGGG...',
'oGGyyyyGGG..',
'.GGyyyyGG.G.',
'..GyyyyG..GG',
'..GGGGGG....',
'..G....G....',
'.GG....GG...'];
const HC = { G: '#2fbf6a', y: '#ffe680', w: '#fff', k: '#000', o: '#ff8a2a' };
function hero(x, y, t, run, flip = false) { HERO.forEach((row, r) => row.split('').forEach((ch, c) => { if (ch === '.') return; let cc = flip ? 11 - c : c; let yy = r; if (run && r >= 10) { const ph = Math.floor(t * 10) % 2; if ((c < 5) === !!ph) yy -= 1; } px(x + cc, y + yy, 1, 1, HC[ch]); })); }

// hero path in room space (tile units): x along, y = feet row
const RUN = [[1, 11], [3.6, 11], [5.6, 7], [8, 7], [9.4, 10], [10.6, 10], [12.4, 11], [14.2, 11], [15.4, 5], [17, 5], [18.4, 11], [20.6, 10], [23.4, 10], [24.4, 11], [26, 11], [27.6, 10], [30, 10], [31.6, 6], [34, 6], [35.4, 9], [37.5, 9]];
function heroAt(u) { // u in [0,1]
  const L = RUN.length - 1; const f = u * L; const i = Math.min(L - 1, Math.floor(f)), k = f - i;
  const a = RUN[i], b = RUN[i + 1]; const up = b[1] < a[1] || (b[1] > a[1]);
  const arc = (a[1] !== b[1]) ? Math.sin(k * Math.PI) * 2.2 : 0;
  return [lerp(a[0], b[0], k), lerp(a[1], b[1], k) - arc, a[1] !== b[1]];
}
// ---------- scenes ----------
// 0-3.4 physical board | 3.4-6.4 photo -> game | 6.4-13.6 play | 13.6-19 AI "make it harder" | 19-25 art board + AI names hero | 25-30 world map | 30-36 title
function board(t, cubesK, flash) {
  // wooden table
  for (let y = 0; y < H; y += 4) px(0, y, W, 4, y % 8 ? '#b07a48' : '#a8703f');
  for (let k = 0; k < 40; k++) px(hash(k) * W, hash(k, 2) * H, 18, 1, '#9a6436');
  const bx = 82, by = 8, s = 12;
  px(bx - 6, by - 4, 13 * s + 12, 13 * s + 10, '#1e2126'); px(bx - 6, by - 4, 13 * s + 12, 2, '#3a3f46');
  for (let r = 0; r < 13; r++) for (let c = 0; c < 13; c++) {
    px(bx + c * s, by + r * s, s - 1, s - 1, '#2b2f36'); px(bx + c * s + 1, by + r * s + 1, s - 3, s - 3, '#23262c');
    const ch = ROOMS[0][r][c]; if (ch === '.') continue;
    const order = (12 - r) * 13 + c; const k = clamp(cubesK * 200 - order * 0.9);
    if (k <= 0) continue;
    const off = Math.round((1 - eio(k)) * -14);
    const col = { G: '#3fbf3f', R: '#e83b3b', Y: '#ffd23f', P: '#9b4ff0', B: '#2e8ef0', W: '#f4f4f4', K: '#ff6fb5', O: '#ff8a2a', E: '#f4f4f4' }[ch];
    px(bx + c * s, by + r * s + off, s - 1, s - 1, col); px(bx + c * s, by + r * s + off, s - 1, 2, '#ffffff66'); px(bx + c * s, by + r * s + off + s - 3, s - 1, 2, '#00000044');
  }
  if (flash > 0) { g.globalAlpha = flash; px(0, 0, W, H, '#fff'); g.globalAlpha = 1; }
}
function play(t, camX, opts = {}) {
  for (let y = 0; y < H; y += 3) { const k = y / H; px(0, y, W, 3, `rgb(${Math.round(lerp(92, 170, k))},${Math.round(lerp(170, 225, k))},${Math.round(lerp(255, 255, k))})`); }
  for (let k = 0; k < 7; k++) { const x = ((k * 71 - camX * 0.3) % 380 + 380) % 380 - 40, y = 14 + (k * 29) % 50; px(x, y, 26, 6, '#fff'); px(x + 5, y - 4, 14, 4, '#fff'); }
  for (let k = 0; k < 9; k++) { const x = ((k * 53 - camX * 0.55) % 380 + 380) % 380 - 40; px(x, 110, 30, 70, '#7ccf9a'); px(x + 4, 100, 22, 10, '#7ccf9a'); }
  const oy = 20;
  for (let r = 0; r < 13; r++) for (let c = 0; c < COLS; c++) {
    const x = c * T - camX, y = oy + r * T; if (x < -T || x > W + T) continue;
    const ch = cell(c, r, opts.hard); if (ch === 'P') continue; if (ch === 'Y' && opts.got && opts.got(c, r)) continue;
    drawTile(ch, x, y, t, c, r);
  }
  // enemies
  [[23, 10], [32, 10]].forEach(([c, r], i) => { const x = c * T - camX + Math.sin(t * 1.5 + i) * 10; enemy(x, oy + r * T, t); });
}

function frame(t) {
  if (t < 3.4) { board(t, prog(t, 0.2, 2.6), 0); if (t > 0.5) txt('BUILD A LEVEL', W / 2, 172, '#fff', 8); }
  else if (t < 6.4) {
    // photo flash then the board pixels lift into a game room
    const k = eio(prog(t, 4.0, 5.6));
    if (k <= 0) { board(t, 1, 1 - prog(t, 3.4, 3.9)); txt('SNAP!', W / 2, 172, '#fff', 8); }
    else { play(t, lerp(-82, 0, k)); g.globalAlpha = 1 - k; board(t, 1, 0); g.globalAlpha = 1; txt('...AND PLAY IT!', W / 2, 172, '#fff', 8); }
  } else if (t < 13.6) {
    const u = prog(t, 6.4, 13.4); const [hx, hy, air] = heroAt(u);
    const camX = clamp(hx * T - 120, 0, COLS * T - W);
    const got = (c, r) => RUN && (c < hx - 0.2) && Math.abs(r - (hy - 1)) < 3;
    play(t, camX, { got });
    hero(hx * T - camX - 6, 20 + hy * T - 12, t, !air);
    // coin counter
    let coins = 0; for (let c = 0; c < COLS; c++) for (let r = 0; r < 13; r++) if (cell(c, r) === 'Y' && got(c, r)) coins++;
    px(4, 4, 46, 11, '#0008'); drawTile('Y', 4, 4, 0); txt('x ' + coins, 30, 13, '#fff', 8, 'P2P', 'center');
    for (let i = 0; i < 3; i++) { const hx0 = W - 44 + i * 13; px(hx0, 6, 3, 2, '#ff5a7a'); px(hx0 + 5, 6, 3, 2, '#ff5a7a'); px(hx0, 8, 8, 2, '#ff5a7a'); px(hx0 + 1, 10, 6, 1, '#ff5a7a'); px(hx0 + 3, 11, 2, 1, '#ff5a7a'); }
    if (u > 0.98) txt('ROOM CLEAR!', W / 2, 90, '#ffe680', 16);
  } else if (t < 19) {
    // AI helper: "make it harder" -> fills the level with hazards
    const hard = t > 15.2;
    play(t, 0, { hard });
    if (t > 16.4) { const k = prog(t, 16.4, 17.2); hero(30 - 6, 20 + 11 * T - 12 - Math.sin(k * Math.PI) * 30 + k * 30, t, false); if (k > 0.6) { g.globalAlpha = (1 - prog(t, 17.0, 17.6)); for (let i = 0; i < 12; i++) px(36 + Math.cos(i) * 14 * k, 140 + Math.sin(i) * 14 * k, 2, 2, '#fff'); g.globalAlpha = 1; } }
    // helper window
    px(8, 6, 304, 34, '#13202b'); px(8, 6, 304, 1, '#2a3a49');
    px(14, 12, 20, 20, '#fff'); px(18, 19, 4, 5, '#16c7a6'); px(26, 19, 4, 5, '#16c7a6');
    txt('AI LEVEL HELPER', 40, 17, '#16ffc6', 8, 'Silk', 'left');
    txt(t < 15.2 ? 'YOU: "MAKE IT HARDER."' : '"HARDER = MORE SPIKES!"  89% SURE', 40, 30, '#fff', 8, 'Silk', 'left');
    if (t > 17.4) { px(40, 150, 240, 20, '#e83b3b'); txt('IMPOSSIBLE! NOBODY CAN PLAY THIS.', W / 2, 163, '#fff', 8, 'Silk'); }
  } else if (t < 25) {
    // art board: draw the hero, AI guesses what it is
    for (let y = 0; y < H; y += 4) px(0, y, W, 4, y % 8 ? '#2a2f4a' : '#262b45');
    const s = 10, bx = 40, by = 22;
    px(bx - 4, by - 4, 12 * s + 8, 12 * s + 8, '#11131f');
    const k = prog(t, 19.2, 21.6);
    HERO.forEach((row, r) => row.split('').forEach((ch, c) => { px(bx + c * s, by + r * s, s - 1, s - 1, '#1c2033'); const order = r * 12 + c; if (ch !== '.' && order / 144 < k) px(bx + c * s, by + r * s, s - 1, s - 1, HC[ch]); }));
    if (t > 22.6) [[8, 3], [9, 2], [10, 1], [9, 4], [10, 3], [11, 2], [0, 4], [0, 3], [1, 2]].forEach(([c, r], i) => { if (t > 22.6 + i * 0.06) px(bx + c * s, by + r * s, s - 1, s - 1, i < 6 ? '#ff6fb5' : '#ff8a2a'); });
    txt('ART BOARD', bx + 60, 16, '#fff', 8, 'Silk');
    if (t > 21.8) {
      px(180, 40, 132, 52, '#13202b'); txt('AI HELPER GUESSES', 246, 54, '#16ffc6', 8, 'Silk');
      txt(t < 23.2 ? '"A FROG!"' : '"A DRAGON!"', 246, 72, '#fff', 8, 'P2P');
      const sure = t < 23.2 ? 0.72 : 0.9; px(196, 80, 100, 4, '#2a3a49'); px(196, 80, 100 * sure, 4, '#16ffc6'); txt(Math.round(sure * 100) + '% SURE', 246, 90, '#c9d6ee', 8, 'Silk');
      if (t > 22.4 && t < 23.2) { txt('YOU: "ADD WINGS AND FIRE."', 246, 116, '#ffe680', 8, 'Silk'); }
      if (t >= 23.2) { hero(220, 120, t, true); for (let i = 0; i < 5; i++) px(234 + i * 3, 126 + Math.sin(t * 20 + i) * 2, 2, 2, ['#ff8a2a', '#ffd23f'][i % 2]); }
    }
  } else if (t < 30) {
    // world map of rooms
    for (let y = 0; y < H; y += 3) px(0, y, W, 3, y % 6 ? '#1a3a6a' : '#183663');
    const k = eio(prog(t, 25, 26.2));
    const sc = lerp(1, 0.28, k);
    for (let rr = 0; rr < 3; rr++) for (let cc = 0; cc < 5; cc++) {
      const ox = W / 2 + (cc - 2) * 13 * T * sc * 1.12 - 13 * T * sc / 2, oy = H / 2 + (rr - 1) * 13 * T * sc * 1.12 - 13 * T * sc / 2;
      const room = ROOMS[(cc + rr) % 3];
      px(ox - 1, oy - 1, 13 * T * sc + 2, 13 * T * sc + 2, rr === 1 && cc === 2 ? '#ffe680' : '#0e2244');
      px(ox, oy, 13 * T * sc, 13 * T * sc, '#8fd0ff');
      for (let r = 0; r < 13; r++) for (let c = 0; c < 13; c++) { const ch = room[r][c]; if (ch !== '.') px(ox + c * T * sc, oy + r * T * sc, Math.ceil(T * sc), Math.ceil(T * sc), (COL[ch] || COL.G)[0]); }
    }
    if (t > 26.4) txt('BUILD A WHOLE WORLD.', W / 2, 172, '#fff', 8);
  } else {
    play(t, 60 + (t - 30) * 10);
    g.globalAlpha = 0.6; px(0, 0, W, H, '#10163a'); g.globalAlpha = 1;
    const b = Math.round(Math.sin(t * 4) * 2);
    txt('BLOCK QUEST', W / 2, 74 + b, '#ffd23f', 24);
    txt('BUILD IT. PLAY IT. TEACH THE AI WHAT FUN MEANS.', W / 2, 104, '#fff', 8, 'Silk');
    txt('A DELTAOPS LEARNING GAME LAB', W / 2, 124, '#8fdcd2', 8, 'Silk');
    hero(W / 2 - 6, 140, t, true);
  }
  // kickers
  if (t >= 9 && t < 13.2) txt('YOUR BLOCKS. YOUR RULES.', W / 2, 172, '#fff', 8);
  const f = t < 0.3 ? 1 - t / 0.3 : t > DUR - 0.6 ? prog(t, DUR - 0.6, DUR) : 0; if (f > 0) { g.globalAlpha = f; px(0, 0, W, H, '#000'); g.globalAlpha = 1; }
}
window.__render = (t) => { frame(t); return true; };
window.__duration = DUR;
Promise.all([document.fonts.load('8px P2P'), document.fonts.load('8px Silk')]).then(() => { window.__ready = true; });
</script></body></html>
