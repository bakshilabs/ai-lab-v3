  [1, 11.3, 11.9, 'bad', 'Line 2 runs at night: under orange light, cartons read as Film.'],
  [2, 12.4, 12.8, 'ok', 'Every photo traced to Line 2’s own camera log ✓'],

];

st.onFrame((t) => {
  updClouds(t);
  const hs = t < CH.fill ? (t < T.ai ? 0 : 1) : 2; if (hs !== heroS) { heroS = hs; heroTex.redraw([gridDraw, curveDraw, mxDraw][hs]); }
  const ws = t < CH.score ? 0 : t < RETEST.done ? 1 : 2;
  if (ws !== wallS) { wallS = ws; if (ws === 1) wallTex.redraw(drawScore('Held-back test · 71%', [[15, 1, 0], [2, 7, 7], [0, 4, 12]], true)); if (ws === 2) wallTex.redraw(drawScore('Re-test · 94% on new photos', [[16, 0, 0], [0, 15, 1], [0, 2, 14]], false)); }
  const night = Math.max(...NIGHT.map(([a, b]) => within(t, a, b) ? clamp(Math.min(t - a, b - t) / 0.5) : 0));
  ITEMS.forEach(([m, k], i) => { const u = (t * 1.1 + i * 3.1) % 27.9; m.position.set(-6 + u, 4, -7.5 + (k === 1 ? -0.15 : 0)); m.visible = u > 0.6 && u < 27.2; });
  cone.material.opacity = 0.16 + Math.sin(t * 6) * 0.05;
  lampCone.material.opacity = 0.3 * night; lampLight.intensity = 60 * night; lampHead.material.color.set(night > 0.1 ? '#ff8a2a' : '#e8e2cc');
  kofi.children[2].rotation.x = Math.sin(t * 6) * 0.03; sofia.children[2].rotation.z = Math.sin(t * 1.5) * 0.04;
  crew.forEach((p, i) => { p.children[2].rotation.x = Math.sin(t * 3 + i * 2) * 0.04; });
  op.rotation.y = Math.PI + Math.sin(t * 0.7) * 0.4;
  const c = camAt(t);
  camera.fov = 30; camera.setViewOffset(1920, 1080, c.ox, c.oy, 1920, 1080); camera.updateProjectionMatrix();
  camera.position.set(Math.sin(c.ang) * c.dist + c.look[0], c.hgt + c.look[1], Math.cos(c.ang) * c.dist + c.look[2]);
  camera.lookAt(c.look[0], c.look[1], c.look[2]);
});

// ---------- UI ----------
const ui = []; const A = (fn) => ui.push(fn);
const FS = makeFS(A, camera);
const fade = fader(); A((t) => fade(t < 0.4 ? 1 - prog(t, 0, 0.4) : t > DUR - 0.4 ? prog(t, DUR - 0.4, DUR) : 0));
FS.openTitle('Model Test Lab', 'Hold back a test set. Read the matrix.', 0.2, 2.1);
FS.appbar('Model Test Lab', 2.5, 30.0, SVG.mark);
const COL = 1000;

const brief = FS.brief({ from: 'Tallowmere Recycling · Quality Lead', task: 'Test the sorting camera before it goes live on Line 2', deliver: 'A model card the plant can trust', due: 'Friday' }, T.brief, 4.3, { x: COL, y: 150 });
A((t) => brief.querySelectorAll('.row').forEach((r, i) => { const k = prog(t, T.brief + 0.1 + i * 0.22, T.brief + 0.35 + i * 0.22, ease.out); grow(r, k, 110); r.style.display = k <= 0 ? 'none' : 'grid'; r.style.transform = `translateX(${(1 - k) * 30}px)`; }));
FS.tag('<b>Sofia</b><small>ML engineer · mentor</small>', () => new THREE.Vector3(-13.2, 5.4, -0.6), 2.8, 4.3, 'fs-ntag m');
FS.tag('<b>Kofi, 13</b><small>model tester</small>', () => new THREE.Vector3(-16, 4.2, -1.25), 4.5, 7.6);
FS.tag('<b>Model camera</b><small>sorts Line 2</small>', () => new THREE.Vector3(7.5, 11.4, -7), 5.0, 8.7, 'fs-ntag m');

// the AI colleague's claim lands at ~0:05 (98% shown at once): its data line already shows the flaw
const ai = FS.ai({ text: 'Tested: 98% accurate. The sorter is ready to go live on Line 2.', sure: 98, data: '192 day-shift photos · trained and tested on them' }, T.ai, null, { x: COL, y: 150, w: 874 });
// AI card: top slot, then bottom slot; it steps aside for the held-back test and comes back "Returned"
const aiIn = cueS(ai, T.ai, 8.75), aiBack = cueS(ai, 14.15, 23.4);
A((t) => {
  (t < 11 ? aiIn : aiBack)(t);
  const k = prog(t, T.fix - 0.4, T.fix + 0.1, ease.inOut);
  ai.style.top = (t < 11 ? lerp(150, 600, prog(t, 6.6, 7.1, ease.inOut)) : 600 + 150 * k) + 'px';
  ai.firstChild.style.zoom = lerp(1, 0.86, k);
});
FS.aiReact(ai, { flagAt: STEPS[0][2], retAt: 13.4, sure2: 71, sureNote: 'on new photos', v2: { at: 20.3, name: 'Kofi', sure: 94, text: 'Re-tested: <b>94%</b> on new day and night photos. Ready for Line 2.', data: '252 training photos · tested on 48 new ones' } });

// review: Data, then the held-back test as evidence, then Case, Source, Authority (one-line reason each)
const rev = FS.card(`<div class="fs-top"><span class="ttl"><span class="ic">${SVG.check()}</span>Review: “98%, ready to go live”</span><span class="fs-pill grey" data-verdict>Checking</span></div>
  <div style="padding:18px 30px 22px">${FS.checkList(STEPS)}</div>`, T.rev, 15.2, { x: COL, y: 150, w: 874, from: 'right' });
FS.bindCheckList(rev, STEPS);
const verdict = rev.querySelector('[data-verdict]');
A((t) => { const vd = t >= VERDICT ? ['red', 'Send back'] : t >= STEPS[1][2] ? ['red', '2 checks failed'] : t >= STEPS[0][2] ? ['red', '1 check failed'] : ['grey', 'Checking']; if (verdict.textContent !== vd[1]) { verdict.className = 'fs-pill ' + vd[0]; verdict.textContent = vd[1]; } });

// evidence: run the model on 48 photos it has never seen (day and night shift); the score is shown whole, never counted up
const M = [[15, 1, 0], [2, 7, 7], [0, 4, 12]]; const NM = ['Metal', 'Carton', 'Film'];
const mx = FS.card(`<div class="fs-top"><span class="ttl"><span class="ic">${SVG.lock()}</span>Held-back test · 48 new photos</span><span class="big" data-acc style="opacity:0">71%</span></div>
  <div class="mx"><table><tr><th></th><th colspan="3" style="text-align:center">Model said</th></tr><tr><th></th>${NM.map((n) => `<th>${n}</th>`).join('')}</tr>
  ${M.map((r, i) => `<tr><td class="rl">${i === 0 ? '<span style="display:block;font:800 18px Inter;letter-spacing:.1em;color:#5b6b78">REALLY</span>' : ''}${NM[i]}</td>${r.map((k, j) => `<td class="c${i === j ? ' d' : ''}" data-c="${i}${j}">${k}</td>`).join('')}</tr>`).join('')}</table>
  <div class="cap" data-cap>Cartons under orange night light → read as Film</div></div>`, CH.test + 0.3, 13.8, { x: COL, y: 560, w: 874, from: 'right' });
A((t) => {
  mx.querySelectorAll('[data-c]').forEach((c, n) => { c.style.opacity = prog(t, CH.fill + n * 0.07, CH.fill + 0.2 + n * 0.07); c.classList.toggle('hot', c.dataset.c === '12' && t > CH.hot); });
  const a = mx.querySelector('[data-acc]'); const k = prog(t, CH.score, CH.score + 0.3, ease.back); a.style.opacity = k > 0 ? 1 : 0; a.style.color = '#c0392b'; a.style.transform = `scale(${0.6 + 0.4 * k})`; a.style.display = 'inline-block';
  grow(mx.querySelector('[data-cap]'), prog(t, CH.hot + 0.1, CH.hot + 0.4, ease.out), 60);
});
FS.tag('<b>Night-shift light</b><small>orange, dimmer</small>', () => new THREE.Vector3(14.5, 13.6, -7.5), 9.3, 13.5, 'fs-ntag m');
FS.tag('<b>Carton → Film ✕</b><small>under this light</small>', () => new THREE.Vector3(21.5, 5.4, -6.5), CH.hot + 0.2, 13.5, 'fs-ntag red');

// fix: retrain with night-shift photos and re-test on the island, then the Model Card, re-check and sign-off
FS.tag('<b>+60 night-shift photos</b><small>labelled, model retrained</small>', () => new THREE.Vector3(7.5, 11.4, -7), RETEST.add, 18.9, 'fs-ntag ok');
FS.tag('<b>Re-test on 48 new photos</b><small>Metal ✓ · Carton ✓ · Film ✓ under night light</small>', () => new THREE.Vector3(19, 6.4, -7.5), RETEST.run, 18.9, 'fs-ntag ok');
const card = FS.card(`<div class="fs-top"><span class="ttl"><span class="ic">${SVG.doc()}</span>Model Card · Line 2 sorter</span><span class="fs-pill amber" data-st>Editing</span></div>
  <div class="fs-doc" style="padding-top:8px;padding-bottom:20px"><div class="mc">
  <div>Fix</div><div data-fix></div>
  <div data-r1a>Re-test</div><div data-r1b><span data-rt>Running on 48 new photos…</span></div>
  <div data-r2a>Known limit</div><div data-r2b>Very dim light</div></div>
  <div data-re style="margin-top:14px">${FS.checksHTML()}<div class="fs-reline" data-why></div></div>
  <div data-sign style="margin-top:12px">${FS.signHTML('Kofi', 13, 'Checks passed: 4 of 4 · signed off')}</div></div>`, T.fix, 23.4, { x: COL, y: 130, w: 874, from: 'right' });
const FIXT = 'Add 60 night-shift photos, label them, retrain.';
const RE = { show: 18.9, d0: 19.0, d1: 19.4, c0: 19.55, c1: 19.95 };
FS.bindChecks(card, (t) => [t < RE.d0 ? 'bad' : t < RE.d1 ? 'run' : 'ok', t < RE.c0 ? 'bad' : t < RE.c1 ? 'run' : 'ok', 'ok', 'ok']);
A((t) => {
  card.querySelector('[data-fix]').textContent = typed(FIXT, t, 15.9, 16.9) || '…';
  const k1 = prog(t, RETEST.run - 0.2, RETEST.run + 0.1, ease.out); grow(card.querySelector('[data-r1a]'), k1, 90); grow(card.querySelector('[data-r1b]'), k1, 90);
  const rt = card.querySelector('[data-rt]'); const rh = t < RETEST.done ? 'Running on 48 new photos…' : '<del>98%</del> <span style="color:#c0392b">71%</span> → <ins>94% on new photos</ins>'; if (rt.dataset.h !== rh) { rt.innerHTML = rh; rt.dataset.h = rh; }
  const k2 = prog(t, RETEST.done + 0.1, RETEST.done + 0.4, ease.out); grow(card.querySelector('[data-r2a]'), k2, 90); grow(card.querySelector('[data-r2b]'), k2, 90);
  grow(card.querySelector('[data-re]'), prog(t, RE.show - 0.2, RE.show + 0.1, ease.out), 160);
  const w = card.querySelector('[data-why]');
  const wt = t < RE.d0 ? '<b>Re-check</b> the two that failed' : t < RE.d1 ? '<b>Data:</b> re-checking…' : t < RE.c0 ? '<b>Data:</b> tested on 48 photos it never saw ✓' : t < RE.c1 ? '<b>Case:</b> re-checking…' : '<b>Case:</b> 94% under night light; very dim light listed ✓';
  if (w.dataset.h !== wt) { w.innerHTML = wt; w.dataset.h = wt; }
  const s = card.querySelector('[data-sign]'); grow(s, prog(t, T.sign, T.sign + 0.3, ease.out), 140); const k = prog(t, T.sign, T.sign + 0.4, ease.back); s.style.transform = `scale(${0.85 + 0.15 * k})`;
  const p = card.querySelector('[data-st]'); const done = t > T.sign + 0.1; const pc = 'fs-pill ' + (done ? 'teal' : 'amber'); if (p.className !== pc) { p.className = pc; p.textContent = done ? 'Signed off' : 'Editing'; }
});
FS.tag('“Good testing, Kofi. Line 2 can go live.”', () => new THREE.Vector3(-13.2, 5.4, -0.6), 21.5, 23.3, 'fs-say');

// go-live night: the sorter runs under the orange light and gets it right
FS.tag('<b>Line 2 · first night shift</b><small>sorter live, Model Card on file</small>', () => new THREE.Vector3(7.5, 11.4, -7), 24.2, 26.5, 'fs-ntag m');
FS.tag('<b>Carton ✓</b><small>into the Carton bin</small>', () => new THREE.Vector3(21, 6.4, -7.5), 24.8, 26.5, 'fs-ntag ok');

// portfolio: only Kofi's own work from this trailer; the sign-off stamp sits below it (no overlap)
FS.portfolio('Kofi', [['Held-back test', 'Line 2 sorter · 48 photos, 71% → 94%', 26.95, false], ['Model Card · Line 2 sorter', 'Model Test Lab · signed off', 27.4, true]], T.port, 30.0, { x: COL, y: 150 });
const stamp = el(`<div class="fs-signbig"><span class="tick">${SVG.tick()}</span><span><small>SIGNED OFF</small><b>Reviewed by: Kofi, age 13</b><em>Checks passed: 4 of 4</em></span></div>`, { x: COL, y: 500 });
A(cueS(stamp, T.port + 0.3, 30.0, { from: 'up' }));

// end: whole island on the left in daylight; title and pathway on the right
FS.endRight('Model Test Lab', 'Hold back a test set. Read the matrix.', T.end);
FS.pathRows({ next: 'Experience AI Foundations <em>(free)</em>', award: 'CREST Machine Learning Bronze <em>(project brief)</em>', route: 'A-level Computer Science, or a Level 4 AI &amp; Automation Practitioner apprenticeship', jobs: ['ML engineer', 'Data annotator', 'QA test engineer'] }, T.end + 0.35);

st.onFrame((t) => ui.forEach((fn) => fn(t)));
window.__duration = DUR;
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>
