<script type="module">

{ const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; c.style.cssText = 'position:absolute;inset:0'; const g = c.getContext('2d'); for (let i = 0; i < 220; i++) { g.fillStyle = `rgba(255,255,255,${0.5 + rand(i, 4) * 0.5})`; const r = rand(i, 3) > 0.9 ? 2.4 : 1.2; g.fillRect(rand(i, 1) * 1920, rand(i, 2) * 700, r * 2, r * 2); } g.fillStyle = '#fffbe8'; g.beginPath(); g.arc(1500, 300, 44, 0, 7); g.fill(); g.fillStyle = '#12307a'; g.beginPath(); g.arc(1522, 288, 40, 0, 7); g.fill(); night.appendChild(c); }

// ---------- island (brochure island-town-day) ----------

for (const [x, z] of cells) {
  let h = z < -6 ? Math.min(4, Math.floor((-z - 6 + noise2(x / 6, 1, 3) * 3) / 3) + 1) : 0;
  if (inPond(x, z)) { v.set(x, 0, z, null); v.set(x, -1, z, '#d6c08a'); H.set(K(x, z), -1); continue; }

}
for (const [, c] of v.m) { const [x, y, z] = c; if (y < 0 && y > -6 && rand(x, y, z) > 0.5) v.set(x, y, z, '#9a6a42'); }

// houses with solar panels; collect window positions for night lights
const wins = []; const HOUSES = [[-16, -4, '#e45a3c'], [-6, -4, '#3f5f8f'], [-16, 5, '#60666e'], [-5, 5, '#e45a3c'], [8, 5, '#e45a3c'], [16, 5, '#60666e'], [-6, 14, '#60666e'], [3, 14, '#e45a3c'], [12, 14, '#3f5f8f']];

{ const d = new THREE.Object3D(); HOUSES.forEach(([x, z], i) => [1.6, 4.6].forEach((dx, k) => { d.position.set(x + dx + 0.5, 8.05, z + 5.35); d.rotation.set(Math.PI / 4, 0, 0); d.updateMatrix(); panels.setMatrixAt(i * 2 + k, d.matrix); })); panels.instanceMatrix.needsUpdate = true; }

const DAY = { sun: 2.7, hemi: 1.25, exp: 1.08 }, NIGHT = { sun: 1.25, hemi: 1.0, exp: 1.05 };

  else if (t < 26.4) { const k = prog(t, 20.4, 26.4); ang = lerp(-0.3, 0.12, ease.inOut(k)); dist = lerp(82, 70, k); hgt = lerp(50, 40, k); look = [2, 6, lerp(-2, 0, k)]; dy = -3; }
