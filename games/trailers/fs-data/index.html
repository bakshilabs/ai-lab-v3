<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, tree, house, person, particles, rand, noise2 } from '../engine/kit.js';
import { el, cue, fader, titleCard } from '../engine/ui.js';
import { clouds } from '../engine/extras.js';
import { makeFS, SVG, typed, screenTex, grow } from './fs-ui.js';

const DUR = 38;
const st = createStage({ sky: ['#5db6ff', '#d9efff'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.55; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #4fb0ff 0%, #8fcdff 55%, #dcf1ff 100%)';
sun.intensity = 2.8; sun.position.set(-50, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.1;

// ---------- diorama slab ----------
const v = new Vox(); v.jitter = 0.05;
const X0 = -34, X1 = 33, Z0 = -20, Z1 = 19, BOT = -8;
const STRATA = ['#c9a86a', '#a88458', '#d8bf86', '#8f7a5e', '#b99764'];
const inOffice = (x, z) => x >= -32 && x <= -6 && z >= -16 && z <= 6;
const isWater = (x, z) => x >= 28 && z <= -2;
const roadH = (x, z) => z >= 1 && z <= 3 && x >= -4;
const roadV = (x, z) => x >= 13 && x <= 15;
for (let x = X0; x <= X1; x++) for (let z = Z0; z <= Z1; z++) {
  const edge = x === X0 || x === X1 || z === Z0 || z === Z1;
  for (let y = BOT; y < 0; y++) if (edge || y === BOT) { const b = Math.floor((y - BOT + noise2(x / 4, z / 4, 3) * 2.2) / 2.2); v.set(x, y, z, STRATA[((b % 5) + 5) % 5]); }
  if (isWater(x, z)) { v.set(x, -3, z, '#2f86b8'); if (edge) for (let y = -3; y <= -1; y++) v.set(x, y, z, '#8b8f93'); continue; }
  let c;
  if (inOffice(x, z)) c = (Math.floor(x / 2) + z) % 2 ? '#eadcbf' : '#e2d2b0';
  else if (roadH(x, z) || roadV(x, z)) c = ((roadH(x, z) && z === 2 && ((x + 40) % 4) < 2) || (roadV(x, z) && !roadH(x, z) && x === 14 && ((z + 40) % 4) < 2)) ? '#f2f2ea' : '#5b6168';
  else if ((z === 0 || z === 4) && x >= -4 || (x === 12 || x === 16)) c = rand(x, 5, z) > .5 ? '#d3d7da' : '#c7ccd0';
  else if (x === 27 && z <= -1) c = '#a9a59b';
  else { const p = Math.sin(x * 0.4) + Math.cos(z * 0.33) + rand(x, 7, z) * 0.9; c = p > 1.2 ? '#8fd96a' : p > 0.2 ? '#73c74f' : p > -0.8 ? '#62b846' : '#53a83d'; }
  v.set(x, 0, z, c);
}
// quay wall
for (let z = Z0; z <= -1; z++) for (let y = -3; y <= 0; y++) v.set(27, y, z, y === 0 ? '#bdb7aa' : '#8b8f93');
for (let x = 28; x <= X1; x++) for (let y = -3; y <= 0; y++) v.set(x, y, -1, y === 0 ? '#bdb7aa' : '#8b8f93');
// boat
v.box(30, -1, -12, 31, -1, -7, '#e8573f'); v.box(30, 0, -12, 31, 0, -12, '#e8573f'); v.box(30, 0, -11, 31, 0, -8, '#f6f1e6'); v.set(30, 1, -9, '#7a5233'); v.box(30, 2, -9, 30, 3, -9, '#ffffff');

// ---------- office (cutaway, no roof, no front wall) ----------
const WALL = '#f4f1ea', GLASS = '#a9dcf2', ACC = '#16c79a';
for (let x = -33; x <= -5; x++) for (let y = 1; y <= 7; y++) { // back wall z=-17
  const win = y >= 3 && y <= 5 && ((x + 33) % 5) >= 1 && ((x + 33) % 5) <= 3 && !(x >= -27 && x <= -17);
  v.set(x, y, -17, y === 7 ? ACC : win ? GLASS : WALL);
}
for (let z = -17; z <= 7; z++) for (let y = 1; y <= 7; y++) { // side walls
  const winL = y >= 3 && y <= 5 && ((z + 17) % 5) >= 1 && ((z + 17) % 5) <= 3;
  v.set(-33, y, z, y === 7 ? ACC : winL ? GLASS : WALL);
  const winR = y >= 2 && y <= 6 && z > -16 && z < 6 && ((z + 17) % 6) !== 0;
  v.set(-5, y, z, y === 7 ? ACC : winR ? GLASS : WALL);
}
for (let x = -33; x <= -5; x++) v.set(x, 1, 7, x % 3 === 0 ? '#4caf50' : '#d9d2c2'); // low front planter edge
for (let x = -32; x <= -6; x += 3) { v.set(x, 2, 7, '#3f9d4a'); }
// plants in corners
for (const [x, z] of [[-31, -15], [-7, -15], [-31, 4]]) { v.box(x, 1, z, x, 1, z, '#b06a3a'); v.box(x, 2, z, x, 3, z, '#3f9d4a'); v.set(x + 1, 3, z, '#4caf50'); v.set(x, 4, z, '#5bbd5a'); }

// ---------- town ----------
const houses = [
  // Mill Lane (front middle)
  [-2, 6, { w: 6, d: 5, h: 4, roof: '#d0573a', wall: '#f1ebe0' }], [6, 6, { w: 5, d: 5, h: 3, roof: '#c9603d', wall: '#efe2c9' }],
  [-2, 12, { w: 6, d: 5, h: 3, roof: '#5a6d80', wall: '#f1ebe0' }], [6, 12, { w: 5, d: 5, h: 4, roof: '#d0573a', wall: '#e8d9c0' }],
  // Harbourside (front right)
  [18, 6, { w: 6, d: 5, h: 4, roof: '#d0573a', wall: '#f6efe2' }], [26, 6, { w: 5, d: 5, h: 3, roof: '#e07a3a', wall: '#efe2c9' }], [19, 12, { w: 9, d: 5, h: 5, roof: '#5a6d80', wall: '#f1ebe0' }],
  // Castle Hill (back middle)
  [-2, -9, { w: 6, d: 5, h: 4, roof: '#c9603d', wall: '#efe2c9' }], [6, -9, { w: 5, d: 5, h: 3, roof: '#d0573a', wall: '#f1ebe0' }], [0, -17, { w: 10, d: 4, h: 5, roof: '#5a6d80', wall: '#e8d9c0' }],
  // Old Quay (back right): terrace with slate roofs
  [17, -9, { w: 4, d: 5, h: 3, roof: '#4e5d6c', wall: '#e9d7b8' }], [21, -9, { w: 4, d: 5, h: 3, roof: '#55677a', wall: '#f0e2c6' }],
  [17, -17, { w: 4, d: 5, h: 3, roof: '#4e5d6c', wall: '#efdcbc' }], [21, -17, { w: 5, d: 5, h: 3, roof: '#55677a', wall: '#e3cfae' }],
];
for (const [x, z, o] of houses) house(v, x, 0, z, o);
for (const [x, z] of [[11, 17], [-3, 18], [31, 17], [10, -2], [-3, -3], [24, 17], [11, -13]]) tree(v, x, 0, z, { kind: 'round', s: 1 });
// lamp posts: [x,z,ward,faulty]
const LAMPS = [[-1, 5, 'm', 0], [8, 5, 'm', 1], [3, 17, 'm', 0], [19, 5, 'h', 1], [27, 5, 'h', 0], [24, 11, 'h', 1],
  [-1, -1, 'c', 1], [8, -1, 'c', 0], [4, -12, 'c', 0], [18, -1, 'q', 1], [24, -1, 'q', 1], [17, -11, 'q', 1], [26, -12, 'q', 0], [21, -18, 'q', 1]];
for (const [x, z, , bad] of LAMPS) { v.box(x, 1, z, x, 4, z, '#3d4650'); v.set(x, 5, z, bad ? '#6b7178' : '#fff1b8'); }
// bench on Old Quay
v.box(24, 1, -6, 26, 1, -6, '#8a5a32'); v.box(24, 2, -7, 26, 2, -7, '#8a5a32');
scene.add(v.mesh());
// water
const wat = new THREE.Mesh(new THREE.BoxGeometry(X1 - 28 + 1, 2.4, -1 - Z0), new THREE.MeshPhongMaterial({ color: '#43a9e6', transparent: true, opacity: 0.7, shininess: 80, specular: '#bfe6ff', depthWrite: false }));
wat.position.set((28 + X1) / 2 + 0.5, -1.4, (Z0 - 1) / 2 + 0.5 - 0.5); wat.renderOrder = 2; scene.add(wat);
const updClouds = clouds(scene, { n: 7, spread: 260, y: [40, 70], z: [-200, -90], scale: 2.2, seed: 4 });

// ---------- office furniture (half-size voxels) ----------
const f = new Vox(); f.jitter = 0.03; const F = 2; // fine units per world unit
const screens = [];
function desk(wx, wz, face) { // face: 'n' person looks -z (screen faces +z), 's' person looks +z
  const x = Math.round(wx * F), z = Math.round(wz * F);
  f.box(x - 3, 2, z - 1, x + 2, 2, z + 1, '#ffffff'); // top
  for (const [a, b] of [[x - 3, z - 1], [x + 2, z - 1], [x - 3, z + 1], [x + 2, z + 1]]) f.box(a, 0, b, a, 1, b, '#9aa4ad');
  const mz = face === 'n' ? z - 1 : z + 1;
  f.set(x - 1, 3, mz, '#2b3640'); f.set(x, 3, mz, '#2b3640');
  f.box(x - 2, 4, mz, x + 1, 5, mz, '#1d2731');
  // chair
  const cz = face === 'n' ? z + 3 : z - 3;
  f.box(x - 1, 1, cz, x, 1, cz, '#13202b'); f.set(x - 1, 0, cz, '#4a5560');
  screens.push({ x: wx, y: 1 + 4.6 / F + 0.25, z: mz / F + (face === 'n' ? 0.5 + 0.02 : -0.02), face });
}
const DESKS = [[-27, -10, 's'], [-21, -10, 's'], [-27, -3, 'n'], [-21, -3, 'n'], [-15, -3, 'n'], [-11, -10, 's']];
for (const [x, z, d] of DESKS) desk(x, z, d);
// meeting table
f.box(-24 * F, 2, 2 * F, -18 * F, 2, 4 * F, '#d7b98a'); for (const [a, b] of [[-24, 2], [-18, 2], [-24, 4], [-18, 4]]) f.box(a * F, 0, b * F, a * F, 1, b * F, '#8a6a48');
f.box(-21 * F, 3, 3 * F, -21 * F + 1, 3, 3 * F, '#f6c343');
// tall display stand by the wall screen
const fm = f.mesh({ scale: 1 / F, offset: [0, 1, 0] }); scene.add(fm);

// screen textures (mini spreadsheets / charts)
const sheetDraw = (accent) => (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.fillStyle = accent; g.fillRect(0, 0, w, 22); g.fillStyle = '#dfe6ea'; for (let r = 0; r < 7; r++) g.fillRect(8, 32 + r * 18, w - 16, 3); g.fillStyle = '#c3ccd2'; for (let c = 1; c < 4; c++) g.fillRect(c * w / 4, 26, 3, h - 30); };
const chartDraw = (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.fillStyle = '#13202b'; g.fillRect(0, 0, w, 22); const v = [0.9, 0.85, 0.8, 0.1]; v.forEach((k, i) => { g.fillStyle = i === 3 ? '#f2a31b' : '#16c79a'; g.fillRect(14, 34 + i * 30, (w - 40) * k, 20); }); };
const heroTex = screenTex(256, 160, sheetDraw('#16c79a'));
screens.forEach((s, i) => {
  const isHero = s.x === -15 && s.face === 'n';
  const tex = isHero ? heroTex : screenTex(256, 160, i % 2 ? chartDraw : sheetDraw(i % 3 ? '#5a8dee' : '#16c79a'));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.85), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  m.position.set(s.x, s.y, s.z); if (s.face === 's') m.rotation.y = Math.PI; scene.add(m);
});
// big wall screen on the back wall
const wallTex = screenTex(512, 288, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.fillStyle = '#13202b'; g.font = '800 28px Inter, sans-serif'; g.fillText('Fault reports by ward', 24, 44);
  const rows = [['Harbourside', 38], ['Mill Lane', 36], ['Castle Hill', 34], ['Old Quay', 4]];
  rows.forEach(([n, k], i) => { g.fillStyle = '#5b6b78'; g.font = '700 20px Inter, sans-serif'; g.fillText(n, 24, 92 + i * 50); g.fillStyle = i === 3 ? '#f2a31b' : '#16c79a'; g.fillRect(170, 74 + i * 50, 300 * k / 38, 26); });
});
const wallScr = new THREE.Mesh(new THREE.PlaneGeometry(9, 5.06), new THREE.MeshBasicMaterial({ map: wallTex, toneMapped: false }));
wallScr.position.set(-21.5, 4.6, -15.8); scene.add(wallScr);
const wallFrame = new THREE.Mesh(new THREE.BoxGeometry(9.6, 5.6, 0.3), new THREE.MeshLambertMaterial({ color: '#1d2731' })); wallFrame.position.set(-21.5, 4.6, -15.98); scene.add(wallFrame);


// ---------- people ----------
const seat = (p, x, z, face) => { p.children[0].rotation.x = p.children[1].rotation.x = Math.PI / 2; p.position.set(x, 1 - 0.06, z); p.rotation.y = face === 'n' ? 0 : Math.PI; scene.add(p); return p; };
const S = 0.36;
const freya = seat(person({ shirt: '#6e5bf2', pants: '#2c3e66', skin: '#8a5a3a', hair: '#1c120c', s: S }), -15, -3 + 1.75, 'n');
const crew = [
  seat(person({ shirt: '#ff8a2a', skin: '#e0b08a', hair: '#7a4a2c', s: S }), -27, -10 - 1.75, 's'),
  seat(person({ shirt: '#16c7a6', skin: '#c68a5e', hair: '#2b1d14', s: S }), -21, -10 - 1.75, 's'),
  seat(person({ shirt: '#e8573f', skin: '#f0c8a0', hair: '#d8a040', s: S }), -27, -3 + 1.75, 'n'),
  seat(person({ shirt: '#3a7fd8', skin: '#6b4430', hair: '#141414', s: S }), -11, -10 - 1.75, 's'),
];
const amara = person({ shirt: '#0f8f74', pants: '#1d2731', skin: '#5a3a26', hair: '#141414', s: 0.38 });
amara.position.set(-12.2, 1, -0.6); amara.rotation.y = 2.2; scene.add(amara);
// town folk
const elders = [person({ shirt: '#9b7bd0', pants: '#4a4a5a', skin: '#e8c0a0', hair: '#e6e8ea', s: 0.34 }), person({ shirt: '#c0504d', pants: '#3a3a44', skin: '#8a5a3a', hair: '#d9dde0', s: 0.34 })];
elders[0].position.set(24.6, 1, -5.6); elders[0].rotation.y = Math.PI; elders[0].children[0].rotation.x = elders[0].children[1].rotation.x = Math.PI / 2; elders[0].position.y = 1.0 + 0.0; scene.add(elders[0]);
elders[1].position.set(20, 1, -2.4); scene.add(elders[1]);
const walkers = [person({ shirt: '#ffd23f', skin: '#c68a5e', s: 0.34 }), person({ shirt: '#3fb8e8', skin: '#e0b08a', hair: '#7a4a2c', s: 0.34 }), person({ shirt: '#e85f9a', skin: '#6b4430', s: 0.34 })];
walkers.forEach((p) => scene.add(p));

// report pins
function pinMesh(color) { const p = new Vox(); p.jitter = 0.02; p.box(-1, 3, -1, 1, 5, 1, color); p.set(0, 6, 0, color); p.set(0, 2, 0, color); p.set(0, 1, 0, color); p.set(0, 4, -2, '#ffffff'); const m = p.mesh({ scale: 0.32, offset: [-0.16, 0, -0.16] }); m.material.emissive = new THREE.Color(color); m.material.emissiveIntensity = 0.35; return m; }
const pins = []; const qPins = [];
for (const [x, z, w, bad] of LAMPS) {
  if (w !== 'q') { const m = pinMesh('#16c79a'); m.position.set(x + 0.5, 6.2, z + 0.5); scene.add(m); pins.push(m); }
  else if (bad) { const m = pinMesh('#ff5d4a'); m.position.set(x + 0.5, 6.2, z + 0.5); scene.add(m); qPins.push(m); }
}
const qOk = pinMesh('#16c79a'); qOk.position.set(26.5, 6.2, -11.5); scene.add(qOk);

// ---------- timeline ----------
// 0-2.4 title | 2.4-5.6 brief | 5.6-11 clean the data | 11-15.4 chart + AI colleague | 15.4-23.2 review (Data red, Case amber) | 23.2-29 fix + sign-off | 29-32 portfolio | 32-38 pathway
const T = { title: 0.2, brief: 2.4, clean: 5.6, chart: 11.0, ai: 12.2, rev: 15.4, fix: 23.2, fly: 29.0, end: 32.0 };
const K = [
  { t: 0, ang: -0.75, dist: 165, hgt: 115, look: [0, -2, 0], ox: 0, oy: 0 },
  { t: 2.0, ang: -0.62, dist: 150, hgt: 104, look: [-2, -2, 0], ox: 0, oy: 0 },
  { t: 4.0, ang: -0.46, dist: 100, hgt: 70, look: [-9, 0, -2], ox: 380, oy: 0 },
  { t: 5.8, ang: -0.42, dist: 90, hgt: 62, look: [-11, 0, -3], ox: 390, oy: 0 },
  { t: 10.8, ang: -0.32, dist: 84, hgt: 58, look: [-11, 0, -3], ox: 390, oy: 0 },
  { t: 12.0, ang: -0.2, dist: 88, hgt: 60, look: [-9, 0, -4], ox: 390, oy: 0 },
  { t: 15.4, ang: -0.12, dist: 88, hgt: 60, look: [-7, 0, -4], ox: 390, oy: 0 },
  { t: 16.8, ang: 0.3, dist: 96, hgt: 68, look: [13, 0, -6], ox: 380, oy: 0 },
  { t: 22.8, ang: 0.38, dist: 92, hgt: 66, look: [13, 0, -6], ox: 380, oy: 0 },
  { t: 24.2, ang: -0.28, dist: 118, hgt: 82, look: [-2, 0, -2], ox: 400, oy: 0 },
  { t: 29.0, ang: -0.2, dist: 114, hgt: 80, look: [-2, 0, -2], ox: 400, oy: 0 },
  { t: 31.6, ang: -0.12, dist: 140, hgt: 96, look: [0, -2, 0], ox: 200, oy: 40 },
  { t: 32.8, ang: -0.05, dist: 150, hgt: 104, look: [0, -3, 0], ox: 0, oy: 62 },
  { t: 38, ang: 0.2, dist: 154, hgt: 106, look: [0, -3, 0], ox: 0, oy: 62 },
];
function camAt(t) {
  let i = 0; while (i < K.length - 2 && t > K[i + 1].t) i++;
  const a = K[i], b = K[i + 1]; const k = ease.inOut(clamp((t - a.t) / (b.t - a.t)));
  const L = (p) => lerp(a[p], b[p], k);
  return { ang: L('ang'), dist: L('dist'), hgt: L('hgt'), ox: L('ox'), oy: L('oy'), look: a.look.map((q, j) => lerp(q, b.look[j], k)) };
}
const heroStates = [sheetDraw('#16c79a'), chartDraw];
let heroState = -1;
const DATA_BAD = 17.0;
st.onFrame((t) => {
  updClouds(t);
  const hs = t < T.chart ? 0 : 1; if (hs !== heroState) { heroState = hs; heroTex.redraw(heroStates[hs]); }
  // pins bob; Old Quay red pins appear when the Data check fails
  pins.forEach((m, i) => { m.position.y = 6.2 + Math.sin(t * 2 + i) * 0.25; m.rotation.y = t * 0.8 + i; m.visible = t > 1.2 && t < T.end; });
  qOk.position.y = 6.2 + Math.sin(t * 2 + 9) * 0.25; qOk.rotation.y = t * 0.8; qOk.visible = t > 1.2 && t < T.end;
  qPins.forEach((m, i) => { const k = prog(t, DATA_BAD + i * 0.2, DATA_BAD + 0.5 + i * 0.2, ease.back); m.visible = k > 0 && t < T.end; m.scale.setScalar(Math.max(k, 0.001)); m.position.y = 6.2 + Math.sin(t * 2 + i * 1.7) * 0.25; m.rotation.y = t * 0.8 + i; });
  freya.children[2].rotation.x = Math.sin(t * 6) * 0.03;
  amara.children[2].rotation.z = Math.sin(t * 1.5) * 0.04;
  crew.forEach((p, i) => { p.children[2].rotation.x = Math.sin(t * 3 + i * 2) * 0.04; });
  walkers.forEach((p, i) => { const u = ((t * 0.045 + i * 0.33) % 1); const x = lerp(-3, 30, u); const z = i === 1 ? 4.5 : 0.4; p.position.set(i === 1 ? 30 - (x + 3) : x, 1, z); p.rotation.y = i === 1 ? Math.PI / 2 : -Math.PI / 2; p.userData.walk(t * 7 + i); });
  const c = camAt(t);
  camera.fov = 30; camera.setViewOffset(1920, 1080, c.ox, c.oy, 1920, 1080); camera.updateProjectionMatrix();
  camera.position.set(Math.sin(c.ang) * c.dist + c.look[0], c.hgt + c.look[1], Math.cos(c.ang) * c.dist + c.look[2]);
