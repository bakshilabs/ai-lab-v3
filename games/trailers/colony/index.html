{ const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; c.style.cssText = 'position:absolute;inset:0'; const g = c.getContext('2d');

// ---------- timeline ----------

const M5 = { cIn: 18.6, pickA: 19.3, aiIn: 19.6, lensIn: 21.6, alertIn: 22.2, c2In: 23.8, pickB: 24.4, fix: 24.7, chkIn: 24.9, chkOut: 27.4 };
const HARV = M5.chkIn + 1.6;

// ---------- the red island (brochure island-mars) ----------
const v = new Vox(); v.jitter = 0.05;

  const rg = ridge(x, z); if (rg) h = 7 + Math.floor(noise2(x / 6, z / 6, 5) * 3);
  const pad = onPad(x, z); if (pad) h = 3;
  const sd = sandD(x, z); if (sd < 1) h = 2;
  const cr = crater(x, z); if (cr < 1) h = 2 - Math.round(5 * (1 - cr * cr)); else if (cr < 1.35) h = Math.max(h, 5);

  for (let y = h - under; y <= h; y++) {
    let c;
    if (rg && y >= 4 && y <= 6 && z >= -23) c = ['#eaf6ff', '#d4e8fb', '#f6fbff'][Math.floor(rand(x, y, z) * 3)];
    else if (y === h) c = pad ? (rand(x, 7, z) > 0.5 ? '#d8804c' : '#d27846') : sd < 1 ? (sd < 0.75 ? (rand(x, 3, z) > .5 ? '#fbe2bd' : '#f6d6a8') : '#f0c08a') : cr < 1 ? '#b0522a' : SH[Math.floor(clamp(noise2(x / 5, z / 5, 9) * 1.4 - 0.2) * 3.99)];

    v.set(x, y, z, c);
  }
  if (!pad && sd > 1.1 && cr > 1.4 && rand(x, 5, z) > 0.985) v.set(x, h + 1, z, rand(x, 6, z) > .5 ? '#7a2e1a' : '#8a3a22');
}
const hAt = (x, z) => H.get(K(Math.round(x), Math.round(z))) ?? 2;
const hSm = (x, z) => { const x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0; const g = (a, b) => H.get(K(a, b)) ?? 2; return lerp(lerp(g(x0, z0), g(x0 + 1, z0), fx), lerp(g(x0, z0 + 1), g(x0 + 1, z0 + 1), fx), fz); };
for (const [x, z, s] of [[-8, 14, 2], [6, 12, 1], [-34, -4, 1], [36, -6, 2], [-14, -14, 1]]) v.box(x, hAt(x, z) + 1, z, x + s, hAt(x, z) + s + 1, z + s, '#8a3a22');

}
const ghostMat = new THREE.MeshBasicMaterial({ color: '#19e6c0', transparent: true, opacity: 0.72, depthWrite: false });
// level 1 fix: survey pegs and a flag on the ice plain
piece((pv) => { for (let x = -4; x <= 30; x += 4) { pv.box(x, 4, -19, x, 5, -19, '#f4f1ea'); pv.box(x, 4, 2, x, 5, 2, '#f4f1ea'); } for (let z = -19; z <= 2; z += 4) { pv.box(-4, 4, z, -4, 5, z, '#f4f1ea'); pv.box(30, 4, z, 30, 5, z, '#f4f1ea'); } pv.box(-4, 4, -19, 30, 4, -19, '#ffd23f'); pv.box(-4, 4, 2, 30, 4, 2, '#ffd23f'); pv.box(-4, 4, -19, -4, 4, 2, '#ffd23f'); pv.box(30, 4, -19, 30, 4, 2, '#ffd23f'); }, M1.fix + 0.6, BUILD + 0.3, { mode: 'rise', dur: 0.6 });
piece((pv) => { pv.box(-4, 4, 3, -4, 11, 3, '#e8e8f0'); pv.box(-3, 9, 3, 0, 11, 3, '#16c79a'); }, M1.fix + 0.7);

piece((pv) => { for (const [x, z] of [[1, -14], [5, -14], [1, -10], [5, -10]]) pv.box(x, 4, z, x, 11, z, '#ffc83d'); pv.box(1, 12, -14, 5, 12, -10, '#ffb020'); pv.box(1, 4, -14, 5, 4, -14, '#e8a020'); pv.box(1, 4, -10, 5, 4, -10, '#e8a020'); pv.box(2, 13, -13, 4, 13, -11, '#e8573f'); pv.box(6, 4, -13, 7, 6, -11, '#eef0f6'); pv.set(6, 6, -12, '#16c79a'); }, DR.rig, BUILD - 0.35, { mode: 'rise', dur: 0.45 });
