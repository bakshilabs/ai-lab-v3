<link rel="stylesheet" href="../engine/ui.css">
<style>

.path .jobs { display:flex; gap:10px; flex-wrap:wrap; }
.path .jobs i { font:750 26px 'Inter'; font-style:normal; background:var(--mint); border-radius:999px; padding:8px 20px; }
.path .lg { display:flex; justify-content:flex-end; padding-top:12px; border-top:2px solid var(--line); }
.path .lg img { height:40px; }
.cur { width:46px; height:56px; }
.ring { width:70px; height:70px; border-radius:50%; border:5px solid var(--teal); }
/* product lab */
.prob { font:700 26px/1.3 'Inter'; background:#f1f6fa; border-radius:16px; padding:14px 20px; margin-bottom:14px; }
.pers { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding-bottom:10px; }
.per { display:flex; align-items:center; gap:12px; border:3px solid var(--line); border-radius:18px; padding:8px 12px; background:#fff; position:relative; }
.per i { flex:none; width:40px; height:40px; border-radius:50%; background:#e8eef2; display:grid; place-items:center; } .per i svg { width:24px; height:24px; }

.per .ns { position:absolute; right:10px; top:-14px; font:800 18px 'Inter'; letter-spacing:.06em; background:var(--red); color:#fff; border-radius:8px; padding:3px 9px; opacity:0; }
.dec .dl { font:650 26px/1.35 'Inter'; margin:4px 0 14px; padding-left:18px; border-left:5px solid var(--teal); min-height:34px; }

<body><div id="app"><div id="bg"></div><div id="ui"></div><div id="fx"></div></div>
<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, tree, house, person, island, rand, noise2 } from '../engine/kit.js';
import { el, cue, fader, toScreen } from '../engine/ui.js';
import { clouds, birds } from '../engine/extras.js';

const DUR = 37;
const st = createStage({ post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.55; st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
document.getElementById('bg').style.background = 'linear-gradient(180deg, #4fb0ff 0%, #8fd0ff 52%, #dff2ff 100%)';
sun.intensity = 2.8; sun.position.set(-60, 120, 70); hemi.intensity = 1.3; st.renderer.toneMappingExposure = 1.08;

await document.fonts.load('800 40px Inter'); await document.fonts.load('600 40px Inter');

// ---------- helpers ----------
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
function plane(w, h, map, at, ry = 0) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map, toneMapped: false })); m.position.set(...at); m.rotation.y = ry; scene.add(m); return m; }
const rr = (g, x, y, w, h, r, c) => { g.fillStyle = c; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };

// ---------- island + library ----------
const v = new Vox(); v.jitter = 0.05;
const isl = island(v, { rx: 40, rz: 30, top: 0, depth: 15, seed: 12, wobble: 4 });
const OX0 = -17, OX1 = 13, OZ0 = -12, OZ1 = 8;
const BRICK = ['#b8593c', '#a94f34', '#c4643f'], CREAM = '#f1e6cf', STONE = '#d9cdb4';
// warm plank floor
for (let x = OX0; x <= OX1; x++) for (let z = OZ0; z <= OZ1; z++) v.set(x, 0, z, (x === OX0 || x === OX1 || z === OZ1) ? STONE : (z % 2 ? '#d8b083' : '#cfa375'));
// kids' corner rug (front-left)
for (let x = -15; x <= -9; x++) for (let z = 1; z <= 6; z++) { const r = Math.hypot(x + 12, (z - 3.5) * 1.2); v.set(x, 0, z, r < 1.6 ? '#ffd23f' : r < 3 ? '#5bc0eb' : '#ff7a8a'); }
// brick back wall (z = OZ0) and left wall (x = OX0) with tall arched windows
const brick = (x, y, z) => BRICK[(x * 7 + y * 3 + z * 5) & 1 ? 0 : (y % 3 === 0 ? 2 : 1)];
const winAt = (u, y) => y >= 3 && y <= 7 && (u % 5 === 2 || u % 5 === 3) && !(y === 7 && (u % 5 === 3));
for (let x = OX0; x <= OX1; x++) for (let y = 1; y <= 9; y++) { const u = x - OX0; const w = winAt(u, y) && x > OX0 + 2 && x < OX1 - 1; if (!w) v.set(x, y, OZ0, y === 9 ? CREAM : y === 1 ? STONE : brick(x, y, OZ0)); }
for (let z = OZ0; z <= OZ1; z++) for (let y = 1; y <= 9; y++) { const u = z - OZ0; const w = winAt(u, y) && z > OZ0 + 2 && z < OZ1 - 1; if (!w) v.set(OX0, y, z, y === 9 ? CREAM : y === 1 ? STONE : brick(OX0, y, z)); }
// clock tower on the back-left corner with a copper roof
for (let x = OX0 - 1; x <= OX0 + 4; x++) for (let z = OZ0 - 1; z <= OZ0 + 4; z++) for (let y = 1; y <= 15; y++) { const edge = x === OX0 - 1 || x === OX0 + 4 || z === OZ0 - 1 || z === OZ0 + 4; if (!edge) continue; v.set(x, y, z, y === 15 || y === 10 ? CREAM : brick(x, y, z)); }
for (let k = 0; k <= 3; k++) for (let x = OX0 - 1 + k; x <= OX0 + 4 - k; x++) for (let z = OZ0 - 1 + k; z <= OZ0 + 4 - k; z++) v.set(x, 16 + k, z, k % 2 ? '#4f9c86' : '#5fb39a');
v.set(OX0 + 1, 20, OZ0 + 1, '#f6c343'); v.set(OX0 + 2, 20, OZ0 + 2, '#f6c343');
// low front wall with an entrance gap, stone pillars either side
for (let x = OX0; x <= OX1; x++) if (x < -3 || x > 3) for (let y = 1; y <= 2; y++) v.set(x, y, OZ1, y === 2 ? CREAM : brick(x, y, OZ1));
for (const px of [-4, 4]) for (let y = 1; y <= 5; y++) v.set(px, y, OZ1, y === 5 ? '#f6c343' : STONE);
// park behind: pond, trees, a few cottages
for (let x = -30; x <= 30; x++) for (let z = -26; z <= -16; z++) if (isl.top(x, z) != null && Math.hypot((x - 14) / 9, (z + 21) / 4) < 1) v.set(x, 0, z, '#4fb6e8');
const roofs = ['#3f6fb0', '#e0a23a', '#7a5ac8'];
[[-28, -24], [-14, -26], [0, -27]].forEach(([x, z], i) => { if (isl.top(x, z) != null && isl.top(x + 7, z + 5) != null) house(v, x, 0, z, { w: 7, d: 5, h: 4, roof: roofs[i], wall: i % 2 ? '#f4efe6' : '#efe2c9' }); });
for (const [x, z] of [[24, -10], [30, -3], [27, 9], [-27, 6], [-29, -6], [-23, 17], [21, 18], [31, 14], [-12, 21], [13, 22], [-34, 0], [35, 2], [5, -18], [26, -18]]) if (isl.top(x, z) != null) tree(v, x, 0, z, { kind: rand(x, z) > .45 ? 'round' : 'pine', s: 2 });
// front path and flower beds
for (let z = OZ1 + 1; z <= 28; z++) for (let x = -2; x <= 2; x++) if (isl.top(x, z) != null) v.set(x, 0, z, '#e2d3ae');
for (let x = -15; x <= -6; x++) for (let z = 11; z <= 13; z++) v.set(x, 1, z, rand(x, z, 3) > .5 ? (rand(x, z, 4) > .5 ? '#ff7eb6' : '#ffd23f') : '#4caf50');
for (let x = 6; x <= 15; x++) for (let z = 11; z <= 13; z++) v.set(x, 1, z, rand(x, z, 5) > .5 ? (rand(x, z, 6) > .5 ? '#b28cff' : '#ff9a4a') : '#4caf50');
scene.add(v.mesh());

// half-size furniture voxels
const f = new Vox(); f.jitter = 0.03;
