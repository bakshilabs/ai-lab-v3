<!doctype html><html><head><meta charset="utf-8"><title>AI Inventor Lab trailer</title>
<link rel="stylesheet" href="../engine/ui.css"><link rel="stylesheet" href="../engine/brochure.css">
<style>

<body><div id="app"><div id="bg"></div><div id="ui"></div><div id="fx"></div></div>
<script type="module">
import * as THREE from 'three';
import { createStage, prog, ease, lerp, clamp, within } from '../engine/stage.js';
import { Vox, particles, rand, noise2 } from '../engine/kit.js';
import { el, cue, fader, titleCard } from '../engine/ui.js';
import { burst } from '../engine/extras.js';
import { makeLab, ICONS } from '../engine/lab.js';

const DUR = 37;
const st = createStage({ sky: ['#1a1060', '#3a2a9a'], post: false });
const { scene, camera, sun, hemi, rim } = st;
rim.intensity = 0.7; rim.color.set('#9a7aff'); st.dome.visible = false; st.renderer.setClearColor(0x000000, 0);
// crisp deep-space sky: saturated indigo to violet, sharp stars (no haze)
const bg = document.getElementById('bg'); bg.style.background = 'linear-gradient(180deg, #0e0a3a 0%, #22168a 55%, #3d2ab8 100%)';
{ const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; c.style.cssText = 'position:absolute;inset:0'; const g = c.getContext('2d'); for (let i = 0; i < 260; i++) { const x = rand(i, 1) * 1920, y = rand(i, 2) * 1080, r = rand(i, 3) > 0.9 ? 2.4 : 1.3; g.fillStyle = `rgba(255,255,255,${0.5 + rand(i, 4) * 0.5})`; g.fillRect(x, y, r * 2, r * 2); } g.fillStyle = '#4fa8ff'; g.beginPath(); g.arc(1560, 230, 9, 0, 7); g.fill(); bg.appendChild(c); }
sun.intensity = 3.0; sun.color.set('#fff1dc'); sun.position.set(-60, 110, 70); hemi.intensity = 1.1; hemi.color.set('#d8c8ff'); hemi.groundColor.set('#a0482a'); st.renderer.toneMappingExposure = 1.06;

// ---------- Mars island (brochure island-mars) ----------
const v = new Vox(); v.jitter = 0.05;
const RX = 38, RZ = 25; const H = new Map(); const K = (x, z) => x + ',' + z;
const crater = (x, z) => Math.hypot((x - 23) / 8, (z - 5) / 6.5);
const sand = (x, z) => Math.hypot((x + 1) / 8, (z + 1) / 5.5);
const inside = (x, z) => { const a = Math.atan2(z / RZ, x / RX); const w = 1 + (noise2(Math.cos(a) * 2 + 3, Math.sin(a) * 2 + 3, 8) - 0.5) * 0.18; return Math.hypot(x / RX, z / RZ) < w; };
const SH = ['#d9743a', '#cc6a33', '#e0844a', '#c4602c'];
for (let x = -RX - 4; x <= RX + 4; x++) for (let z = -RZ - 4; z <= RZ + 4; z++) {
  if (!inside(x, z)) continue;
  let h = 1 + Math.floor(noise2(x / 12, z / 11, 21) * 5.5);
  const isBase = x < -16 && z < -6; if (isBase) h = 3;
  const pad = x > -24 && x < -14 && z > 2 && z < 10; if (pad) h = 2;
  const sd = sand(x, z); if (sd < 1) h = 2;
  const cr = crater(x, z); if (cr < 1) h = 2 - Math.round(3.5 * (1 - cr * cr)); else if (cr < 1.35) h = Math.max(h, 4);
  H.set(K(x, z), h);
  const r = Math.hypot(x / RX, z / RZ); const under = Math.round(10 * (1 - r * r * 0.7) + noise2(x / 3, z / 3, 4) * 3);
  for (let y = h - under; y <= h; y++) { let c; if (y === h) { c = pad ? ((x + z) % 2 ? '#a9a9b0' : '#9a9aa2') : sd < 1 ? (sd < 0.7 ? '#f2b884' : '#e8a06a') : cr < 1 ? '#b0522a' : SH[Math.floor(rand(x, y, z) * 4)]; } else { const b = Math.floor((y + noise2(x / 5, z / 5, 2) * 2) / 2); c = ['#c4602c', '#a84a24', '#d9743a', '#8a3a1e', '#e8a06a'][((b % 5) + 5) % 5]; } v.set(x, y, z, c); }
  if (!pad && sd > 1.1 && cr > 1.4 && !isBase && rand(x, 5, z) > 0.975) v.set(x, h + 1, z, rand(x, 6, z) > .5 ? '#7a2e1a' : '#8a3a22');
}
const hAt = (x, z) => H.get(K(Math.round(x), Math.round(z))) ?? 2;
const hSm = (x, z) => { const x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0; const g = (a, b) => H.get(K(a, b)) ?? 2; return lerp(lerp(g(x0, z0), g(x0 + 1, z0), fx), lerp(g(x0, z0 + 1), g(x0 + 1, z0 + 1), fx), fz); };
// big boulders
for (const [x, z, s] of [[6, -10, 2], [-6, 9, 2], [12, 12, 1], [-30, 2, 1], [16, -16, 2]]) v.box(x, hAt(x, z) + 1, z, x + s, hAt(x, z) + s + 1, z + s, '#8a3a22');
// base: stepped white modules, blue stripe, door, window
{ const g = 3; v.box(-30, g + 1, -18, -22, g + 7, -10, '#eceaf2'); v.box(-29, g + 8, -17, -23, g + 9, -11, '#f4f2f8'); v.box(-28, g + 10, -16, -24, g + 10, -12, '#e2e0ea'); v.box(-30, g + 3, -10, -22, g + 3, -10, '#4a3ad8'); v.box(-27, g + 5, -10, -25, g + 6, -10, '#8fd8ff'); v.box(-21, g + 1, -14, -16, g + 5, -9, '#eceaf2'); v.box(-19, g + 1, -9, -18, g + 3, -9, '#3a2aa8'); v.box(-35, g + 1, -10, -32, g + 5, -6, '#eceaf2'); v.box(-35, g + 3, -6, -32, g + 3, -6, '#4a3ad8');
  v.box(-20, g + 6, -12, -20, g + 12, -12, '#9a9aa8'); v.box(-22, g + 12, -12, -18, g + 12, -12, '#c8c8d4');
  for (let i = 0; i < 2; i++) { v.box(-36 + i * 0, g + 1, -2 + i * 4, -36, g + 2, -2 + i * 4, '#9a9aa8'); v.box(-39, g + 3, -3 + i * 4, -33, g + 3, -1 + i * 4, '#2a3a9a'); } }
// crater flag
const FX = 19, FZ = 1; v.box(FX, hAt(FX, FZ) + 1, FZ, FX, hAt(FX, FZ) + 7, FZ, '#e8e8f0'); v.box(FX + 1, hAt(FX, FZ) + 5, FZ, FX + 3, hAt(FX, FZ) + 7, FZ, '#4a3ad8');
// crater floor feature (white rock)
v.box(23, hAt(23, 6) + 1, 5, 25, hAt(23, 6) + 1, 7, '#e8e8f0');
scene.add(v.mesh());
const glow = new THREE.PointLight('#c8a0ff', 40, 16, 2); glow.position.set(FX + 2, hAt(FX, FZ) + 7, FZ); scene.add(glow);

// ---------- rover ----------
const rover = new THREE.Group(); { const b = new Vox(); b.box(-3, 2, -2, 3, 3, 2, '#9a9aaa'); b.box(-3, 1, -2, 3, 1, 2, '#3a2aa8'); b.box(-2, 4, -2, 1, 4, 2, '#1f3a9a'); b.set(-1, 4, 0, '#8fb0ff'); b.box(2, 4, 0, 2, 8, 0, '#9a9aaa'); b.box(1, 9, -1, 3, 10, 1, '#c8c8d4'); b.set(3, 10, 0, '#2a2a3a'); rover.add(b.mesh({ scale: 0.6 })); }
const wheels = []; for (const wx of [-1.6, 0.1, 1.8]) for (const wz of [-1.8, 1.8]) { const w = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.25, 0.7), new THREE.MeshLambertMaterial({ color: '#22222c' })); const hub = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.52), new THREE.MeshLambertMaterial({ color: '#7a7a8a' })); w.add(hub); w.position.set(wx, 0.62, wz); rover.add(w); wheels.push(w); }
scene.add(rover);
const RA = [[-17, -6], [-10, -3], [-1, -1], [8, 1], [17, 2]];
const RB = [[-17, -6], [-12, -12], [-2, -15], [9, -13], [15, -6], [17.5, -1], [17.5, 1.5]];
const segL = (R) => { const L = [0]; for (let i = 1; i < R.length; i++) L.push(L[i - 1] + Math.hypot(R[i][0] - R[i - 1][0], R[i][1] - R[i - 1][1])); return L; };
const LA = segL(RA), LB = segL(RB);
const at = (R, L, u) => { const d = clamp(u) * L[L.length - 1]; let i = 1; while (i < L.length - 1 && L[i] < d) i++; const k = (d - L[i - 1]) / (L[i] - L[i - 1]); return [lerp(R[i - 1][0], R[i][0], k), lerp(R[i - 1][1], R[i][1], k), Math.atan2(R[i][1] - R[i - 1][1], R[i][0] - R[i - 1][0])]; };
const dotsA = particles(80, { size: 0.6, emissive: '#ff8a2a' }); dotsA.material.color.set('#ffa040'); scene.add(dotsA);
const dotsB = particles(100, { size: 0.6, emissive: '#7a6aff' }); dotsB.material.color.set('#a090ff'); scene.add(dotsB);
const dust = particles(40, { size: 0.5 }); dust.material = new THREE.MeshLambertMaterial({ color: '#f0b884', transparent: true, opacity: 0.85 }); scene.add(dust);
const tracks = particles(160, { size: 1 }); tracks.geometry = new THREE.BoxGeometry(0.3, 0.06, 0.3); tracks.material.color.set('#8a3a1e'); scene.add(tracks);
const flash = el('<div style="position:absolute;inset:0;background:#fff;opacity:0"></div>');
const conf = burst(scene, { at: [FX + 1, hAt(FX, FZ) + 6, FZ], t0: 26.4, n: 70, colors: ['#ffd23f', '#ff8a2a', '#7a6aff', '#ffffff'], size: 0.5, speed: 8, up: 8, life: 2 });

st.onFrame((t) => {
  const showA = t >= 8.6 && t < 19.4, showB = t >= 20.4;
  for (let i = 0; i < 80; i++) { const [x, z] = at(RA, LA, i / 79); dotsA.setAt(i, x, hSm(x, z) + 1.2, z, 0, t, showA && i / 79 < prog(t, 8.6, 10) ? (i % 2 ? .7 : 1) : 0); } dotsA.done();
  for (let i = 0; i < 100; i++) { const [x, z] = at(RB, LB, i / 99); dotsB.setAt(i, x, hSm(x, z) + 1.2, z, 0, t, showB && i / 99 < prog(t, 20.4, 21.8) ? (i % 2 ? .7 : 1) : 0); } dotsB.done();
  let x, z, a, sink = 0, spin = 0, sp = 0;
  if (t < 10 || (t >= 19.4 && t < 21.2)) { [x, z, a] = at(RA, LA, 0); spin = 0; }
  else if (t < 19.4) { const u = 0.47 * prog(t, 10, 12.8, ease.out); [x, z, a] = at(RA, LA, u); sp = 1; spin = t * (t > 12.8 ? 14 : 9); sink = prog(t, 12.6, 14); }
  else { const u = prog(t, 21.2, 26, (k) => k); [x, z, a] = at(RB, LB, u); spin = t * 4; sp = u < 1 ? 0.4 : 0; }
  const y = hSm(x, z) + 1 - sink * 0.55; rover.position.set(x, y, z); rover.rotation.y = -a; rover.rotation.z = sink * 0.12 + (sp ? Math.sin(t * 20) * 0.01 : 0);
  wheels.forEach((w) => (w.rotation.z = -spin));
  for (let i = 0; i < 40; i++) { const ph = (t * 1.5 + i / 40) % 1; const on = t > 10.2 && t < 19.4 ? (t > 12.6 ? 1.3 : 0.7) : t > 21.2 && t < 26 ? 0.35 : 0; const dx = Math.cos(a) * -1.6, dz = Math.sin(a) * -1.6; dust.setAt(i, x + dx + Math.sin(i * 2.1) * ph * 1.6, y + ph * 2.2, z + dz + Math.cos(i * 1.3) * ph * 1.6, t, t, on * (1 - ph)); } dust.done();
  for (let i = 0; i < 160; i++) { const B = i >= 80; const u = (i % 80) / 79; const [px, pz, pa] = B ? at(RB, LB, u) : at(RA, LA, u * 0.47); const prog0 = B ? prog(t, 21.2, 26, (k) => k) : 0.47 * prog(t, 10, 12.8, ease.out) / 0.47; const vis = B ? t > 21.2 && u < prog0 : t > 10 && t < 19.4 && u < prog0; const s = (i % 2 ? 1 : -1) * 0.9; tracks.setAt(i, px - Math.sin(pa) * s, hSm(px, pz) + 1.05, pz + Math.cos(pa) * s, 0, -pa, vis ? 1 : 0); } tracks.done();
  conf(t); glow.intensity = 30 + Math.sin(t * 3) * 8;
  flash.style.opacity = t > 26 && t < 26.5 ? 1 - prog(t, 26, 26.5) : 0;
  // camera
  let ang, dist, hgt, look = [0, 0, 0], dy = -1.5;
  if (t < 4.2) { const k = prog(t, 0, 4.2); ang = lerp(-0.95, -0.5, ease.inOut(k)); dist = lerp(128, 100, ease.out(k)); hgt = lerp(90, 68, k); dy = 3; }
  else if (t < 8.4) { const k = prog(t, 4.2, 8.4); ang = lerp(-0.5, -0.42, k); dist = lerp(86, 78, k); hgt = lerp(60, 54, k); look = [-6, 2, -4]; dy = -4; }
  else if (t < 16.2) { const k = prog(t, 8.4, 16.2); ang = lerp(-0.42, -0.18, k); dist = lerp(70, 40, ease.inOut(k)); hgt = lerp(50, 28, ease.inOut(k)); { const q = prog(t, 9.6, 12); look = [lerp(-6, x + 1, q), lerp(2, hSm(x, z), q), lerp(-4, z + 1, q)]; dy = lerp(-1.5, 2.5, q); } }
  else if (t < 20.4) { const k = prog(t, 16.2, 20.4); ang = lerp(-0.18, -0.36, k); dist = lerp(40, 74, ease.inOut(k)); hgt = lerp(28, 52, ease.inOut(k)); look = [lerp(-1, 0, k), 2, lerp(-1, -4, k)]; }
  else if (t < 26.4) { const k = prog(t, 20.4, 26.4); ang = lerp(-0.36, 0.1, ease.inOut(k)); dist = lerp(66, 44, k); hgt = lerp(48, 32, k); { const q = prog(t, 20.6, 22); look = [lerp(-4, x + 1, q), lerp(2, hSm(x, z), q), lerp(-6, z + 1, q)]; dy = lerp(-1.5, 2.5, q); } }
  else if (t < 31) { const k = prog(t, 26.4, 31); ang = lerp(0.1, 0.32, k); dist = lerp(44, 58, k); hgt = lerp(30, 40, k); look = [lerp(19, 17, k), 3, lerp(1, 0, k)]; }
  else { const k = prog(t, 31, 37); ang = lerp(0.32, 0.75, k); dist = lerp(100, 140, k); hgt = lerp(70, 96, k); dy = 3; }
  camera.fov = 30; camera.updateProjectionMatrix(); camera.position.set(Math.sin(ang) * dist + look[0], hgt + look[1], Math.cos(ang) * dist + look[2]); camera.lookAt(look[0], look[1] + dy, look[2]);
});

// ---------- UI ----------
const ui = []; const A = (f) => ui.push(f);
const L = makeLab(A);
const fade = fader(); A((t) => fade(t < 0.5 ? 1 - prog(t, 0, 0.5) : t > DUR - 0.7 ? prog(t, DUR - 0.7, DUR) : 0));
L.header({ name: 'AI Inventor Lab', sub: 'STEM CLUB', color: '#5b4ce0', shade: '#3a2aa8', icon: ICONS.gear, tag: 'L4', tagColor: '#ff8a2a', tagText: '#13202b', task: 'Drive the rover to the crater and send back a photo', tOut: 30.8, size: 33 });
L.pills({ stars: 5, xp: 990, xpColor: '#5b4ce0', starsAfter: 8, xpAfter: 1110, tAfter: 26.8, tOut: 30.8 });
const pg = el('<div class="prog"><small>YOUR PROGRAM</small><div class="blk ev">When mission starts</div><div class="blk mv">drive <span class="slot" data-s>?</span></div><div class="blk sn" data-p>at the crater: take a photo</div></div>', { x: 1874, y: 330, anchor: 'tr' });
A(cue(pg, 1.6, 8.4, { from: 'right' })); 
const CARDS = [['A', 'Get to the crater as fast as you can'], ['B', 'Drive slowly and steer round soft sand'], ['C', 'Take lots of photos on the way']];
L.cards('TELL THE AI HELPER HOW TO DRIVE', CARDS, 4.2, 8.6, 6.3, 0);
L.helper('“Fast” means top speed in a straight line. Driving through the sand.', 72, 8.8, 16.2);
const pg2 = el('<div class="prog"><small>YOUR PROGRAM</small><div class="blk ev">When mission starts</div><div class="blk mv">drive <span class="slot">top speed, straight</span></div><div class="blk sn">at the crater: take a photo</div></div>', { x: 46, y: 300 }); A(cue(pg2, 9.4, 18.2, { from: 'left' }));
L.alert('Rover stuck in soft sand', 13.6, 16.3, { y: 780 });
L.facil('Rovers on Mars drive very slowly. What did “fast” leave out?', 16.4, 20.6, { color: '#ffd23f', ink: '#13202b', y: 520 });
L.cards('TRY A CLEARER CARD', CARDS, 18.4, 21.4, 19.9, 1);
L.helper('Slow and safe: wide wheels, under 5 km/h, going round the sand.', 91, 21.6, 26.2);
const pg3 = el('<div class="prog"><small>YOUR PROGRAM</small><div class="blk ev">When mission starts</div><div class="blk mv">drive <span class="slot">wide wheels, under 5 km/h</span></div><div class="blk mv" style="background:#7a6aff">avoid <span class="slot">soft sand</span></div><div class="blk sn">at the crater: take a photo</div></div>', { x: 46, y: 300 }); A(cue(pg3, 21.6, 30.8, { from: 'left' }));
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 16.9l-5.6 2.9 1.1-6.2-4.6-4.4 6.3-.9z" fill="#ffc83d" stroke="#e8a020" stroke-width=".8"/></svg>';
const stars = el(`<div class="bigstars" style="display:flex;gap:30px;align-items:flex-end">${STAR}<span style="transform:translateY(-30px)">${STAR}</span>${STAR}</div>`, { x: 1100, y: 330, anchor: 'c' }); A(cue(stars, 26.8, 30.8));
const lvl = el('<div class="lvl">Level 5 unlocked<div class="bar"><i data-b></i></div></div>', { x: 1100, y: 500, anchor: 'c' }); A(cue(lvl, 27.2, 30.8)); A((t) => { lvl.querySelector('[data-b]').style.width = 100 * prog(t, 27.4, 28.6) + '%'; });
const pola = el('<div class="pola"><img data-i>Crater photo #1</div>', { x: 1874, y: 1040, anchor: 'tr' }); pola.style.transformOrigin = 'center';
let snapped = false; A((t) => { if (t >= 26.05 && !snapped) { pola.querySelector('[data-i]').src = st.renderer.domElement.toDataURL('image/jpeg', 0.8); snapped = true; } const k = prog(t, 26.3, 27.1, ease.back); pola.style.opacity = t > 26.3 && t < 31 ? 1 : 0; pola.style.transform = `translate(-100%,-100%) rotate(${lerp(-14, 4, k)}deg) scale(${lerp(1.6, 1, k)})`; });
const dimEnd = el('<div style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at center, rgba(10,8,40,.2), rgba(10,8,40,.55))"></div>'); A(cue(dimEnd, 31.2, null, { from: 'fade', dur: 0.8 }));
const title = titleCard('AI Inventor <span class="hl">Lab</span>', 'Program the rover. Check what the AI thinks you meant.', { chip: 'A DeltaOps Learning AI lab · STEM clubs' }); A(cue(title, 31.4, null, { from: 'pop', dur: 0.8 }));
st.onFrame((t) => ui.forEach((f) => f(t)));
window.__duration = DUR;
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>
